# Signalbox runner configuration, version 1.
#
# Replace paths with absolute paths owned by the runner's effective user. The
# runner reads credential structure at startup but does not read secret bytes
# for the pure echo child.
version = 1
capability_classes = ["echo"]
tools = ["echo"]
sandbox_profiles = ["ambient"]
daemon_socket_path = "/run/user/1000/signalbox-runner.sock"
runner_root = "/var/lib/signalbox-runner"
bubblewrap_path = "/usr/bin/bwrap"
read_only_paths = ["/usr"]
allowed_network_hosts = ["github.com"]
git_author_name = "Signalbox Runner"
git_author_email = "runner@example.invalid"

# This exact profile name is admitted by signalboxd's local runner
# catalog. Pure echo execution requires no credential approval.
[credentials.github-runner]
file = "/run/secrets/signalbox-github-token"
injection_env = "GH_TOKEN"

# Anonymous repositories are advertised for acquisition. Credential-bound entries
# remain local and unavailable for provisioning; secret paths and values stay local.
[repositories.signalbox]
clone_url = "https://github.com/KeenWill/signalbox.git"
credential_profile = "github-runner"
