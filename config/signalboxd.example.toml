# The three catalogs below serve the families this file leaves commented out.
# Uncomment one together with its credential profile, adapter mapping, and
# process table above. Inside a commented catalog a doubly commented line is
# prose: removing one comment level from the block leaves the configuration
# active and the prose a comment.
#
# One rule shapes every spelling below. The daemon routes one `provider_model`
# to exactly one adapter, so two families may not spell the same model the same
# way, and a catalog that serves a provider through two surfaces must give each
# surface its own spelling. Each catalog therefore claims only spellings the
# others leave free and records what it gave up; a deployment that would rather
# serve a model through the other family moves the row instead of copying it.
#
# Except for a catalog that records a later date, every capability value below
# was read from its provider on 2026-08-06 and will go stale. A row whose value
# could not be established from a provider source says so in place and carries
# the conservative value instead.

# OpenAI Chat Completions catalog, read from the provider's model, pricing, and
# deprecation pages under developers.openai.com/api/docs on 2026-08-06. Every
# row is a Chat Completions model: the `-pro` variants serve only the Responses
# API and are omitted, as are the retiring o-series, GPT-4o, and `-chat-latest`
# spellings. Context windows and the recorded hard caps are the provider's;
# `max_output_tokens` remains this deployment's budget, as the header states.
#
# Two provider behaviors bind these rows. Chat Completions rejects a request
# that carries function tools together with a reasoning effort other than
# "none" on GPT-5.4 and later, so a selection the daemon composes tools into
