# Aliases carry no name field: an alias is an opaque identity clients name
# directly, and each one freezes to its selection at acceptance time. The
# comments below record the intent of each example alias.

# "fable" -> claude-fable-5
[[aliases]]
alias_id = "f1e8567c-5fa0-42fe-95fb-5523e88ce631"
selection_id = "c70bd4e1-3699-458c-ae03-310a77763807"

