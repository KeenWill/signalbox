# Signalbox daemon model configuration, version 1.
#
# Every identity below is an example. Generate fresh UUIDs for a real
# deployment: `selection_id` is the immutable key clients name, `target_id` is
# the pinned provider/model identity, and both must stay stable across
# restarts once any stored call references them.
#
# `max_output_tokens` is the deployment's per-selection output ceiling.
# Anthropic receives it as the provider request limit. Codex CLI has no
# provider-side control, so its adapter renders the value as advisory context
# and the daemon rejects reported over-limit usage after completion. It is an
# operator budget, not a declaration of the model's capability: the working
# default below is well under each model's hard cap, which is recorded beside
# the entry. Raise it per selection as the deployment requires, up to but never
# above the model's cap.
version = 1

# One profile is one provider account. Names are opaque to code — call them
# whatever the deployment calls them. billing_kind states how calls through this
# account are billed: api_metered produces real dollar cost, subscription
# produces metered-equivalent cost. Keep a name's billing meaning stable, and use
# a new name when an authentication update changes it. `delivery` states how the
# secret reaches the provider and which further fields the profile carries;
# anthropic admits "file", codex_cli admits "ambient", "file", "codex_home", and
# "oauth". This build supplies a surface for "file" on anthropic and "ambient" on
# codex_cli; the other two are rejected at startup until the slice delivering
# them lands, rather than accepted and ignored. No credential path is opened and
# no provider is contacted at startup.
[[credential_profiles]]
name = "anthropic-primary"
adapter = "anthropic"
billing_kind = "api_metered"
delivery = "file"
file = "/run/secrets/anthropic-primary"

# A second account for the same provider. Pointing two profiles at one secret
# does not create a second account; it gives one account two names and two
# independent judgments about the same remaining quota.
[[credential_profiles]]
name = "anthropic-overflow"
adapter = "anthropic"
billing_kind = "api_metered"
delivery = "file"
file = "/run/secrets/anthropic-overflow"

# A pool is the set of profiles that may substitute for one another. Priority
# lives on the membership, not the profile, so one account can rank differently
# in different pools; equal priorities are resolved by tie_break, and gaps let a
# later profile take an intermediate rank without renumbering.
#
# Omitted trigger keys select "stay", which is the pre-pool behavior: record the
# failure honestly and do not move. switch_now is admitted only for the three
# availability causes, because only those prove the request was not accepted.
[[credential_pools]]
name = "anthropic-main"
tie_break = "first_listed"        # first_listed | round_robin | least_used
on_pool_exhausted = "park"        # park | fail
members = [
  { profile = "anthropic-primary", priority = 1 },
  { profile = "anthropic-overflow", priority = 2 },
]
on_quota_exhausted = "switch_now"
on_rate_limited = "switch_now"
on_overloaded = "switch_next_turn"
on_credential_rejected = "quarantine"

# least_used and headroom_reserve_percent need an adapter that reports remaining
# capacity. No adapter in this build does, so configuring either fails startup
# rather than sitting inert.

[[adapter_mappings]]
model_family = "anthropic"
adapter = "anthropic"
credential_pool = "anthropic-main"

# To serve a Codex model family, add profiles, a pool, this mapping, and the
# codex_cli table. Codex admits four deliveries; pick one per profile.
#
# delivery = "ambient" — the CLI resolves its own login and the daemon supplies
# nothing. This is the delivery this build serves today, and the one that cannot
# express a multi-account pool: two ambient profiles are two names for one login.
# [[credential_profiles]]
# name = "codex-ambient"
# adapter = "codex_cli"
# billing_kind = "subscription"
# delivery = "ambient"
#
# delivery = "oauth" — the daemon owns a rotating authorization it provisioned
# itself, and hands each invocation a scratch home holding only an access token.
# This is the delivery that supports several subscription accounts in one pool:
# nothing is shared or written back, so concurrent invocations cannot collide.
# The OAuth client and endpoints are yours to choose; nothing here is a
# build-provided constant. Provision with:
#   signalbox credential provision --profile codex-subscription-primary
# [[credential_profiles]]
# name = "codex-subscription-primary"
# adapter = "codex_cli"
# billing_kind = "subscription"
# delivery = "oauth"
# client_id = "<the OAuth client this deployment presents>"
# token_url = "https://<provider>/oauth/token"
# device_authorization_url = "https://<provider>/deviceauth/usercode"
# scopes = ["<scope>"]
#
# delivery = "codex_home" — the daemon uses a login an operator established by
# hand. Concurrent invocations are allowed by default; that store has no file
# locking, but the CLI adopts a token another process wrote rather than
# refreshing again, so the residual race is narrow and its consequence is a
# quarantine the pool fails over from. Set max_concurrent_invocations to trade
# throughput for avoiding it. Two profiles may not name the same directory.
# [[credential_profiles]]
# name = "codex-local-a"
# adapter = "codex_cli"
# billing_kind = "subscription"
# delivery = "codex_home"
# codex_home = "/var/lib/signalbox/codex/account-a"
#
# [[credential_profiles]]
# name = "codex-local-b"
# adapter = "codex_cli"
# billing_kind = "subscription"
# delivery = "codex_home"
# codex_home = "/var/lib/signalbox/codex/account-b"
#
# delivery = "file" — an API key, read per preparation and supplied to the fresh
# process under env_key. Metered rather than subscription, and the one Codex
# delivery the ordinary rotation policy covers end to end.
# [[credential_profiles]]
# name = "codex-api"
# adapter = "codex_cli"
# billing_kind = "api_metered"
# delivery = "file"
# file = "/run/secrets/codex-api"
# env_key = "OPENAI_API_KEY"
#
# [[credential_pools]]
# name = "codex-main"
# tie_break = "first_listed"
# on_pool_exhausted = "fail"
# members = [{ profile = "codex-subscription-primary", priority = 1 }]
#
# [[adapter_mappings]]
# model_family = "codex"
# adapter = "codex_cli"
# credential_pool = "codex-main"
#
# [codex_cli]
# executable = "/absolute/path/to/codex"
# working_directory = "/absolute/path/to/workspace"

# This exact prompt is deployment-owned and used as the system instruction for
# every dedicated summary call. Change it only when future compactions should
# observe the new instruction.
[compaction]
prompt = "Summarize the prior conversation faithfully for continuation."

# Maximum exact bytes retained in memory while assembling one chunked
# conversation import. Omit this table to use the 256 MiB default.
[conversation_import]
max_source_bytes = 268435456

# web_fetch can issue outbound requests only to these exact origins. Approval
# posture is configured separately below. An absent or empty list disables its
# outbound requests. Add an origin only when the deployment accepts it as an
# egress recipient for untrusted model context.
[web_fetch]
allowed_origins = [
  "https://api.github.com",
  "https://crates.io",
  "https://docs.rs",
  "https://github.com",
]

# Tool dependencies use the same closed mapping-table pattern as model
# adapters. The two GitHub-backed families share one non-secret profile; the
# credential value still arrives only through GITHUB_TOKEN_FILE. Workspace
# tools pin this exact root, and conversation tools use daemon-composed
# application reads over the configured database.
[[tool_mappings]]
family = "code_host"
adapter = "github"
credential_profile = "github-primary"
egress_policy = "github_api_only"

[[tool_mappings]]
family = "github"
adapter = "github"
credential_profile = "github-primary"
egress_policy = "github_api_only"

[[tool_mappings]]
family = "workspace"
adapter = "local"
workspace_root = "/srv/signalbox/workspace"

[[tool_mappings]]
family = "conversations"
adapter = "application"

# Exact-name overrides are optional. Any composed tool omitted here retains its
# existing permission default and session-blanket behavior.
[tool_approval_postures]
web_fetch = "human"
web_search = "human"
# Uncomment exact names to park those tools for the configured approval judge.
# github_pull_request_publish_review = "delegated"
# write_file = "delegated"

# An optional fixed judge selection must name one [[models]] selection_id. When
# this table is absent, the judge reuses the request-producing call's direct
# selection, including its existing adapter and credential mapping.
# [approval_judge]
# selection_id = "c70bd4e1-3699-458c-ae03-310a77763807"

# Anthropic's most capable widely released model. Hard cap: 128000.
[[models]]
selection_id = "c70bd4e1-3699-458c-ae03-310a77763807"
target_id = "c74d2c41-8c70-4537-ab5d-7bbeac25562a"
model_family = "anthropic"
provider_model = "claude-fable-5"
max_output_tokens = 8192
context_window_tokens = 200000
# Rates are decimal USD strings per million tokens. Declare the complete
# five-field versioned set or omit all five; omission yields no dollar figure.
rate_version = "example-2026-08-01"
input_usd_per_million_tokens = "3"
output_usd_per_million_tokens = "15"
cache_creation_input_usd_per_million_tokens = "3.75"
cache_read_input_usd_per_million_tokens = "0.30"

