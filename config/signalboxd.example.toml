# Signalbox daemon model configuration, version 1.
#
# Every identity below is an example. Generate fresh UUIDs for a real
# deployment: `selection_id` is the immutable key clients name, `target_id` is
# the pinned provider/model identity, and both must stay stable across
# restarts once any stored call references them.
#
# `max_output_tokens` is the deployment's per-selection output ceiling.
# Anthropic receives it as the provider request limit, OpenAI as the Chat
# Completions completion limit, and Claude Code as its output-token environment
# override. Codex CLI has no provider-side control, so that adapter renders the
# value as advisory context and the daemon rejects reported over-limit usage
# after completion. It is an operator budget, not a declaration of the model's
# capability: the working default below is well under each model's hard cap,
# which is recorded beside the entry. Raise it per selection as the deployment
# requires, up to but never above the model's cap. The daemon also reserves this
# complete budget before a Codex continuation. Keep it aligned with the reply
# budget the deployment actually needs: an inflated advisory value cannot make
# the CLI emit more, but it can force otherwise-unnecessary early compaction.
version = 1

[numeric_bounds]
# Reconciliation work performed before observing another repository wake.
repository_reconciliation_quantum = 16
# Time a progressing webhook drain works before yielding and rearming itself.
webhook_drain_work_budget = "45s"
# Physical database sessions established before daemon work begins.
fenced_pool_min_connections = 48
# Delay between checks that restore retired fenced pool sessions.
fenced_pool_floor_reconciliation_interval = "5s"
# Time allowed for one fenced pool floor restoration attempt.
fenced_pool_floor_reconciliation_attempt_bound = "30s"
# Concurrent process-protocol snapshot readers.
max_concurrent_snapshot_readers = 8
# Replicas retained for one immutable blob.
max_blob_replica_count = 32
# Exact tags retained in one session metadata value.
max_session_metadata_tags = 256
# Attributes retained in one session metadata value.
max_session_metadata_attributes = 256
# Required tags admitted in one metadata filter.
max_session_metadata_required_tags = 256
# UTF-8 bytes admitted in one session system prompt.
max_system_prompt_utf8_bytes = 1048576
# UTF-8 bytes retained in one imported-text preview.
max_imported_text_preview_utf8_bytes = 256
# Concerns retained in one review-orchestration attempt.
max_review_orchestration_concerns = 32
# Unicode scalars retained in one imported-conversation display title.
max_imported_conversation_display_title_scalars = 256
# Time allowed for runtime cleanup after scheduler work drains.
graceful_shutdown_cleanup_window = "30s"
# Time allowed for one complete model-provider exchange.
model_exchange_timeout = "600s"
# Time allowed for the startup probe that binds Codex CLI to its exact pin.
codex_cli_version_probe_bound = "10s"
# Detached recovery attempts made for one expired scheduler pass.
expired_pass_recovery_attempts = 4
# Time allowed for one expired-pass recovery database operation.
expired_pass_recovery_attempt_bound = "3s"
# Delay after an expired-pass recovery lock refusal.
expired_pass_recovery_lock_retry_delay = "6s"
# Delay after an ambiguous expired-pass recovery failure.
expired_pass_recovery_conservative_retry_delay = "120s"
# Time allowed for one convergence census provider request.
convergence_sweep_request_timeout = "30s"
# GraphQL connection pages read for one convergence census.
max_convergence_sweep_connection_pages = 100
# Convergence census targets queried concurrently.
max_concurrent_convergence_sweep_targets = 8
# Transport attempts made for one convergence census request.
max_convergence_sweep_request_attempts = 3
# Delay between convergence census request attempts.
convergence_sweep_request_retry_delay = "250ms"
# Initial retry delay after a convergence census failure.
convergence_sweep_retry_backoff_base = "60s"
# Longest retry delay after repeated convergence census failures.
convergence_sweep_retry_backoff_cap = "900s"
# Stale turns terminalized during one liveness scan.
terminalizations_per_liveness_scan = 64
# Time allowed for one slot-held liveness recovery transaction.
turn_liveness_recovery_attempt_bound = "10s"
# Automatic reconciliation transactions performed in one liveness scan.
automatic_reconciliations_per_liveness_scan = 64
# Time allowed for one automatic reconciliation transaction.
automatic_reconciliation_attempt_bound = "60s"
# Credentialed targets retained by one convergence sweep.
max_convergence_sweep_targets = 256
# Longest configured convergence census interval.
max_convergence_sweep_interval = "300s"
# Longest configured delay after a convergence dispatch.
max_convergence_sweep_cool_off = "1800s"
# Initial delay before automatically resuming a failed goal turn.
automatic_resume_base_backoff = "120s"
# Longest delay between automatic goal resumption attempts.
automatic_resume_backoff_cap = "1800s"
# Automatic resumption attempts spent by one failed goal turn.
automatic_resume_attempt_budget = 20
# Automatic resumption attempts one blocked goal may ever make, spent or exempt.
automatic_resume_attempt_ceiling = 100
# Delay between startup automatic-resumption inventory retries.
automatic_resume_startup_retry_delay = "1s"
# Time allowed to reap a killed model-provider child.
post_kill_reap_bound = "5s"
# Time without durable progress before an active turn is stale.
stale_active_turn_bound = "1800s"
# Time between turn-liveness scans.
turn_liveness_scan_interval = "60s"
# Initial delay before ambiguous-operation reconciliation.
automatic_reconciliation_base_backoff = "120s"
# Longest delay between ambiguous-operation reconciliation attempts.
automatic_reconciliation_backoff_cap = "1800s"
# Automatic reconciliation attempts spent by one ambiguous operation.
automatic_reconciliation_attempt_budget = 5
# Buffered terminal input messages.
terminal_input_channel_capacity = 1
# UTF-8 bytes admitted in one user message.
max_message_utf8_bytes = 1048576
# Smallest session-metadata page accepted from a client.
min_metadata_page_size = 1
# Largest session-metadata page accepted from a client.
max_metadata_page_size = 100
# Findings retained from one review run.
max_review_findings_per_run = 32
# Automatic model tool rounds spent in one turn.
max_automatic_tool_rounds_per_turn = 32
# Recorded attempts allowed on one credential within a turn.
max_same_credential_attempts_per_turn = 2
# Required tags admitted by one metadata query.
max_required_tags = 256
# Time between scheduler reconciliation sweeps.
reconciliation_sweep_interval = "1s"
# Buffered scheduler nudges.
nudge_buffer_capacity = 1024
# Authoritative scheduler passes admitted concurrently.
scheduler_pass_admission_cap = 16
# Time one authoritative scheduler pass may occupy admission.
scheduler_pass_occupancy_bound = "3600s"
# Provider diagnostic bytes retained in one native message.
max_native_message_bytes = 2048
# Time a terminalization waits for the scheduler row.
terminalization_lock_wait = "250ms"
# Time a terminalization waits for a pooled connection.
terminalization_acquire_wait = "250ms"
# Time a terminalization write waits for a contended row.
terminalization_write_lock_wait = "1s"
# Bytes retained in one disposable PostgreSQL test database.
disposable_postgres_state_ceiling_bytes = 536870912
# Provider model-identity bytes retained in diagnostics.
diagnostic_model_identity_limit = 128
# Time allowed for one ordinary code-host request.
code_host_request_timeout = "30s"
# CI job-log bytes retained in one code-host result.
max_job_log_bytes = 65536
# Stack comparisons performed concurrently at the code host.
max_stack_comparisons_in_flight = 8
# Text bytes retained in one code-host result.
max_code_host_result_text_bytes = 65536
# Items retained in one paginated code-host result.
max_code_host_result_items = 100
# Repository-file bytes retained in one code-host result.
max_repository_file_content_bytes = 65536
# Time an owned session has to start working before it is retired.
session_admission_deadline = "900s"
# Time an active or recovering session may make no progress before it parks.
session_active_stall_deadline = "1800s"
# Time a waiting session may wait before it parks for a human.
session_waiting_deadline = "86400s"
# How often the daemon refreshes the exported lifecycle-metric gauges.
session_lifecycle_metric_scan_interval = "300s"

# Blob bytes live outside PostgreSQL. Each deployment generates and then keeps
# one namespace UUID per physical store. Both directories must already exist,
# be owned by the daemon user, and have exact mode 0700.
[blob_storage]
version = 1
staging_directory = "/var/lib/signalbox/blob-staging"
max_blob_bytes = 1099511627776

[[blob_storage.stores]]
name = "primary"
namespace_id = "5a100001-0000-4000-8000-000000000001"
kind = "filesystem"
root_directory = "/var/lib/signalbox/blobs-primary"

[blob_storage.routes]
user_attachment = "primary"
tool_artifact = "primary"
imported_source = "primary"
generated_artifact = "primary"

# Omitted members inherit. Nullable knobs also accept "provider_default" to
# preserve an explicit clear in durable provenance; fast_mode accepts
# "enabled" or "disabled". A service tier is a provider-tagged inline table,
# for example { provider = "anthropic", value = "standard_only" }.
[model_settings]
# reasoning_level = "high"
# fast_mode = "disabled"
# service_tier = { provider = "anthropic", value = "auto" }

# Named profiles use the same three members. A model opts into at most one with
# settings_profile = "deliberate"; profile/global values must be admitted by
# that model's capability record.
# [[model_settings_profiles]]
# name = "deliberate"
# reasoning_level = "high"

# One profile is one provider account. Names are opaque to code — call them
# whatever the deployment calls them. billing_kind states how calls through this
# account are billed: api_metered produces real dollar cost, subscription
# produces metered-equivalent cost. Keep a name's billing meaning stable, and use
# a new name when an authentication update changes it. `delivery` states how the
# secret reaches the provider and which further fields the profile carries.
# Which (adapter, delivery) pairs are admitted, and which of those this build
# actually supplies a surface for, are the closed set stated in
# docs/spec/configuration-and-credentials.md; a pair outside it is a startup
# error rather than an inert setting. Read the set there rather than here, so
# there is one place to change when an adapter gains a delivery. No credential
# path is opened and no provider is contacted at startup.
[[credential_profiles]]
name = "anthropic-primary"
adapter = "anthropic"
billing_kind = "api_metered"
delivery = "file"
file = "/run/secrets/anthropic-primary"

# A second account for the same provider. Pointing two profiles at one secret
# does not create a second account; it gives one account two names and two
# independent judgments about the same remaining quota.
[[credential_profiles]]
name = "anthropic-overflow"
adapter = "anthropic"
billing_kind = "api_metered"
delivery = "file"
file = "/run/secrets/anthropic-overflow"

# The checked-in Codex profile represents the one login already visible to the
# daemon user. It is harmless until a mapping selects its pool, and lets the
# commented Codex mapping and catalog activate as one validated example.
[[credential_profiles]]
name = "codex-ambient"
adapter = "codex_cli"
billing_kind = "subscription"
delivery = "ambient"

# A pool is the set of profiles that may substitute for one another. Priority
# lives on the membership, not the profile, so one account can rank differently
# in different pools; equal priorities are resolved by tie_break, and gaps let a
# later profile take an intermediate rank without renumbering.
[[credential_pools]]
name = "anthropic-main"
tie_break = "first_listed"
on_pool_exhausted = "park"
members = [
  { profile = "anthropic-primary", priority = 1 },
  { profile = "anthropic-overflow", priority = 2 },
]
# This parser slice validates and retains trigger policy but does not yet observe
# provider failures, rotate members, or quarantine profiles. Calls continue to
# select the preferred member above until the selection slice lands.
#
# switch_now needs typed proof that the provider refused before accepting, which
# only a decoded native error envelope supplies. The Anthropic mapping names
# rate_limit_error and overloaded_error but has no quota token, so
# on_quota_exhausted = "switch_now" is a startup failure here and the next turn
# carries the substitution instead.
on_quota_exhausted = "switch_next_turn"
on_rate_limited = "switch_now"
on_overloaded = "switch_next_turn"
on_credential_rejected = "quarantine"

[[credential_pools]]
name = "codex-main"
tie_break = "first_listed"
on_pool_exhausted = "fail"
members = [{ profile = "codex-ambient", priority = 1 }]

# least_used and headroom_reserve_percent need an adapter that reports remaining
# capacity. No adapter in this build does, so configuring either fails startup
# rather than sitting inert.

[[adapter_mappings]]
model_family = "anthropic"
adapter = "anthropic"
credential_pool = "anthropic-main"

# To serve a Codex model family, add profiles, a pool, this mapping, and the
# codex_cli table. Codex admits four deliveries; pick one per profile.
#
# delivery = "ambient" — the CLI resolves its own login and the daemon supplies
# nothing. This is the delivery the checked-in codex-ambient profile uses, and
# the one that cannot express a multi-account pool: two ambient profiles are two
# names for one login.
#
# delivery = "oauth" — the daemon owns a rotating authorization it provisioned
# itself, and hands each invocation a scratch home holding only an access token.
# This is the delivery that supports several subscription accounts in one pool:
# nothing is shared or written back, so concurrent invocations cannot collide.
# The OAuth client and endpoints are yours to choose; nothing here is a
# build-provided constant. This build has no provisioning command or runtime
# delivery for this committed syntax, so uncommenting it remains a typed startup
# error until the OAuth delivery slice lands.
# [[credential_profiles]]
# name = "codex-subscription-primary"
# adapter = "codex_cli"
# billing_kind = "subscription"
# delivery = "oauth"
# client_id = "<the OAuth client this deployment presents>"
# token_url = "https://<provider>/oauth/token"
# device_authorization_url = "https://<provider>/deviceauth/usercode"
# scopes = ["<scope>"]
#
# delivery = "codex_home" — the daemon uses a login an operator established by
# hand. Concurrent invocations are allowed by default; that store has no file
# locking, but the CLI adopts a token another process wrote rather than
# refreshing again, so the residual race is narrow. If it does fire, the
# provider rejects that profile's credential until an operator re-provisions it,
# and what the pool does about that is whichever on_credential_rejected action
# the pool configures — set that to "quarantine" if you want the profile taken
# out of rotation and the pool failing over meanwhile. Set
# max_concurrent_invocations to trade throughput for avoiding the race. Two
# profiles may not resolve to the same login identity, even by different paths.
# This build has no runtime delivery for this committed syntax, so uncommenting
# either profile remains a typed startup error until the codex_home delivery
# slice lands.
# [[credential_profiles]]
# name = "codex-local-a"
# adapter = "codex_cli"
# billing_kind = "subscription"
# delivery = "codex_home"
# codex_home = "/var/lib/signalbox/codex/account-a"
#
# [[credential_profiles]]
# name = "codex-local-b"
# adapter = "codex_cli"
# billing_kind = "subscription"
# delivery = "codex_home"
# codex_home = "/var/lib/signalbox/codex/account-b"
#
# Committed unimplemented functionality: delivery = "file" will supply an API
# key to each fresh Codex process under env_key and use api_metered billing. No
# present Codex adapter surface delivers it, so uncommenting this recipe fails
# startup until that child implementation lands.
# [[credential_profiles]]
# name = "codex-api"
# adapter = "codex_cli"
# billing_kind = "api_metered"
# delivery = "file"
# file = "/run/secrets/codex-api"
# env_key = "OPENAI_API_KEY"
#

# [[adapter_mappings]]
# model_family = "codex"
# adapter = "codex_cli"
# credential_pool = "codex-main"
#
# [codex_cli]
# executable = "/absolute/path/to/codex"
# working_directory = "/absolute/path/to/workspace"
# model_context_window_overrides = { "gpt-5.6-sol" = 1000000 }

# To serve a Claude Code model family with an API credential, provision the file
# named by the profile below, then add this mapping and process configuration.
# The adapter copies its per-preparation value into a private Claude settings
# store without passing the key directly in the child environment.
# `mcp_bridge_executable` names the `signalbox-claude-mcp-bridge` program this
# workspace builds: the adapter spawns it as Claude Code's only tool server, and
# the deployment names it explicitly rather than having the daemon guess a path
# from its own image. That name takes either form. A bare
# program name, as below, is resolved once at startup against the daemon's own
# PATH: the form for a deployment that installs the bridge alongside the daemon,
# which is what `devenv up` does for the dev instance. Any other value is a
# path, is used verbatim, and consults no PATH: the form for a bridge the
# daemon's PATH does not reach. Either way it must end at an absolute path
# naming an existing regular file. Claude Code exposes no service tier, so a
# Claude model declares reasoning levels and fast mode only. Uncomment the
# Claude Code catalog rows below with it.

# [[credential_profiles]]
# name = "claude-api-primary"
# adapter = "claude_cli"
# billing_kind = "api_metered"
# delivery = "file"
# file = "/run/secrets/claude-api-primary"
# env_key = "ANTHROPIC_API_KEY"
#
# [[credential_pools]]
# name = "claude-code-main"
# tie_break = "first_listed"
# on_pool_exhausted = "fail"
# members = [{ profile = "claude-api-primary", priority = 1 }]
#
# [[adapter_mappings]]
# model_family = "claude_code"
# adapter = "claude_cli"
# credential_pool = "claude-code-main"
#
# [claude_cli]
# executable = "/absolute/path/to/claude"
# mcp_bridge_executable = "signalbox-claude-mcp-bridge"
# working_directory = "/absolute/path/to/workspace"

# To serve an OpenAI model family, add this file profile, pool, and mapping.
# The file is read per preparation, just like an Anthropic file profile.

# [[credential_profiles]]
# name = "openai-primary"
# adapter = "openai"
# billing_kind = "api_metered"
# delivery = "file"
# file = "/run/secrets/openai-primary"
#
# [[credential_pools]]
# name = "openai-main"
# tie_break = "first_listed"
# on_pool_exhausted = "fail"
# members = [{ profile = "openai-primary", priority = 1 }]
#
# [[adapter_mappings]]
# model_family = "openai"
# adapter = "openai"
# credential_pool = "openai-main"

# A provider that implements fast mode through a distinct serving identity
# declares that identity here without a selection_id. A selectable [[models]]
# record may then use fast_mode = "alternate_target" and point fast_target_id
# at this target. Serving targets never appear in the client capability catalog.
# [[serving_targets]]
# target_id = "fa57fa57-fa57-4a57-8a57-fa57fa57fa57"
# model_family = "anthropic"
# provider_model = "synthetic-fast-serving-identity"
# max_output_tokens = 8192
# context_window_tokens = 200000

# This exact prompt is deployment-owned and used as the system instruction for
# every dedicated summary call. Change it only when future compactions should
# observe the new instruction.
[compaction]
prompt = "Summarize the prior conversation faithfully for continuation."

# Maximum exact bytes retained in memory while assembling one chunked
# conversation import. Omit this table to use the 256 MiB default.
[conversation_import]
max_source_bytes = 268435456

# web_fetch can issue outbound requests only to these exact origins. Approval
# posture is configured separately below. An absent or empty list disables its
# outbound requests. Add an origin only when the deployment accepts it as an
# egress recipient for untrusted model context.
[web_fetch]
allowed_origins = [
  "https://api.github.com",
  "https://crates.io",
  "https://docs.rs",
  "https://github.com",
]

# Optional repository-watch polling and shadow-mode webhook intake. Each
# repository has its own least-scope polling credential; it is reread for each
# request and is never shared with the general GitHub tool credential. Omitting
# the webhook table and per-repository hook fields disables webhook intake. The
# reference deployment exposes public /github/webhooks with Tailscale Funnel
# --set-path, which strips that prefix and forwards local path / to this listener.
# [repository_watch]
# version = 1
# signal_reviewers = ["signal-reviewer", "review-bot[bot]"]
#
# The sweep remains disabled unless this policy and at least one repository's
# explicit pull-request list are both present. Deployments may lower, never
# raise, the five-minute census and thirty-minute cool-off ceilings.
# [repository_watch.convergence_sweep]
# template = "review-response"
# interval_seconds = 300
# cool_off_seconds = 1800
#
# [repository_watch.webhook]
# bind_address = "127.0.0.1:3333"
# path = "/"
#
# A repository whose webhook intake is primary may hold the complete sweep to an
# hourly cadence: the delivery stream carries the mapped set and the poll is the
# reconciliation backstop. Omitting webhook_mode selects "shadow", where the
# poll stays the freshness path and the interval stays short. A present value
# that is not "shadow" or "primary", of any TOML type, fails startup.
# [[repository_watch.repositories]]
# repository = "namespace/project"
# poll_interval_seconds = 3600
# credential_file = "/run/credentials/repository-watch-namespace-project"
# convergence_pull_requests = [892]
# webhook_hook_id = 123456789
# webhook_secret_file = "/etc/signalbox/github-webhook-secret"
# webhook_mode = "primary"
#
# [[repository_watch.rules]]
# id = "merge-forward-on-base-advance"
# Increment this revision whenever matcher, actions, singleton_per, or cooldown
# changes. Keeping the ID preserves history; startup retires the old revision
# and activates the new one after the current event tail.
# The schema upgrade that introduced rule fingerprints retires every existing
# revision, so increment each configured rule's version once on the first boot.
# version = 1
# singleton_per = "pull_request"
# cooldown_seconds = 0
#
# [repository_watch.rules.matcher]
# event_kinds = ["base_advanced"]
# repo = "namespace/project"
# head_branch_regex = "^agent/.+$"
#
# [[repository_watch.rules.actions]]
# kind = "dispatch_session"
# template = "merge-forward"

# Tool dependencies use the same closed mapping-table pattern as model
# adapters. The two GitHub-backed families share one non-secret profile; the
# credential value still arrives only through GITHUB_TOKEN_FILE. Workspace,
# local Git, and execution tools pin this root for a session with no derived
# directory, and pin /srv/signalbox/workspace.sessions/<session-uuid> for a
# session that has one; conversation tools use daemon-composed application
# reads over the configured database.
[[tool_mappings]]
family = "code_host"
adapter = "github"
credential_profile = "github-primary"
egress_policy = "github_api_only"

[[tool_mappings]]
family = "github"
adapter = "github"
credential_profile = "github-primary"
egress_policy = "github_api_only"

[[tool_mappings]]
family = "workspace"
adapter = "local"
workspace_root = "/srv/signalbox/workspace"

[[tool_mappings]]
family = "conversations"
adapter = "application"

# The separately packaged supervisor is pinned once for the three daemon-local
# execution tools. The daemon never guesses this path from its own executable.
[daemon_tools]
exec_supervisor_executable = "/usr/local/bin/signalbox-exec-supervisor"
# Optional pre-populated Cargo registry mounted read-only at the sandbox's
# dedicated CARGO_HOME. The sandbox keeps its writable lock state in tmpfs.
# cargo_registry_cache = "/var/cache/signalbox/cargo/registry"

# The complete mapped composition uses this explicit identity for both author
# and committer fields. It never consults ambient Git configuration.
[git_identity]
author_name = "Signalbox Daemon"
author_email = "signalbox@example.invalid"

# Exact-name overrides are optional. Any composed tool omitted here retains its
# existing permission default and session-blanket behavior.
#
# The execution tools are omitted deliberately and keep their compiled defaults:
# unsandboxed_exec is AlwaysConfirm, sandboxed_exec is Confirm, and
# cargo_diagnostics is Auto because its arguments select no program. Note that
# the fixed Cargo passes still compile and run the workspace's own build
# scripts, macros, and test binaries, so an automatic diagnostics call executes
# workspace-supplied code inside the sandbox; set cargo_diagnostics = "human"
# below for a deployment that will not accept that unattended.
#
# A session template that enables dangerous_tool_auto_approval turns the
# sandboxed_exec confirmation into a session blanket; add
# sandboxed_exec = "human" below to keep it parked for a person regardless.
#
# unsandboxed_exec accepts all three posture values, but only
# unsandboxed_exec = "delegated" changes where its requests go: to the approval
# judge, which can still deny them or escalate to a person. Mapping it "auto" or
# "human" leaves it parked for a person, as does omitting it, and no session
# blanket ever lowers it.
[tool_approval_postures]
web_fetch = "human"
web_search = "human"
# Uncomment exact names to park those tools for the configured approval judge.
# github_pull_request_publish_review = "delegated"
# write_file = "delegated"

# An optional fixed judge selection must name one [[models]] selection_id. When
# this table is absent, the judge reuses the request-producing call's direct
# selection, including its existing adapter and credential mapping.
# [approval_judge]
# selection_id = "c70bd4e1-3699-458c-ae03-310a77763807"

# `provider_compaction = true` is an exact per-target capability. Omission is
# fail-closed: the adapter neither enables server compaction nor replays opaque
# compaction blocks for that resolved target.
#
# Anthropic's most capable widely released model. Hard cap: 128000.
#
# This model rejects a forced tool choice, which is how the Anthropic adapter
# realizes a structured-output contract, so every approval-judge call routed to
# this row fails at the provider. That covers two paths, not one: naming this
# row under [approval_judge], and — when that table is absent, as it is above —
# any delegated tool request produced by a call on this row, because the judge
# then reuses the producing call's own selection. Until the adapter declares
# forced tool choice per model, deployments that delegate tool approval name a
# different row under [approval_judge] rather than leaving the table absent.
[[models]]
selection_id = "3aa432ca-488e-4237-ac2b-7496a2ccc2b4"
target_id = "ba705029-f367-4da8-a0bf-dbc6bf798e17"
model_family = "anthropic"
provider_model = "claude-fable-5-1"
provider_compaction = true
max_output_tokens = 8192
