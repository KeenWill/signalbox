[[repository_watch.rules]]
id = "renovate-merge-forward"
version = 5
singleton_per = "pull_request"
cooldown_seconds = 1800
[repository_watch.rules.matcher]
event_kinds = ["mergeable_state_changed", "head_changed"]
repo = "KeenWill/signalbox"
base_branch = "main"
author = "renovate[bot]"
head_branch_regex = "^renovate/.+$"
draft = false
[repository_watch.rules.matcher.mergeable_state]
any_of = ["conflicting"]
[[repository_watch.rules.actions]]
kind = "dispatch_session"
template = "merge-forward"
# Rule B: PRs the owner or coordinator labels `repo-watch` get one review-response session per PR when checks finish or the head moves, at most every 30 min.
[[repository_watch.rules]]
id = "labeled-review-response"
version = 6
singleton_per = "pull_request"
cooldown_seconds = 1800
[repository_watch.rules.matcher]
event_kinds = ["checks_completed", "head_changed", "mergeable_state_changed"]
repo = "KeenWill/signalbox"
base_branch = "main"
draft = false
[repository_watch.rules.matcher.labels]
all_of = ["repo-watch"]
[[repository_watch.rules.actions]]
kind = "dispatch_session"
template = "review-response-sol"
