# Approval-judge eval through the Codex CLI subscription adapter.
# Replace the executable, working directory, and login-home paths before use.
# Install the repository-pinned Codex CLI; the working directory must exist.
version = 1

[numeric_bounds]
max_git_object_bytes = "none"
max_image_presentation_bytes = "none"
max_raster_dimension = "none"
max_image_request_bytes = "none"
# Time to complete a client frame after its first byte arrives.
client_frame_deadline = "30s"
# Time a client socket write may remain blocked without sending bytes.
client_write_progress_deadline = "30s"
# Seven days from authenticated webhook receipt to its durable expiry.
repository_watch_webhook_retention = "604800s"
# Guard reacquisition backoff and total recovery time; none keeps waiting.
guard_recovery_initial_delay = "1s"
guard_recovery_maximum_delay = "10s"
guard_recovery_elapsed_bound = "none"
# Physical database sessions established before daemon work begins.
fenced_pool_min_connections = 48
# Delay between checks that restore retired fenced pool sessions.
fenced_pool_floor_reconciliation_interval = "5s"
# Time allowed for one fenced pool floor restoration attempt.
fenced_pool_floor_reconciliation_attempt_bound = "30s"
# Concurrent process-protocol snapshot readers.
max_concurrent_snapshot_readers = 8
# Replicas retained for one immutable blob.
max_blob_replica_count = 32
# Exact tags retained in one session metadata value.
max_session_metadata_tags = 256
# Attributes retained in one session metadata value.
max_session_metadata_attributes = 256
# Required tags admitted in one metadata filter.
max_session_metadata_required_tags = 256
# UTF-8 bytes admitted in one session system prompt.
max_system_prompt_utf8_bytes = 1048576
# UTF-8 bytes retained in one imported-text preview.
max_imported_text_preview_utf8_bytes = 256
# Concerns retained in one review-orchestration attempt.
max_review_orchestration_concerns = 32
# Unicode scalars retained in one imported-conversation display title.
max_imported_conversation_display_title_scalars = 256
# Time allowed for runtime cleanup after scheduler work drains.
graceful_shutdown_cleanup_window = "30s"
# Time allowed for one complete model-provider exchange.
model_exchange_timeout = "600s"
# Time allowed for the startup probe that binds Codex CLI to its exact pin.
codex_cli_version_probe_bound = "10s"
# Detached recovery attempts made for one expired scheduler pass.
expired_pass_recovery_attempts = 4
# Time allowed for one expired-pass recovery database operation.
expired_pass_recovery_attempt_bound = "3s"
# Delay after an expired-pass recovery lock refusal.
expired_pass_recovery_lock_retry_delay = "6s"
# Delay after an ambiguous expired-pass recovery failure.
expired_pass_recovery_conservative_retry_delay = "120s"
# Time allowed for one convergence census provider request.
convergence_sweep_request_timeout = "30s"
# GraphQL connection pages read for one convergence census.
max_convergence_sweep_connection_pages = 100
# Convergence census targets queried concurrently.
max_concurrent_convergence_sweep_targets = 8
# Transport attempts made for one convergence census request.
max_convergence_sweep_request_attempts = 3
# Delay between convergence census request attempts.
convergence_sweep_request_retry_delay = "250ms"
# Initial retry delay after a convergence census failure.
convergence_sweep_retry_backoff_base = "60s"
# Longest retry delay after repeated convergence census failures.
convergence_sweep_retry_backoff_cap = "900s"
# Stale turns terminalized during one liveness scan.
terminalizations_per_liveness_scan = 64
# Time allowed for one slot-held liveness recovery transaction.
turn_liveness_recovery_attempt_bound = "10s"
# Automatic reconciliation transactions performed in one liveness scan.
automatic_reconciliations_per_liveness_scan = 64
# Time allowed for one automatic reconciliation transaction.
automatic_reconciliation_attempt_bound = "60s"
# Credentialed targets retained by one convergence sweep.
max_convergence_sweep_targets = 256
# Longest configured convergence census interval.
max_convergence_sweep_interval = "300s"
# Longest configured delay after a convergence dispatch.
max_convergence_sweep_cool_off = "1800s"
# Initial delay before automatically resuming a failed goal turn.
automatic_resume_base_backoff = "120s"
# Longest delay between automatic goal resumption attempts.
automatic_resume_backoff_cap = "1800s"
# Automatic resumption attempts spent by one failed goal turn.
automatic_resume_attempt_budget = 20
# Automatic resumption attempts one blocked goal may ever make, spent or exempt.
automatic_resume_attempt_ceiling = 100
# Delay between startup automatic-resumption inventory retries.
automatic_resume_startup_retry_delay = "1s"
# Time allowed to reap a killed model-provider child.
post_kill_reap_bound = "5s"
# Time without durable progress before an active turn is stale.
stale_active_turn_bound = "1800s"
# Time between turn-liveness scans.
turn_liveness_scan_interval = "60s"
# Initial delay before ambiguous-operation reconciliation.
automatic_reconciliation_base_backoff = "120s"
# Longest delay between ambiguous-operation reconciliation attempts.
automatic_reconciliation_backoff_cap = "1800s"
# Automatic reconciliation attempts spent by one ambiguous operation.
automatic_reconciliation_attempt_budget = 5
# Buffered terminal input messages.
terminal_input_channel_capacity = 1
# UTF-8 bytes admitted in one user message.
max_message_utf8_bytes = 1048576
# Smallest session-metadata page accepted from a client.
min_metadata_page_size = 1
# Largest session-metadata page accepted from a client.
max_metadata_page_size = 100
# Findings retained from one review run.
max_review_findings_per_run = 32
# Automatic model tool rounds spent in one turn.
max_automatic_tool_rounds_per_turn = 32
# Recorded attempts allowed on one credential within a turn.
max_same_credential_attempts_per_turn = 2
# Required tags admitted by one metadata query.
max_required_tags = 256
# Time between scheduler reconciliation sweeps.
reconciliation_sweep_interval = "1s"
# Buffered scheduler nudges.
nudge_buffer_capacity = 1024
# Authoritative scheduler passes admitted concurrently.
scheduler_pass_admission_cap = 16
# Time one authoritative scheduler pass may occupy admission.
scheduler_pass_occupancy_bound = "3600s"
# Provider diagnostic bytes retained in one native message.
max_native_message_bytes = 2048
# Time a terminalization waits for the scheduler row.
terminalization_lock_wait = "250ms"
# Time a terminalization waits for a pooled connection.
terminalization_acquire_wait = "250ms"
# Time a terminalization write waits for a contended row.
terminalization_write_lock_wait = "1s"
# Bytes retained in one disposable PostgreSQL test database.
disposable_postgres_state_ceiling_bytes = 536870912
# Provider model-identity bytes retained in diagnostics.
diagnostic_model_identity_limit = 128
# Time allowed for one ordinary code-host request.
code_host_request_timeout = "30s"
# CI job-log bytes retained in one code-host result.
max_job_log_bytes = 65536
# Stack comparisons performed concurrently at the code host.
max_stack_comparisons_in_flight = 8
# Text bytes retained in one code-host result.
max_code_host_result_text_bytes = 65536
# Items retained in one paginated code-host result.
max_code_host_result_items = 100
# Repository-file bytes retained in one code-host result.
max_repository_file_content_bytes = 65536
# Time an owned session has to start working before it is retired.
session_admission_deadline = "900s"
# Time an active or recovering session may make no progress before it parks.
session_active_stall_deadline = "1800s"
# Time a waiting session may wait before it parks for a human.
session_waiting_deadline = "86400s"
# How often the daemon refreshes the exported lifecycle-metric gauges.
session_lifecycle_metric_scan_interval = "300s"

[[credential_profiles]]
name = "codex-subscription-primary"
adapter = "codex_cli"
billing_kind = "subscription"
delivery = "codex_home"
codex_home = "/var/lib/signalbox/codex-home"

[[credential_pools]]
name = "codex-main"
tie_break = "first_listed"
on_pool_exhausted = "fail"
members = [{ profile = "codex-subscription-primary", priority = 1 }]

[[adapter_mappings]]
model_family = "codex_cli"
adapter = "codex_cli"
credential_pool = "codex-main"

[codex_cli]
executable = "/opt/signalbox/bin/codex"
working_directory = "/var/lib/signalbox/codex-eval"

[[models]]
selection_id = "6f62d570-5b7e-4fa2-bf0b-46c6f7114631"
target_id = "b7e4e71b-a104-4ac2-b580-782927923fb5"
model_family = "codex_cli"
provider_model = "gpt-5.6-sol"
rate_version = "2026-09-11-catalog"
input_usd_per_million_tokens = "4"
output_usd_per_million_tokens = "20"
cache_creation_input_usd_per_million_tokens = "5"
cache_read_input_usd_per_million_tokens = "0.40"
max_output_tokens = 8192
context_window_tokens = 258400

[approval_judge]
selection_id = "6f62d570-5b7e-4fa2-bf0b-46c6f7114631"

[compaction]
prompt = "Summarize the prior conversation faithfully for continuation."
