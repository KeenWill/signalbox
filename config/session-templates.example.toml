# Signalbox daemon session-template configuration, version 1.
#
# Templates are intentionally commented out so this file is a valid empty
# catalog until a deployment selects model identities from its model catalog.
# A template copies its complete bundle into each new session; increasing the
# template version or changing the bundle affects only later creations.
version = 1

# Generic reviewer template. Keep a deployment's real reviewer instructions
# machine-local; the file reference is resolved once when the daemon starts.
# Relative references resolve beside this catalog. A $HOME/ reference expands
# from the daemon process environment and must remain relative beneath $HOME.
#
# [[templates]]
# name = "reviewer"
# version = 1
# alias = "00000000-0000-4000-8000-000000000001"
# system_prompt_file = "$HOME/.config/signalbox/prompts/reviewer.txt"
# dangerous_tool_auto_approval = false
#
# A generic reviewer prompt might ask the agent to inspect the change against
# its public specification and tests, report only concrete actionable findings,
# explain each finding's impact and location, and say explicitly when no such
# finding remains. Inline prompts use `system_prompt = "..."` instead of
# `system_prompt_file`; the two forms are mutually exclusive.
