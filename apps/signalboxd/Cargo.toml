[package]
name = "signalboxd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
test-support = [
    "signalbox-blob-store-filesystem/test-support",
    "signalbox-blob-store-s3/test-support",
    "signalbox-persistence/postgres-integration",
    "signalbox-persistence/test-support",
]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
base64 = "0.23.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hmac = { version = "0.13.0", default-features = false }
image = { version = "0.25.8", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
percent-encoding = "2.3.2"
mime = "0.3.17"
# Classifies the error `axum::body::to_bytes` returns: only its
# `LengthLimitError` is an oversized body; anything else is transport failure.
# Already present transitively under axum.
http-body-util = { version = "0.1.4", default-features = false }
# The webhook listener drives Hyper directly rather than through `axum::serve`,
# because the raw-header ceilings below the router are only reachable on the
# HTTP/1 builder. Both were already present transitively.
hyper = { version = "1.10.1", default-features = false, features = [
    "http1",
    "server",
] }
hyper-util = { version = "0.1.20", default-features = false, features = [
    "server",
    "server-graceful",
    "service",
    "tokio",
] }
opentelemetry = { version = "0.32.0", default-features = false, features = [
    "trace",
] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
    "grpc-tonic",
    "http-proto",
    "reqwest-blocking-client",
    "tls-ring",
    "tls-roots",
    "trace",
] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = [
    "trace",
] }
prometheus = { version = "0.14.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "rustls-no-provider",
] }
rust_decimal = { version = "1.42.1", default-features = false, features = ["std"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
signalbox-application = { path = "../../crates/application" }
signalbox-blob-store = { path = "../../crates/blob-store" }
signalbox-blob-store-filesystem = { path = "../../crates/blob-store-filesystem" }
signalbox-blob-store-s3 = { path = "../../crates/blob-store-s3" }
signalbox-conversation-import-claude-code = { path = "../../crates/conversation-import-claude-code" }
signalbox-conversation-import-codex = { path = "../../crates/conversation-import-codex" }
signalbox-domain = { path = "../../crates/domain" }
signalbox-model-provider-runtime = { path = "../../crates/model-provider-runtime" }
signalbox-model-runtime = { path = "../../crates/model-runtime" }
signalbox-model-runtime-anthropic = { path = "../../crates/model-runtime-anthropic" }
signalbox-model-runtime-claude-cli = { path = "../../crates/model-runtime-claude-cli" }
signalbox-model-runtime-codex-cli = { path = "../../crates/model-runtime-codex-cli" }
signalbox-model-runtime-openai = { path = "../../crates/model-runtime-openai" }
signalbox-persistence = { path = "../../crates/persistence" }
signalbox-process-protocol = { path = "../../crates/process-protocol" }
signalbox-runner-wire = { path = "../../crates/runner-wire" }
signalbox-tools-basic = { path = "../../crates/tools-basic" }
signalbox-tools-code-host = { path = "../../crates/tools-code-host" }
signalbox-tools-conversations = { path = "../../crates/tools-conversations" }
signalbox-tools-exec = { path = "../../crates/tools-exec" }
signalbox-tools-git = { path = "../../crates/tools-git" }
signalbox-tools-github = { path = "../../crates/tools-github" }
signalbox-tools-plan = { path = "../../crates/tools-plan" }
signalbox-tools-sessions = { path = "../../crates/tools-sessions" }
signalbox-tools-web = { path = "../../crates/tools-web" }
signalbox-tools-workspace = { path = "../../crates/tools-workspace" }
signalbox-tool-contract = { path = "../../crates/tool-contract" }
signalbox-tool-schema-derive = { path = "../../crates/tool-schema-derive" }
signalbox-web-contract = { path = "../../crates/web-contract" }
rustix = { version = "1.1.4", default-features = false, features = [
    "fs",
    "net",
    "process",
    "std",
] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
] }
tempfile = "3.27.0"
tokio = { version = "1.53.0", default-features = false, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml_edit = { version = "0.25.13", default-features = false, features = [
    "parse",
] }
tonic = { version = "0.14.6", default-features = false }
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "env-filter",
    "fmt",
    "registry",
] }
tower-http = { version = "0.7.0", default-features = false, features = ["fs"] }
url = "2.5.8"
uuid = { version = "1.24.0", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
signalbox-blob-store-filesystem = { path = "../../crates/blob-store-filesystem", features = ["test-support"] }
# The composed daemon tests read drain dispositions through persistence's
# test-support surface; carrying the feature here keeps a plain
# `cargo test -p signalboxd` compiling without an explicit feature flag.
# `postgres-integration` likewise: the tests start their throwaway PostgreSQL
# containers through persistence's shared RAM-backed provisioning helpers.
signalbox-persistence = { path = "../../crates/persistence", features = [
    "postgres-integration",
    "test-support",
] }
expect-test = "1.5.1"
git2 = { version = "0.21.0", default-features = false, features = ["unstable-sha256"] }
# The shared executor-driving harness lives in the application crate so sibling
# crates do not each grow a copy; it is test-only, and it is what lets the
# composed daemon executor be driven without a database.
signalbox-application = { path = "../../crates/application", features = [
    "test-support",
] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = [
    "testing",
    "trace",
] }
sha1 = { version = "0.11.0", default-features = false }
serde_json = { version = "1.0.140", features = ["raw_value"] }
signalbox-test-bin = { path = "../../crates/test-bin" }
testcontainers-modules = { version = "0.15.0", default-features = false, features = [
    "postgres",
    "ring",
] }
tokio = { version = "1.53.0", default-features = false, features = ["test-util"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[lints]
workspace = true
