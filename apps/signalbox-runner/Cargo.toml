[package]
name = "signalbox-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "signalbox-runner"
path = "src/main.rs"

# The runner process integration archive must carry the separately packaged
# supervisor whose executable identity the runner pins before connecting.
[[bin]]
name = "signalbox-exec-supervisor"
path = "src/bin/signalbox-exec-supervisor.rs"
required-features = ["runner-execution-proof"]
doc = false

[[test]]
name = "runner_process_postgres"
path = "tests/runner_process_postgres.rs"

[features]
default = []
runner-execution-proof = []

[dependencies]
rustix = { version = "1.1.4", default-features = false, features = [
    "fs",
    "process",
    "std",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
signalbox-runner-wire = { path = "../../crates/runner-wire" }
signalbox-tools-exec = { path = "../../crates/tools-exec" }
tokio = { version = "1.53.0", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1.1.3"
uuid = { version = "1.24.0", default-features = false, features = [
    "std",
    "v7",
] }
url = "2.5.8"

[dev-dependencies]
expect-test = "1.5.1"
signalbox-application = { path = "../../crates/application" }
signalbox-domain = { path = "../../crates/domain" }
signalbox-model-provider-runtime = { path = "../../crates/model-provider-runtime" }
signalbox-model-runtime = { path = "../../crates/model-runtime" }
signalbox-persistence = { path = "../../crates/persistence" }
signalbox-test-bin = { path = "../../crates/test-bin" }
signalboxd = { path = "../signalboxd" }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
] }
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", default-features = false, features = [
    "postgres",
    "ring",
] }

[lints]
workspace = true
