[package]
name = "signalbox-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "signalbox-runner"
path = "src/main.rs"

[dependencies]
sha2 = "0.11.0"
rustix = { version = "1.1.4", default-features = false, features = [
    "fs",
    "process",
    "std",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
signalbox-domain = { path = "../../crates/domain" }
signalbox-tools-basic = { path = "../../crates/tools-basic" }
signalbox-runner-wire = { path = "../../crates/runner-wire" }
tokio = { version = "1.53.0", default-features = false, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = "1.1.3"
uuid = { version = "1.24.0", default-features = false, features = [
    "std",
    "v7",
] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
