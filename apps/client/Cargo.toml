[package]
name = "signalbox-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "signalbox"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
signalbox-process-protocol = { path = "../../crates/process-protocol" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rustix = { version = "1.1.4", default-features = false, features = [
    "fs",
    "process",
    "std",
] }
rust_decimal = { version = "1.42.1", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.0", default-features = false, features = [
    "fs",
    "sync",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
] }
uuid = { version = "1.24.0", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
expect-test = "1.5.1"
signalbox-application = { path = "../../crates/application" }
signalbox-domain = { path = "../../crates/domain" }
signalboxd = { path = "../signalboxd", features = ["test-support"] }
signalbox-model-provider-runtime = { path = "../../crates/model-provider-runtime" }
signalbox-model-runtime = { path = "../../crates/model-runtime" }
signalbox-model-runtime-anthropic = { path = "../../crates/model-runtime-anthropic" }
signalbox-persistence = { path = "../../crates/persistence" }
signalbox-test-bin = { path = "../../crates/test-bin" }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
] }
testcontainers-modules = { version = "0.15.0", default-features = false, features = [
    "postgres",
    "ring",
] }
tokio = { version = "1.53.0", default-features = false, features = [
    "process",
    "sync",
    "test-util",
    "time",
] }

[lints]
workspace = true
