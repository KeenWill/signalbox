[package]
name = "signalbox-module-repo-watch-v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
test-support = ["signalbox-ownership-seam/test-support"]

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.42", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rust_decimal = { version = "1.42.1", default-features = false, features = ["std"] }
serde_json = "1.0.140"
sha2 = { version = "0.11.0", default-features = false }
signalbox-ownership-seam = { path = "../../ownership-seam" }
tokio = { version = "1.53.0", default-features = false, features = ["sync", "time", "macros", "rt"] }
tracing = { version = "0.1.41", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "time",
    "uuid",
] }
uuid = { version = "1.24.0", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.53.0", default-features = false, features = ["test-util"] }
