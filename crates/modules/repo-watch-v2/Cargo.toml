[package]
name = "signalbox-module-repo-watch-v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
test-support = ["signalbox-ownership-seam/test-support"]

[lints]
workspace = true

[dependencies]
rust_decimal = { version = "1.42.1", default-features = false, features = ["std"] }
serde_json = "1.0.140"
signalbox-ownership-seam = { path = "../../ownership-seam" }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "time",
    "uuid",
] }
uuid = { version = "1.24.0", default-features = false, features = ["std"] }
