[package]
name = "signalbox-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hex = "0.4.3"
regex = { version = "1.12.2", default-features = false, features = ["std", "perf", "unicode"] }
rpds = "1.2.1"
serde = "1.0.203"
serde_json = { version = "1.0.140", features = ["arbitrary_precision", "unbounded_depth"] }
serde_stacker = "0.1.14"
sha2 = "0.11.0"
uuid = { version = "1.24.0", default-features = false }

[lints]
workspace = true

[dev-dependencies]
divan = "0.1.21"
expect-test = "1.5.1"
gungraun = "0.19.4"
signalbox-expect-table = { path = "../expect-table" }

[[bench]]
name = "instruction_counts"
harness = false
test = false

[[bench]]
name = "wall_clock"
harness = false
test = false
