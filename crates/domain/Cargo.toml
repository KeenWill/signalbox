[package]
name = "signalbox-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bstr = "1.12.1"
gix-validate = "0.11.4"
hex = "0.4.3"
regex = { version = "1.12.2", default-features = false, features = ["std", "perf", "unicode"] }
rpds = "1.2.1"
serde = "1.0.203"
serde_json = { version = "1.0.140", features = ["arbitrary_precision", "unbounded_depth"] }
serde_stacker = "0.1.14"
sha2 = "0.11.0"
uuid = { version = "1.24.0", default-features = false }
url = "2.5.4"

[lints]
workspace = true

[dev-dependencies]
serde = { version = "1.0.219", features = ["derive"] }
divan = "0.1.21"
expect-test = "1.5.1"
gungraun = "0.19.4"
expectable = { git = "https://github.com/KeenWill/expectable-rs", tag = "v0.1.0" }

[[bench]]
name = "instruction_counts"
harness = false
test = false

[[bench]]
name = "wall_clock"
harness = false
test = false
