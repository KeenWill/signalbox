[package]
name = "signalbox-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Fixture construction for provider-adapter executor tests. Enabled by those
# crates' dev-dependencies only, so it never compiles into a production build.
test-support = []

[dependencies]
serde_json = "1.0.149"
sha2 = "0.11.0"
signalbox-domain = { path = "../domain" }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
    "sync",
    "time",
] }
tracing = { version = "0.1.41", default-features = false }
uuid = { version = "1.24.0", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
expect-test = "1.5.1"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt"] }
tokio = { version = "1.53.0", default-features = false, features = [
    "rt",
    "test-util",
] }

[lints]
workspace = true
