[package]
name = "signalbox-tools-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nix = { version = "0.31.3", default-features = false }
rustix = { version = "1.1.4", default-features = false, features = [
    "event",
    "fs",
    "process",
    "std",
    "time",
] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
signalbox-application = { path = "../application" }
signalbox-domain = { path = "../domain" }
signalbox-tool-contract = { path = "../tool-contract" }
tokio = { version = "1.53.0", default-features = false, features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = "1.1.3"

[dev-dependencies]
signalbox-test-bin = { path = "../test-bin" }

[lints]
workspace = true
