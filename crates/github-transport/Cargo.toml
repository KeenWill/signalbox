[package]
name = "signalbox-github-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.0"
ring = "0.17.14"
serde_json = "1.0.140"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
tokio = { version = "1.53.0", default-features = false, features = ["sync", "time"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
signalbox-egress-transport = { path = "../egress-transport" }

[dev-dependencies]
http = "1.3.1"
tokio = { version = "1.53.0", default-features = false, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
