[package]
name = "signalbox-tools-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "stream",
] }
rustls = { version = "0.23.42", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
signalbox-application = { path = "../application" }
signalbox-domain = { path = "../domain" }
signalbox-model-runtime = { path = "../model-runtime" }
signalbox-tool-contract = { path = "../tool-contract" }
signalbox-egress-transport = { path = "../egress-transport" }
tracing = { version = "0.1.41", default-features = false }
tokio = { version = "1.53.0", default-features = false, features = ["time"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt"] }
uuid = { version = "1.24.0", default-features = false }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }

[lints]
workspace = true
