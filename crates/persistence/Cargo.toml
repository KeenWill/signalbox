[package]
name = "signalbox-persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The integration suites state the durable rows they need through the typed
# seeding in `test_support`, so enabling them enables it.
postgres-integration = ["dep:testcontainers-modules", "test-support"]
test-support = []

[dependencies]
rust_decimal = { version = "1.42.1", default-features = false, features = ["std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
signalbox-application = { path = "../application" }
signalbox-blob-store = { path = "../blob-store" }
signalbox-domain = { path = "../domain" }
signalbox-tools-plan = { path = "../tools-plan" }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "migrate",
    "macros",
    "uuid",
    "rust_decimal",
    "time",
] }
tokio = { version = "1.53.0", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
uuid = { version = "1.24.0", default-features = false, features = ["std", "v7"] }
testcontainers-modules = { version = "0.15.0", optional = true, default-features = false, features = [
    "postgres",
    "ring",
] }

[dev-dependencies]
expect-test = "1.5.1"
signalbox-application = { path = "../application", features = ["test-support"] }
toml = { version = "1.1.3", default-features = false, features = [
    "parse",
    "serde",
] }
signalbox-conversation-import-claude-code = { path = "../conversation-import-claude-code" }
signalbox-conversation-import-codex = { path = "../conversation-import-codex" }
signalbox-expect-table = { path = "../expect-table" }
tempfile = "3.25.0"

[[test]]
name = "approval_judge_eval_postgres"
path = "tests/approval_judge_eval_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "blob_postgres"
path = "tests/blob_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "conversation_import_postgres"
path = "tests/conversation_import_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "conversation_listing_postgres"
path = "tests/conversation_listing_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "git_remote_authority_postgres"
path = "tests/git_remote_authority_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "goal_postgres"
path = "tests/goal_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "imported_session_postgres"
path = "tests/imported_session_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "imported_conversation_e2e_postgres"
path = "tests/imported_conversation_e2e_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "search_path_postgres"
path = "tests/search_path_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "outbox_decode_postgres"
path = "tests/outbox_decode_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "program_journal_postgres"
path = "tests/program_journal_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "postgres_integration"
path = "tests/postgres_integration/main.rs"
required-features = ["postgres-integration"]

[[test]]
name = "runner_protocol_postgres"
path = "tests/runner_protocol_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "review_workflow_postgres"
path = "tests/review_workflow_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "session_metadata_postgres"
path = "tests/session_metadata_postgres.rs"
required-features = ["postgres-integration"]

[[test]]
name = "session_placement_postgres"
path = "tests/session_placement_postgres.rs"
required-features = ["postgres-integration"]

[[bench]]
name = "postgres_load"
path = "benches/postgres_load.rs"
harness = false
required-features = ["postgres-integration"]

[lints]
workspace = true
