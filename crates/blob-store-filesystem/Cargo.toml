[package]
name = "signalbox-blob-store-filesystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
test-support = []

[dependencies]
rustix = { version = "1.1.4", default-features = false, features = [
    "fs",
    "process",
    "rand",
    "std",
] }
sha2 = { version = "0.11.0", default-features = false }
signalbox-blob-store = { path = "../blob-store" }
signalbox-domain = { path = "../domain" }
tokio = { version = "1.53.0", default-features = false, features = [
    "fs",
    "io-util",
    "rt",
] }
uuid = { version = "1.24.0", default-features = false, features = ["std"] }

[dev-dependencies]
signalbox-blob-store = { path = "../blob-store", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["test-support"]

[lints]
workspace = true
