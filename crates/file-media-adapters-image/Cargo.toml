[package]
name = "signalbox-file-media-adapters-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "signalbox-file-media-image-worker"
path = "src/bin/signalbox-file-media-image-worker.rs"

[dependencies]
image = { version = "0.25.8", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
serde_json = "1.0.140"
signalbox-file-media-processor-runtime = { path = "../file-media-processor-runtime" }
signalbox-file-media-runtime = { path = "../file-media-runtime" }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }

[dev-dependencies]
crc32fast = "1.5.0"

[lints]
workspace = true
