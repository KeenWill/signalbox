[package]
name = "signalbox-file-media-adapter-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "signalbox-file-media-pdf-worker"
path = "src/bin/signalbox-file-media-pdf-worker.rs"

[dependencies]
lopdf = { version = "0.44.0", default-features = false }
serde_json = "1.0.140"
signalbox-file-media-processor-runtime = { path = "../file-media-processor-runtime" }
signalbox-file-media-runtime = { path = "../file-media-runtime" }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }

[dev-dependencies]
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }

[lints]
workspace = true
