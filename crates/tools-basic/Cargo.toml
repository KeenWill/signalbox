[package]
name = "signalbox-tools-basic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
jiff = { version = "0.2.34", default-features = false, features = [
    "std",
    "tzdb-bundle-always",
] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
signalbox-application = { path = "../application" }
signalbox-domain = { path = "../domain" }
signalbox-persistence = { path = "../persistence" }
signalbox-tool-contract = { path = "../tool-contract" }
signalbox-tool-schema-derive = { path = "../tool-schema-derive" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres"] }
uuid = { version = "1.24.0", default-features = false, features = ["std"] }

[dev-dependencies]
expect-test = "1.5.1"
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }

[lints]
workspace = true
