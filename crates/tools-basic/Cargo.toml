[package]
name = "signalbox-tools-basic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
icu_casemap = "2.2.0"
idna = "1.1.0"
jiff = { version = "0.2.34", default-features = false, features = [
    "std",
    "tzdb-zoneinfo",
] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "stream",
] }
rustls = { version = "0.23.42", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
signalbox-application = { path = "../application" }
signalbox-domain = { path = "../domain" }
signalbox-model-runtime = { path = "../model-runtime" }
signalbox-persistence = { path = "../persistence" }
signalbox-tool-contract = { path = "../tool-contract" }
signalbox-tool-schema-derive = { path = "../tool-schema-derive" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres"] }
tracing = { version = "0.1.41", default-features = false }
tokio = { version = "1.53.0", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
unicode-normalization = "0.1.25"
uuid = { version = "1.24.0", default-features = false, features = ["std"] }

[dev-dependencies]
expect-test = "1.5.1"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt"] }

[lints]
workspace = true
