[package]
name = "signalbox-file-media-adapter-archives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "signalbox-file-media-archives-worker"
path = "src/bin/signalbox-file-media-archives-worker.rs"

[dependencies]
flate2 = { version = "1.1.2", default-features = false, features = ["zlib-rs"] }
serde_json = "1.0.140"
signalbox-file-media-processor-runtime = { path = "../file-media-processor-runtime" }
signalbox-file-media-runtime = { path = "../file-media-runtime" }
tar = { version = "0.4.44", default-features = false }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }
zip = { version = "8.1.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
zstd = { version = "0.13.3", default-features = false }

[dev-dependencies]
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }

[lints]
workspace = true
