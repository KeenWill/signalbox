[package]
name = "signalbox-convergence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
futures-executor = "0.3.31"
flate2 = "1.1.9"
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
regex = "1.11.1"
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }
signal-hook = "0.3.18"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
toml = "1.1.3"

[dev-dependencies]
proptest = "1.7.0"

[[bin]]
name = "signalbox-converge"
path = "src/main.rs"

[lints]
workspace = true
