[package]
name = "signalbox-file-media-adapters-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "signalbox-file-media-audio-worker"
path = "src/bin/signalbox-file-media-audio-worker.rs"

[dependencies]
ogg = "0.9.2"
opus-rs = "0.1.28"
serde_json = "1.0.140"
signalbox-file-media-processor-runtime = { path = "../file-media-processor-runtime" }
signalbox-file-media-runtime = { path = "../file-media-runtime" }
symphonia = { version = "0.6.1", default-features = false, features = [
    "flac",
    "mp3",
    "pcm",
    "wav",
] }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }

[dev-dependencies]
rusty_mp3 = "0.7.0"

[lints]
workspace = true
