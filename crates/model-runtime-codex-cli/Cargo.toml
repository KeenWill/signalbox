[package]
name = "signalbox-model-runtime-codex-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.0"
hex = "0.4.3"
semver = "1.0.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.11.0"
signalbox-model-runtime = { path = "../model-runtime", features = ["cli-process"] }
tempfile = "3.27.0"
tokio = { version = "1.53.0", default-features = false, features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt",
    "signal",
    "time",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std"] }

[build-dependencies]
semver = "1.0.27"
serde_json = "1.0.140"

[lints]
workspace = true

[dev-dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process"] }
schemars = "1.0.4"
signalbox-test-bin = { path = "../test-bin" }
tokio = { version = "1.53.0", default-features = false, features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "test-util",
    "time",
] }

[[bin]]
name = "signalbox-fake-codex-cli"
path = "tests/support/fake_codex_app_server.rs"
doc = false
test = false
