[package]
name = "signalbox-tools-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
git2 = { version = "0.21.0", default-features = false }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = { version = "0.11.0", default-features = false }
signalbox-application = { path = "../application" }
signalbox-domain = { path = "../domain" }
signalbox-tool-contract = { path = "../tool-contract" }
signalbox-tools-workspace = { path = "../tools-workspace" }
tempfile = "3.27.0"

[lints]
workspace = true
