[package]
name = "signalbox-file-media-adapter-office"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "signalbox-file-media-office-worker"
path = "src/bin/signalbox-file-media-office-worker.rs"

[dependencies]
crc32fast = "1.5.0"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
quick-xml = "0.42.0"
serde_json = "1.0.140"
signalbox-file-media-processor-runtime = { path = "../file-media-processor-runtime" }
signalbox-file-media-runtime = { path = "../file-media-runtime" }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }
zip = { version = "8.1.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[dev-dependencies]
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }

[lints]
workspace = true
