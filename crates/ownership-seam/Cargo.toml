[package]
name = "signalbox-ownership-seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
test-support = ["signalbox-application/test-support"]

[lints]
workspace = true

[dependencies]
signalbox-application = { path = "../application" }
signalbox-domain = { path = "../domain" }
signalbox-persistence = { path = "../persistence" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }

[dev-dependencies]
uuid = { version = "1.24.0", default-features = false, features = ["std"] }
