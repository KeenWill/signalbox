[package]
name = "signalbox-tools-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glob = "0.3.3"
regex = "1.12.2"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
signalbox-application = { path = "../application" }
signalbox-domain = { path = "../domain" }
signalbox-tool-contract = { path = "../tool-contract" }

[dev-dependencies]
tempfile = "3.27.0"

# rustix omits mkfifoat on Apple targets, so the FIFO fixture needs a safe
# wrapper there and nix supplies one. Apple-only and test-only: the Linux
# dependency graph is unchanged.
[target.'cfg(target_vendor = "apple")'.dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }

[lints]
workspace = true
