[package]
name = "signalbox-approval-judge-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
postgres-integration = ["dep:testcontainers-modules"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = { version = "0.11.0", default-features = false }
signalbox-domain = { path = "../domain" }
signalbox-model-provider-runtime = { path = "../model-provider-runtime" }
signalbox-model-runtime = { path = "../model-runtime" }
signalbox-persistence = { path = "../persistence" }
signalboxd = { path = "../../apps/signalboxd" }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
] }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }
uuid = { version = "1.24.0", default-features = false }
testcontainers-modules = { version = "0.15.0", optional = true, default-features = false, features = [
    "postgres",
    "ring",
] }

[[test]]
name = "corpus_store_postgres"
path = "tests/corpus_store_postgres.rs"
required-features = ["postgres-integration"]

[dev-dependencies]
expect-test = "1.5.1"

[lints]
workspace = true
