[package]
name = "signalbox-model-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
cli-process = ["dep:rustix", "dep:tokio"]

[dependencies]
eventsource-stream = "0.2.3"
futures-channel = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
httpdate = "1.0.3"
schemars = "1.0.4"
serde = "1.0.219"
serde_json = { version = "1.0.140", features = ["arbitrary_precision", "raw_value"] }
tokio = { version = "1.53.0", default-features = false, features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "time",
], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["process", "std"], optional = true }

[lints]
workspace = true

[dev-dependencies]
expect-test = "1.5.1"
serde = { version = "1.0.219", features = ["derive"] }
signalbox-expect-table = { path = "../expect-table" }
