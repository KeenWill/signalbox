[package]
name = "signalbox-model-provider-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
signalbox-derive = { path = "../derive" }
signalbox-application = { path = "../application" }
signalbox-domain = { path = "../domain" }
signalbox-model-runtime = { path = "../model-runtime" }
serde_json = { version = "1.0.140", features = ["raw_value"] }
tracing = { version = "0.1.41", default-features = false }

[dev-dependencies]
serde = { version = "1.0.219", features = ["derive"] }
expect-test = "1.5.1"
expectable = { git = "https://github.com/KeenWill/expectable-rs", tag = "v0.1.0" }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }
uuid = { version = "1.24.0", default-features = false }

[lints]
workspace = true
