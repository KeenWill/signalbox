[package]
name = "signalbox-file-media-adapter-svg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "signalbox-file-media-svg-worker"
path = "src/bin/signalbox-file-media-svg-worker.rs"

[dependencies]
cssparser = "0.37.0"
iri-string = "0.7.14"
quick-xml = "0.42.0"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
serde_json = "1.0.140"
svgtypes = "0.16.1"
signalbox-file-media-processor-runtime = { path = "../file-media-processor-runtime" }
signalbox-file-media-runtime = { path = "../file-media-runtime" }
signalbox-file-media-adapters-image = { path = "../file-media-adapters-image" }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }

[lints]
workspace = true
