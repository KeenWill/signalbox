[package]
name = "signalbox-file-media-adapters-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "signalbox-file-media-text-worker"
path = "src/bin/signalbox-file-media-text-worker.rs"

[dependencies]
csv = "1.3.1"
serde = "1.0.219"
serde_json = { version = "1.0.140", features = ["arbitrary_precision", "unbounded_depth"] }
serde_stacker = "0.1.14"
signalbox-file-media-processor-runtime = { path = "../file-media-processor-runtime" }
signalbox-file-media-runtime = { path = "../file-media-runtime" }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
] }

[lints]
workspace = true
