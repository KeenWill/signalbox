[package]
name = "signalbox-program-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
postgres-integration = [
    "dep:testcontainers-modules",
    "signalbox-persistence/postgres-integration",
]

[dependencies]
deno_core = "=0.411.0"
deno_error = "=0.7.1"
serde = { version = "1.0.219", features = ["derive"] }
signalbox-domain = { path = "../domain" }
signalbox-persistence = { path = "../persistence" }
testcontainers-modules = { version = "0.15.0", optional = true, default-features = false, features = [
    "postgres",
    "ring",
] }
tokio = { version = "1.53.0", default-features = false, features = [
    "macros",
    "rt",
    "sync",
] }

[dev-dependencies]
signalbox-persistence = { path = "../persistence", features = ["test-support"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
] }
uuid = { version = "1.24.0", default-features = false, features = ["std"] }

[[test]]
name = "program_host_postgres"
path = "tests/program_host_postgres.rs"
required-features = ["postgres-integration"]

[lints]
workspace = true
