[package]
name = "signalbox-model-runtime-claude-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
semver = "1.0.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision", "raw_value"] }
signalbox-model-runtime = { path = "../model-runtime", features = ["cli-process"] }
tempfile = "3.27.0"
tokio = { version = "1.53.0", default-features = false, features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "time",
] }

[build-dependencies]
semver = "1.0.27"
serde_json = "1.0.140"

[lints]
workspace = true

[dev-dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process"] }
signalbox-test-bin = { path = "../test-bin" }
tokio = { version = "1.53.0", default-features = false, features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "time",
] }

[[bin]]
name = "signalbox-claude-mcp-bridge"
path = "src/bin/signalbox-claude-mcp-bridge.rs"
doc = false
test = false

[[bin]]
name = "signalbox-fake-claude-cli"
path = "tests/support/fake_claude_cli.rs"
doc = false
test = false
