[workspace]
members = [
    "apps/client",
    "apps/signalbox-runner",
    "apps/signalboxd",
    "crates/application",
    "crates/blob-store",
    "crates/blob-store-filesystem",
    "crates/egress-transport",
    "crates/conversation-import-claude-code",
    "crates/conversation-import-codex",
    "crates/conversation-import-json",
    "crates/domain",
    "crates/expect-table",
    "crates/model-runtime",
    "crates/model-runtime-anthropic",
    "crates/model-runtime-claude-cli",
    "crates/model-runtime-codex-cli",
    "crates/model-runtime-openai",
    "crates/model-provider-runtime",
    "crates/persistence",
    "crates/process-protocol",
    "crates/runner-wire",
    "crates/test-bin",
    "crates/tool-contract",
    "crates/tool-schema-derive",
    "crates/tools-basic",
    "crates/tools-code-host",
    "crates/tools-exec",
    "crates/tools-conversations",
    "crates/tools-github",
    "crates/tools-git",
    "crates/tools-plan",
    "crates/tools-sessions",
    "crates/tools-web",
    "crates/tools-workspace",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
repository = "https://github.com/KeenWill/signalbox"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Dev builds carry only file/line debug info: panic backtraces stay readable
# while target directories shrink roughly in half. Restore the default
# (`debug = 2`) if full interactive-debugger support is ever needed.
[profile.dev]
debug = "line-tables-only"
