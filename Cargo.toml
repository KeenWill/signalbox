[workspace]
members = [
    "apps/client",
    "apps/signalboxd",
    "crates/application",
    "crates/conversation-import-claude-code",
    "crates/conversation-import-codex",
    "crates/conversation-import-json",
    "crates/domain",
    "crates/expect-table",
    "crates/model-runtime",
    "crates/model-runtime-anthropic",
    "crates/model-runtime-claude-cli",
    "crates/model-runtime-codex-cli",
    "crates/model-runtime-openai",
    "crates/model-provider-runtime",
    "crates/persistence",
    "crates/process-protocol",
    "crates/tool-contract",
    "crates/tool-schema-derive",
    "crates/tools-basic",
    "crates/tools-code-host",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
repository = "https://github.com/KeenWill/signalbox"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "warn"
