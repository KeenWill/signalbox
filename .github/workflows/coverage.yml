name: Coverage

# Coverage is report-only: no threshold, required check, or blocking Codecov
# status. Each measured suite records its outcome even when it fails. Artifacts
# contain the merged LCOV measurement and Markdown/HTML summaries.

on:
  pull_request:
    paths:
      - "apps/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - "tooling/bazel/**"
      - "tooling/summarize_coverage.py"
      - "tooling/test_summarize_coverage.py"
      - ".github/workflows/coverage.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - "tooling/bazel/**"
      - "tooling/summarize_coverage.py"
      - "tooling/test_summarize_coverage.py"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

# Superseded runs release their slots against the public concurrency cap:
# pull-request runs group per PR, and other non-main runs group per
# event+ref (today only workflow_dispatch reaches that arm — every push
# trigger in this repo is filtered to main). Main runs each take a group
# of their own and are never canceled: sharing one group would let a third
# run cancel a second still pending behind the first, which
# `cancel-in-progress: false` does not prevent.
concurrency:
  group: >-
    coverage-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref)
    || github.ref == 'refs/heads/main' && github.run_id
    || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  rust-coverage:
    name: Rust coverage (report only)
    continue-on-error: true
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox-coverage' }}
    timeout-minutes: 90
    env:
      BAZEL_REMOTE_CACHE: ${{ vars.BAZEL_REMOTE_CACHE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
      - name: Test the coverage summarizer
        run: |
          cache_args=()
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" && -n "$BAZEL_REMOTE_CACHE" ]]; then
            cache_args+=(--remote_cache="$BAZEL_REMOTE_CACHE")
          fi
          bazel test --jobs=4 --local_test_jobs=1 "${cache_args[@]}" //:test_summarize_coverage
      - name: Fetch Cargo inputs for offline diagnostic fixtures
        run: cargo fetch --locked
      - name: Install Bubblewrap
        if: ${{ runner.environment == 'github-hosted' }}
        run: sudo apt-get install --yes bubblewrap
      - name: Enable unprivileged user namespaces for Bubblewrap
        if: ${{ runner.environment == 'github-hosted' }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Measure the workspace suite
        id: workspace
        continue-on-error: true
        run: |
          report_dir="$RUNNER_TEMP/coverage"
          mkdir -p "$report_dir"
          cache_args=()
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" && -n "$BAZEL_REMOTE_CACHE" ]]; then
            cache_args+=(--remote_cache="$BAZEL_REMOTE_CACHE")
          fi
          rm -f bazel-out/_coverage/_coverage_report.dat
          status=0
          bazel coverage --keep_going --jobs=4 --local_resources=cpu=4 --local_resources=memory=4096 --local_test_jobs=1 --test_env=DOCKER_HOST=unix:///var/run/docker.sock "${cache_args[@]}" --test_arg=--skip --test_arg=production_runner_clears_ambient_environment_when_requested //:coverage_workspace || status=$?
          if [[ -f bazel-out/_coverage/_coverage_report.dat ]]; then
            cp bazel-out/_coverage/_coverage_report.dat "$report_dir/workspace.lcov"
          fi
          exit "$status"
      - name: Measure the persistence PostgreSQL suite
        id: persistence
        continue-on-error: true
        run: |
          report_dir="$RUNNER_TEMP/coverage"
          mkdir -p "$report_dir"
          cache_args=()
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" && -n "$BAZEL_REMOTE_CACHE" ]]; then
            cache_args+=(--remote_cache="$BAZEL_REMOTE_CACHE")
          fi
          rm -f bazel-out/_coverage/_coverage_report.dat
          status=0
          bazel coverage --keep_going --jobs=4 --local_resources=cpu=4 --local_resources=memory=4096 --local_test_jobs=1 --test_env=DOCKER_HOST=unix:///var/run/docker.sock "${cache_args[@]}" //:coverage_persistence || status=$?
          if [[ -f bazel-out/_coverage/_coverage_report.dat ]]; then
            cp bazel-out/_coverage/_coverage_report.dat "$report_dir/persistence.lcov"
          fi
          exit "$status"
      - name: Measure the signalboxd PostgreSQL suite
        id: signalboxd
        continue-on-error: true
        run: |
          report_dir="$RUNNER_TEMP/coverage"
          mkdir -p "$report_dir"
          cache_args=()
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" && -n "$BAZEL_REMOTE_CACHE" ]]; then
            cache_args+=(--remote_cache="$BAZEL_REMOTE_CACHE")
          fi
          rm -f bazel-out/_coverage/_coverage_report.dat
          status=0
          bazel coverage --keep_going --jobs=4 --local_resources=cpu=4 --local_resources=memory=4096 --local_test_jobs=1 --test_env=DOCKER_HOST=unix:///var/run/docker.sock "${cache_args[@]}" //:coverage_signalboxd || status=$?
          if [[ -f bazel-out/_coverage/_coverage_report.dat ]]; then
            cp bazel-out/_coverage/_coverage_report.dat "$report_dir/signalboxd.lcov"
          fi
          exit "$status"
      - name: Measure the terminal-client PostgreSQL suite
        id: terminal_client
        continue-on-error: true
        run: |
          report_dir="$RUNNER_TEMP/coverage"
          mkdir -p "$report_dir"
          cache_args=()
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" && -n "$BAZEL_REMOTE_CACHE" ]]; then
            cache_args+=(--remote_cache="$BAZEL_REMOTE_CACHE")
          fi
          rm -f bazel-out/_coverage/_coverage_report.dat
          status=0
          bazel coverage --keep_going --jobs=4 --local_resources=cpu=4 --local_resources=memory=4096 --local_test_jobs=1 --test_env=DOCKER_HOST=unix:///var/run/docker.sock "${cache_args[@]}" //:coverage_terminal_client || status=$?
          if [[ -f bazel-out/_coverage/_coverage_report.dat ]]; then
            cp bazel-out/_coverage/_coverage_report.dat "$report_dir/terminal_client.lcov"
          fi
          exit "$status"
      - name: Report the numbers
        if: ${{ always() }}
        env:
          WORKSPACE_OUTCOME: ${{ steps.workspace.outcome }}
          PERSISTENCE_OUTCOME: ${{ steps.persistence.outcome }}
          SIGNALBOXD_OUTCOME: ${{ steps.signalboxd.outcome }}
          TERMINAL_CLIENT_OUTCOME: ${{ steps.terminal_client.outcome }}
        run: |
          report_dir="$RUNNER_TEMP/coverage"
          mkdir -p "$report_dir"
          {
            echo '| Measured suite | Outcome |'
            echo '| --- | --- |'
            echo "| workspace | $WORKSPACE_OUTCOME |"
            echo "| persistence PostgreSQL | $PERSISTENCE_OUTCOME |"
            echo "| signalboxd PostgreSQL | $SIGNALBOXD_OUTCOME |"
            echo "| terminal-client PostgreSQL | $TERMINAL_CLIENT_OUTCOME |"
            echo
            echo 'Doctests, live credential smokes, subprocess-only bridge fixtures,'
            echo 'and the Swift client are outside this measurement. The workspace'
            echo 'excludes production_runner_clears_ambient_environment_when_requested:'
            echo 'instrumenting its supervisor adds an LLVM runtime environment variable.'
            echo 'The ordinary test gate runs that assertion without instrumentation.'
            echo
            echo 'Dedicated tests/, benches/, and *tests.rs sources are excluded from'
            echo 'the report. Inline test modules remain counted, so the figures include'
            echo 'some test code. LCOV contains no region metric; regions are unavailable.'
          } > "$report_dir/preamble.md"
          python3 tooling/summarize_coverage.py --lcov "$report_dir"/*.lcov \
            --lcov-output "$report_dir/lcov.info" \
            --preamble "$report_dir/preamble.md" \
            --top-uncovered 25 > "$report_dir/report.md"
          python3 -c 'import html, os, pathlib; p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "coverage"; (p / "index.html").write_text("<!doctype html><meta charset=utf-8><title>Rust coverage</title><pre>" + html.escape((p / "report.md").read_text()) + "</pre>")'
          cat "$report_dir/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: ${{ runner.temp }}/coverage
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage reports to Codecov
        if: ${{ always() }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/coverage/lcov.info
          flags: rust
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
