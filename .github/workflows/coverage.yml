name: Coverage

# Coverage is a measurement here, never a gate. No step in this file compares a
# percentage against a threshold, no job is meant to become a required check,
# and every job carries `continue-on-error` so a coverage failure can never
# block a merge — the same report-only shape rust.yml's instruction counts and
# tool-smokes.yml's live smokes already use. What this produces is a job
# summary, a downloadable HTML and LCOV report, and one pull-request comment.
#
# The report is deliberately honest about what it does not measure; the
# "Report the numbers" step below states every exclusion alongside the number,
# because a coverage percentage whose denominator is unstated is not a
# measurement.

on:
  pull_request:
    paths:
      - "apps/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "tooling/summarize_coverage.py"
      - "tooling/test_summarize_coverage.py"
      - ".github/workflows/coverage.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "tooling/summarize_coverage.py"
      - "tooling/test_summarize_coverage.py"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

# Superseded pull-request runs release their slots against the public
# concurrency cap. Every other event takes a group of its own: sharing one
# group would let a third run cancel a second still pending behind the first,
# which `cancel-in-progress: false` does not prevent.
concurrency:
  group: >-
    coverage-${{ github.event_name == 'pull_request'
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-coverage:
    name: Rust coverage (report only)
    continue-on-error: true
    runs-on: ubuntu-latest
    # The instrumented build compiles the workspace once more and then runs
    # both the workspace suite and the three dockerized PostgreSQL suites in
    # one job. They cannot be split across runners: a report needs the
    # profiling data and the instrumented binaries that produced it in the same
    # workspace, and shipping the instrumented binaries between jobs would cost
    # more than the serial minutes do. This is the slowest job in the
    # repository by design, and it gates nothing.
    timeout-minutes: 90
    permissions:
      # `actions: read` is what the baseline fetch below needs to list this
      # workflow's own past runs on main and download one artifact from them.
      # It is a read scope over this repository's Actions data and grants no
      # write anywhere, which is why the fetch can live in the job that also
      # runs the instrumented suite rather than needing a job of its own; the
      # write token still lives only in publish-comment.
      #
      # `contents: read` is restated because a job-level permissions block sets
      # every scope it omits to none, and the checkout below needs it.
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cheap and first: the summarizer's own regression tests run before the
      # hour-long instrumented build, so a broken report renderer fails in
      # seconds rather than at the end.
      - name: Test the coverage summarizer
        run: python3 tooling/test_summarize_coverage.py
      # Mirrors workspace-tests in rust.yml: without Bubblewrap the sandboxed
      # execution suite skips, and the measured surface would silently differ
      # from the surface CI actually tests.
      - name: Install Bubblewrap
        run: sudo apt-get install --yes bubblewrap
      - name: Enable unprivileged user namespaces for Bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          key: rust-coverage
      # Exact version pin, as cargo-deny is pinned in deny.yml: an instrumented
      # build and its report must come from one known tool build.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-llvm-cov@0.8.7
      # Each measured suite runs under `--no-report`, which accumulates
      # profiling data across invocations; the report is generated once from
      # all of them below. Each suite continues on error and its outcome is
      # reported, so one failing suite yields a smaller number that says so
      # rather than no number at all.
      # One test is skipped, and only here. The production exec runner launches
      # its target through the workspace's own `signalbox-exec-supervisor`,
      # which this job instruments; LLVM's profiling runtime sets
      # `__LLVM_PROFILE_RT_INIT_ONCE` in that supervisor's environment, and the
      # variable survives the exec into the target. A test asserting that a
      # cleared environment holds exactly the one variable it was given
      # therefore observes two. Both the assertion and the code under test are
      # right; only the instrumented supervisor differs from the binary
      # rust.yml runs. Skipping the one test it perturbs is honest — the
      # exclusion is stated in the report — where leaving a permanently failed
      # suite row would teach a reader to ignore that column.
      - name: Measure the workspace suite
        id: workspace
        continue-on-error: true
        run: >-
          cargo llvm-cov --no-report --no-fail-fast
          --workspace --all-targets --all-features
          -- --skip production_runner_clears_ambient_environment_when_requested
      - name: Measure the persistence PostgreSQL suite
        id: persistence
        continue-on-error: true
        run: >-
          cargo llvm-cov --no-report --no-fail-fast
          -p signalbox-persistence --features postgres-integration --tests
          -- --ignored --test-threads=4
      # `--skip` keeps the whole-daemon live smoke out of this run. It is
      # already inert without GITHUB_TOKEN, which this job never sets, but a
      # measurement job spends no real HTTP requests by construction rather
      # than by an absent credential.
      - name: Measure the signalboxd PostgreSQL suite
        id: signalboxd
        continue-on-error: true
        run: >-
          cargo llvm-cov --no-report --no-fail-fast
          -p signalboxd --tests
          -- --ignored --test-threads=4
          --skip live_daemon_executes_every_tool_family_and_denies_every_gate
      - name: Measure the terminal-client PostgreSQL suite
        id: terminal_client
        continue-on-error: true
        run: >-
          cargo llvm-cov --no-report --no-fail-fast
          -p signalbox-client --tests
          -- --ignored --test-threads=4
          --skip terminal_client_completes_the_real_anthropic_path
      # Fetches the number this pull request's coverage is reported against.
      # The push-to-main half of this workflow's triggers is what stocks that
      # baseline: a main push touching Rust leaves a `rust-coverage` artifact
      # behind, and this step reads one back.
      #
      # Report-only in the strictest sense available. `set +e` undoes the `-e`
      # the default shell adds, and every path out of the script below writes an
      # `available=` output and exits zero, so an absent, expired, or unreadable
      # baseline degrades the comment to the absolute numbers it already showed
      # and can neither fail this step nor change what the job reports.
      # `continue-on-error` is belt to that braces, covering a runner-level
      # failure the script cannot catch.
      #
      # Pull requests only. A main push is the tree that becomes the next
      # baseline, and comparing it against its predecessor would spend API calls
      # on a job summary nobody reads for a delta.
      #
      # The token is set on this step alone, so the instrumented suites above
      # ran in an environment holding no credential. That is a scoping
      # statement, not an isolation boundary, and it is worth being exact about
      # which: the suites execute pull-request-controlled code on this runner
      # with passwordless sudo, so code that ran earlier can reach a later
      # step's `gh` whatever this step's `env` says. The accepted exposure is a
      # read-only `github.token` on a public repository, carrying `actions:
      # read` and `contents: read` and no write scope anywhere — everything it
      # can reach is already readable by any authenticated account. Isolating
      # the fetch in a job that checks out nothing would buy nothing against
      # that, and would cost a second runner and an artifact round-trip on a
      # report that gates nothing. Grant this step no scope whose loss would
      # matter.
      - name: Fetch the main-branch coverage baseline
        id: baseline
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # The base commit this pull request is open against — the same tree
          # the merge measured above was built on. See the selection below for
          # why this, and not the branch's merge-base, is the attributable one.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Must name this file. The runs endpoint is per-workflow, and a
          # baseline from another workflow's artifact would be a different
          # measurement wearing this one's label.
          WORKFLOW_FILE: coverage.yml
          ARTIFACT_NAME: rust-coverage
          SUMMARY_FILE: summary.json
          # A bounded scan, not a search. Runs are examined newest-first and
          # the first usable artifact wins; without a cap a repository whose
          # artifacts have all expired would spend one API call per historical
          # run to conclude what the first ten already said.
          CANDIDATE_LIMIT: 10
        run: |
          # A failing command here must fall through to a stated reason rather
          # than end the step: the reason is the product when the baseline is
          # not.
          set +e

          # A directory of its own, never the report directory the upload step
          # below publishes: a baseline extracted in there would be republished
          # inside the next run's baseline.
          baseline_dir="$RUNNER_TEMP/coverage-baseline"
          mkdir -p "$baseline_dir"

          unavailable() {
            {
              echo 'available=false'
              echo "reason=$1"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          # The provenance is read from named variables rather than `$1`, `$2`,
          # `$3`. They are three adjacent strings, so a transposition at the
          # call site is a valid call that publishes a timestamp where the
          # measured commit belongs — and two similarly named dates are in
          # scope at that call site: `run_date`, the run's own, and
          # `artifact_date`, the upload's, which is the one the report wants.
          # `load_baseline` already refuses the same run positionally on the
          # Python side; this was the last unlabelled link in the chain.
          #
          # Emptiness is checked rather than assumed. `set +e` is in force and
          # `-u` deliberately is not, so an unset or misspelled name would
          # otherwise expand to nothing and publish blank provenance — the
          # silent version of the failure this labelling exists to prevent.
          available() {
            for name in baseline_label baseline_sha baseline_date; do
              if [ -z "${!name}" ]; then
                printf 'internal error: %s unset at the available() boundary\n' \
                  "$name" >&2
                exit 1
              fi
            done
            {
              echo 'available=true'
              echo "label=$baseline_label"
              echo "sha=$baseline_sha"
              echo "date=$baseline_date"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Successful pushes to main only, and both halves of that matter. A
          # pull-request run measured a synthetic merge commit that never
          # landed. A run that ended red lost something its per-suite
          # `continue-on-error` could not absorb, so its report covers a
          # smaller workspace than a green one, and a delta against it would be
          # that gap rather than a code change. When no green main run exists,
          # the comment says so, which is itself the readout worth having.
          if ! runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?branch=main&event=push&status=success&per_page=100")"; then
            unavailable "the list of \`main\` runs of this workflow could not be read"
          fi

          # The base commit's own run is asked for by SHA rather than looked for
          # inside the page above. The list is bounded at 100, and a pull request
          # open long enough for its base to fall behind that many `main` pushes
          # would silently lose the attributable base delta — the artifact is
          # still there and still unexpired, it is simply off the page. A
          # `head_sha` query answers the exact question directly, so the recent
          # page no longer has to happen to contain the answer.
          #
          # Skipped rather than guessed when the base SHA is unset: an empty
          # `head_sha` filters nothing, so the first recent run would come back
          # and be labelled `base`, attributing the delta to a commit that never
          # measured it.
          exact='{"workflow_runs":[]}'
          if [ -n "$BASE_SHA" ]; then
            if ! exact="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?branch=main&event=push&status=success&head_sha=$BASE_SHA&per_page=1")"; then
              unavailable "the \`main\` run of the base commit could not be read"
            fi
          fi

          # The run that measured this pull request's own base first when there
          # is one, then the most recent runs, each tagged with which of the
          # two it is. The label travels with the number from here to the
          # rendered sentence.
          #
          # The exact-base run takes one of the cap's slots rather than sitting
          # outside it, so the number of candidates examined is the number the
          # exhausted-scan diagnostic reports. Appending the cap on top of it
          # made that sentence understate the work by one.
          #
          # The base, not the branch's merge-base. A `pull_request` checkout is
          # `refs/pull/N/merge` — this branch merged into the base it is open
          # against — so the tree measured above already contains everything on
          # `main` up to that base. Subtracting a merge-base measurement would
          # subtract the fork point instead, leaving every commit that landed on
          # `main` in between inside a delta the report calls this branch's own
          # doing. Against the base those cancel, and the claim is true. When
          # the branch is current with `main` the two commits coincide, which is
          # why the older selection looked right whenever anyone checked it.
          candidates="$(printf '%s' "$runs" | jq -r \
            --argjson exact "$exact" --argjson cap "$CANDIDATE_LIMIT" '
              (($exact.workflow_runs // []) | first) as $base
              | (if $base == null then 0 else 1 end) as $reserved
              | [ $base | select(. != null) | {label: "base", run: .} ]
                + ([.workflow_runs[]
                    | select($base == null or .id != $base.id)
                    | {label: "latest-main", run: .}][0:$cap - $reserved])
              | .[]
              | [.label, (.run.id | tostring), .run.head_sha, .run.created_at]
              | @tsv')"

          # The first candidate's reason is the one reported: it is the run a
          # reader would have expected to be the baseline, so why it was not is
          # the answer they want.
          reason=''
          while IFS=$'\t' read -r label run_id run_sha run_date; do
            # An empty candidate list still feeds this loop one blank line.
            [ -n "$run_id" ] || continue

            # The API call is checked before its output is filtered. `set +e`
            # is in force, and the pipeline's status is jq's, so a transient
            # API or auth failure previously produced empty output that read
            # as "this run uploaded no artifact" — a false diagnostic about
            # the run rather than a true one about the request.
            if ! artifacts_json="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"; then
              [ -n "$reason" ] || reason="the artifacts of run $run_id could not be read"
              continue
            fi
            artifact="$(printf '%s' "$artifacts_json" \
              | jq -r --arg name "$ARTIFACT_NAME" '
                  [.artifacts[] | select(.name == $name)] | first
                  | if . == null then ""
                    else "\(.id)\t\(.expired)\t\(.created_at)" end')"
            if [ -z "$artifact" ]; then
              [ -n "$reason" ] || reason="run $run_id uploaded no \`$ARTIFACT_NAME\` artifact"
              continue
            fi
            # The artifact's own creation time, not the run's. A run that is
            # re-run days later keeps its original `created_at` while the
            # artifact comes from the later attempt, and the date is the
            # report's staleness signal — the one number a reader uses to
            # judge how much the baseline is worth.
            IFS=$'\t' read -r artifact_id expired artifact_date <<<"$artifact"
            if [ "$expired" = 'true' ]; then
              [ -n "$reason" ] || reason="the artifact from run $run_id has expired"
              continue
            fi

            if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$baseline_dir/artifact.zip"; then
              [ -n "$reason" ] || reason="the artifact from run $run_id could not be downloaded"
              continue
            fi
            # Only the machine-readable summary is extracted; the HTML report in
            # the same artifact is tens of megabytes nothing here reads. The
            # previous candidate's file is removed first: `unzip` leaves the old
            # one in place when this artifact has no member to overwrite it,
            # and the check below would then read one run's summary under
            # another run's provenance.
            rm -f "$baseline_dir/$SUMMARY_FILE"
            unzip -o -q "$baseline_dir/artifact.zip" "$SUMMARY_FILE" -d "$baseline_dir" || true
            rm -f "$baseline_dir/artifact.zip"
            if [ ! -s "$baseline_dir/$SUMMARY_FILE" ]; then
              [ -n "$reason" ] || reason="the artifact from run $run_id holds no \`$SUMMARY_FILE\`"
              continue
            fi
            # A present-but-unusable summary must not end the scan. A report
            # command that died partway leaves truncated output behind and the
            # always-running upload step publishes it, so the newest candidate
            # is exactly the one likely to carry it — and ending here would
            # report "unreadable" while an older run holds a perfectly good
            # artifact. This is a pre-filter on the contract the summarizer's
            # loader enforces, not a second implementation of the reason
            # strings: the summarizer stays the authority on what a reader is
            # told, including for a baseline that validates here and still
            # fails to load at render time.
            # Every field the loader consumes is checked, not just the line
            # total: `read_file_summaries` indexes `entry["filename"]` directly
            # and raises `KeyError` when it is absent, and `read_counter`
            # coerces each present counter value with `int()`, which raises on
            # a value like "broken" or "5.5". An export failing either passes a
            # counts-only predicate and still fails to load, ending the scan
            # while an older usable artifact goes unexamined.
            #
            # The containers must be the arrays the loader iterates. `.data[]`
            # walks an object's *values* just as happily as an array's
            # elements, so an object-shaped `data` or `files` passes every
            # element check below and then fails in `read_file_summaries`,
            # which calls `.get` on what it was handed.
            #
            # `summary` absent defaults to `{}` the way `entry.get("summary",
            # {})` does, but `summary: null` does not: the loader gets `None`
            # back and raises `AttributeError`. `// {}` would have conflated
            # the two and accepted a document the loader rejects, so the
            # default is keyed on the key's presence rather than its value.
            #
            # A counter that is absent, or not an object, stays acceptable:
            # `read_counter` defaults those to empty on purpose so the report
            # survives a toolchain that grows a counter. Only values that are
            # present are required to be ones `int()` accepts — a number, or a
            # string of digits. `tonumber` is deliberately not the test: it
            # accepts "5.5", which `int()` rejects.
            #
            # The sum applies `read_counter`'s object guard too. `okcounter`
            # accepts a non-object counter because the loader tolerates one —
            # but indexing `.count` on, say, `"lines": 1` is a jq *error*, not
            # a false, so the whole predicate failed and discarded a candidate
            # `load_baseline` reads fine.
            #
            # The total is summed the way the loader sums it: `int()` truncates
            # each value toward zero *before* the addition, so two files each
            # reporting 0.5 lines total zero to the loader while a plain sum
            # would make them one. `trunc` reproduces that, per value.
            #
            # One divergence from the loader is deliberate: it rejects only a
            # zero line total, while this rejects any total that is not
            # positive. A negative total is not something llvm-cov can emit,
            # and treating one as a baseline would render nonsense deltas
            # rather than fall through to an artifact that measures something.
            if ! jq -e '
                  def okint: (type == "number")
                    or (type == "string" and test("^[+-]?[0-9]+$"));
                  def trunc: if . < 0 then -((-.) | floor) else floor end;
                  # The largest counter the summarizer can carry through to a
                  # rendered percentage. `okint` accepts any JSON number and
                  # `1e999` is one: jq loads it as infinity, `json.loads` hands
                  # `int()` that same infinity, and `int(inf)` raises
                  # `OverflowError` — which the loader does not catch, so the
                  # scan stopped on such a candidate and failed the report step
                  # instead of falling through to an older artifact. An
                  # unbounded digit string overflows one step later, when the
                  # percentage is converted to floating point. 2^53-1 is where a
                  # double stops representing integers exactly, which is also
                  # where the comparisons below stop being trustworthy.
                  def maxcounter: 9007199254740991;
                  def okfield($k): (has($k) | not) or (.[$k] | okint);
                  def counted($k): (.[$k] // 0) | tonumber | trunc;
                  # A counter cannot be negative, and cannot report more
                  # covered than exist. A corrupt artifact saying
                  # `{"count": 1, "covered": 2}` is a 200% baseline, which
                  # renders a complete current measurement as a fabricated
                  # -100.00 pp regression instead of falling through to an
                  # older usable artifact.
                  #
                  # Deliberately stricter than the loader, which does not
                  # validate counters at all — the second such divergence
                  # here, alongside the non-positive line total. Both reject
                  # a document `load_baseline` would read, because reading it
                  # yields a number no reviewer can act on.
                  def sane: (counted("count") >= 0)
                    and (counted("covered") >= 0)
                    and (counted("count") <= maxcounter)
                    and (counted("covered") <= maxcounter)
                    and (counted("covered") <= counted("count"));
                  def okcounter: (type != "object")
                    or (okfield("count") and okfield("covered") and sane);
                  .type == "llvm.coverage.json.export"
                  and ((.data | type) == "array")
                  and all(.data[]; (.files | type) == "array")
                  and all(.data[]?.files[]?; has("filename"))
                  and all(.data[]?.files[]?;
                        (if has("summary") then .summary else {} end)
                        | (type == "object")
                          and (.lines | okcounter)
                          and (.functions | okcounter)
                          and (.regions | okcounter))
                  and (([.data[]?.files[]?
                         | .summary.lines
                         | if type == "object" then .count // 0 else 0 end
                         | tonumber | trunc]
                        | add) // 0
                       | (. > 0) and (. <= maxcounter))
                ' "$baseline_dir/$SUMMARY_FILE" > /dev/null 2>&1; then
              [ -n "$reason" ] || reason="the \`$SUMMARY_FILE\` from run $run_id is not a readable coverage export"
              rm -f "$baseline_dir/$SUMMARY_FILE"
              continue
            fi

            baseline_label="$label"
            baseline_sha="$run_sha"
            baseline_date="$artifact_date"
            available
          done <<<"$candidates"

          if [ -z "$reason" ]; then
            unavailable "no successful \`main\` run of this workflow was found"
          fi
          # What was actually examined, which is not always "the most recent"
          # runs. The exact-base run takes one of the cap's slots, and when it
          # is older than the fallbacks the scanned set is that older run plus
          # the newest ones — so naming the whole set "the N most recent"
          # described a set that was never scanned, even though the count was
          # right.
          examined="$(printf '%s' "$candidates" | grep -c '[^[:space:]]')"
          if [ "$(printf '%s' "$candidates" | head -n 1 | cut -f1)" = base ]; then
            scope="the base commit's own run and the $((examined - 1)) most recent successful \`main\` runs"
          else
            scope="the $examined most recent successful \`main\` runs"
          fi
          unavailable "$reason ($scope were examined)"
      - name: Report the numbers
        if: ${{ always() }}
        env:
          # `github.sha` is the commit this job actually checked out. On a
          # pull_request event that is the synthetic merge of the head into the
          # base, which is the tree rust.yml gates on too — measuring anything
          # else would make this number describe a different tree than
          # `validate` does. The head is reported beside it rather than instead
          # of it, because the merge commit is the one that was measured and
          # the head is the one a reader recognises.
          MEASURED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKSPACE_OUTCOME: ${{ steps.workspace.outcome }}
          PERSISTENCE_OUTCOME: ${{ steps.persistence.outcome }}
          SIGNALBOXD_OUTCOME: ${{ steps.signalboxd.outcome }}
          TERMINAL_CLIENT_OUTCOME: ${{ steps.terminal_client.outcome }}
          # All empty on a push to main, where the step above does not run:
          # that report is rendered exactly as it was before there were deltas,
          # which is also what makes it a clean baseline for the next one.
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.available }}
          BASELINE_REASON: ${{ steps.baseline.outputs.reason }}
          BASELINE_LABEL: ${{ steps.baseline.outputs.label }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          BASELINE_DATE: ${{ steps.baseline.outputs.date }}
          # Distinguishes "no baseline was ever asked for" (a push to main)
          # from "the fetch step did not complete", which look identical in
          # the outputs but must not read the same to a reviewer.
          EVENT_NAME: ${{ github.event_name }}
          BASELINE_SUMMARY: ${{ runner.temp }}/coverage-baseline/summary.json
        run: |
          report_dir="$RUNNER_TEMP/coverage"
          mkdir -p "$report_dir"
          cargo llvm-cov report --lcov --output-path "$report_dir/lcov.info"
          cargo llvm-cov report --html --output-dir "$report_dir"
          # `--summary-only` drops the per-region detail the summarizer never
          # reads, which is the difference between a 140 KiB document and a
          # 70 MiB one.
          cargo llvm-cov report --json --summary-only \
            --output-path "$report_dir/summary.json"

          {
            echo '| Measured suite | Outcome |'
            echo '| --- | --- |'
            echo "| workspace (\`--all-targets --all-features\`) | $WORKSPACE_OUTCOME |"
            echo "| persistence PostgreSQL (\`--ignored\`) | $PERSISTENCE_OUTCOME |"
            echo "| signalboxd PostgreSQL (\`--ignored\`) | $SIGNALBOXD_OUTCOME |"
            echo "| terminal-client PostgreSQL (\`--ignored\`) | $TERMINAL_CLIENT_OUTCOME |"
            echo
            echo '<details><summary>What this number does not measure</summary>'
            echo
            echo '- Doctests. `cargo llvm-cov --doctests` needs a nightly'
            echo '  toolchain; this workspace pins stable, so the compile-fail'
            echo '  sealing proofs and every other doctest are outside the'
            echo '  denominator.'
            echo '- Live smokes, which spend real network requests or'
            echo '  credentials and are never run here: the tools-github and'
            echo '  tools-web smokes stay `--ignored`, and the whole-daemon and'
            echo '  real-provider terminal smokes are skipped by name above.'
            echo '- The Swift native client, which Xcode measures separately.'
            echo '- One environment-clearing test in `signalbox-tools-exec`,'
            echo '  which instrumenting its supervisor process perturbs. The'
            echo '  workflow comment on the workspace step states why; rust.yml'
            echo '  runs that test uninstrumented and gates on it.'
            echo '- Dedicated test files. cargo-llvm-cov excludes `tests/`'
            echo '  and `benches/` targets and `*tests.rs` modules from the'
            echo '  report by default, so that test code is counted neither'
            echo '  covered nor uncovered here. Inline `#[cfg(test)]` modules'
            echo '  inside a source file are the exception: they are'
            echo '  instrumented, and they land on both sides. A test body'
            echo '  that ran counts as covered, which makes every percentage'
            echo '  below optimistic; the body of an `#[ignore]`d test no'
            echo '  measured suite runs counts as uncovered, which puts test'
            echo '  lines into the file ranking. Read both tables as close,'
            echo '  not exact.'
            echo
            echo '</details>'
          } > "$report_dir/preamble.md"

          # Built in one place so a delta can never be rendered without the
          # label saying which baseline produced it; the summarizer refuses the
          # pair split apart. The positional parameters carry them because an
          # empty array is not portable to expand, and this must expand to
          # nothing at all on a push to main.
          if [ "$BASELINE_AVAILABLE" = 'true' ]; then
            set -- --baseline "$BASELINE_SUMMARY" \
              --baseline-label "$BASELINE_LABEL" \
              --baseline-sha "$BASELINE_SHA" \
              --baseline-date "$BASELINE_DATE"
          elif [ -n "$BASELINE_REASON" ]; then
            set -- --baseline-unavailable "$BASELINE_REASON"
          elif [ "$EVENT_NAME" = 'pull_request' ]; then
            # The fetch step writes an `available=` output on every path it
            # controls, so an empty one means the step itself did not finish —
            # it is `continue-on-error`, and a runner-level failure writes
            # nothing. On a pull request a delta was expected, and omitting it
            # silently reads as "no change": the exact misreading the stated
            # reason exists to prevent.
            set -- --baseline-unavailable "the baseline fetch step did not complete"
          else
            set --
          fi

          python3 tooling/summarize_coverage.py "$report_dir/summary.json" \
            --preamble "$report_dir/preamble.md" \
            --top-uncovered 25 "$@" > "$report_dir/report.md"

          cat "$report_dir/report.md" >> "$GITHUB_STEP_SUMMARY"

          {
            printf '%s\n\n' '<!-- signalbox-rust-coverage -->'
            cat "$report_dir/report.md"
            printf '\nMeasured at `%s`' "$MEASURED_SHA"
            if [ -n "$HEAD_SHA" ]; then
              printf ', the merge commit this pull request builds, whose head is `%s`' \
                "$HEAD_SHA"
            fi
            printf ', by [run %s](%s/%s/actions/runs/%s), which uploads the HTML report and LCOV as an artifact.\n' \
              "$GITHUB_RUN_ID" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$report_dir/comment.md"
      - name: Upload the coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: ${{ runner.temp }}/coverage
          if-no-files-found: error
          retention-days: 14

  # Holds the only write token in this workflow and never builds or executes
  # anything, mirroring the token separation devenv-lock.yml already uses: the
  # instrumented test run above cannot reach a token that can write to a pull
  # request.
  #
  # A pull request from a fork is skipped rather than attempted. GitHub issues
  # such a run a read-only token no matter what `permissions` requests, so the
  # comment would fail; the job summary and the uploaded report are unaffected
  # and remain the whole report for a fork contributor.
  #
  # It runs whenever the coverage job reached an end, not only when that job
  # produced a report: a run that measured nothing must replace the previous
  # run's numbers rather than leave them standing as the current readout. A
  # cancelled run is the one exception, since a superseded run has a successor
  # already on its way to overwrite the comment.
  publish-comment:
    name: Comment the coverage report
    needs: rust-coverage
    if: >-
      always()
      && needs.rust-coverage.result != 'cancelled'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # `actions: read` lets the download step read this run's artifact; a
      # job-level permissions block sets every scope it omits to none.
      actions: read
      pull-requests: write
    steps:
      # Continues on error so a run that uploaded no report still reaches the
      # step below, which replaces the stale comment instead of leaving it.
      - name: Download the coverage report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-coverage
          path: ${{ runner.temp }}/coverage
      # One comment per pull request, rewritten in place on every push: a
      # coverage report is a current-state readout, and a thread of superseded
      # readouts would bury the review conversation.
      - name: Post or update the coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$RUNNER_TEMP/coverage/comment.md"
          payload="$RUNNER_TEMP/payload.json"

          # No report means the run measured nothing. Saying so under the same
          # marker retires the previous run's numbers, which would otherwise
          # keep reading as this head's, and names the head that has none.
          if [ ! -f "$body" ]; then
            mkdir -p "$RUNNER_TEMP/coverage"
            {
              printf '%s\n\n' '<!-- signalbox-rust-coverage -->'
              printf '## Rust coverage (report only)\n\n'
              printf 'The coverage run for `%s` produced no report; see ' "$HEAD_SHA"
              printf '[run %s](%s/%s/actions/runs/%s).\n\n' \
                "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
                "$GITHUB_RUN_ID"
              printf 'Nothing is gated on this. The measurement is missing, '
              printf 'not failing, and no merge waits on it.\n'
            } > "$body"
          fi
          jq -n --rawfile body "$body" '{body: $body}' > "$payload"

          # Paginated: a long-running pull request can hold more comments than
          # one page, and the marker comment is the oldest of them.
          existing="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | startswith("<!-- signalbox-rust-coverage -->")) | .id')"
          first="${existing%%$'\n'*}"

          if [ -n "$first" ]; then
            gh api -X PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$first" \
              --input "$payload" --silent
          else
            gh api -X POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --input "$payload" --silent
          fi
