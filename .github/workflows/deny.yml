name: Supply chain

on:
  pull_request:
  schedule:
    # Weekly sweep so new advisories against unchanged dependencies still
    # surface between pull requests.
    - cron: "17 6 * * 1"

# Superseded pull-request runs release their slots against the public
# concurrency cap; scheduled sweeps are never canceled.
concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-deny@0.20.2
      - name: Check advisories, bans, licenses, and sources
        run: cargo deny check advisories bans licenses sources
