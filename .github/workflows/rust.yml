name: Rust

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs release their slots against the public concurrency cap:
# pull-request runs group per PR, and other non-main runs group per
# event+ref (today only workflow_dispatch reaches that arm — every push
# trigger in this repo is filtered to main). Main runs each take a group
# of their own and are never canceled: sharing one group would let a third
# run cancel a second still pending behind the first, which
# `cancel-in-progress: false` does not prevent.
concurrency:
  group: >-
    rust-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref)
    || github.ref == 'refs/heads/main' && github.run_id
    || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"
  # CI never reuses incremental artifacts across runs; they are pure write
  # amplification on the self-hosted runners' scratch NVMe (measured 2026-08-22).
  CARGO_INCREMENTAL: "0"
  # Line tables keep backtraces and coverage useful at a fraction of the
  # debuginfo bytes written per build.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  # Keep the required `validate` check present on
  # every pull-request head. The aggregate jobs below accept skipped Rust
  # work only when this job proves no changed path can reach the Rust build:
  # every path is either non-binding Markdown/`docs/` prose or browser-client
  # source under `clients/web/` (the generated contract under
  # `clients/web/src/generated/` is Rust output and keeps the full bar, as
  # does `clients/web`'s own workflow file). Pushes to main always run the
  # complete workflow. `clients/web/**` changes are gated by `web.yml`, which
  # triggers on exactly that path set.
  rust-change-scope:
    name: Rust change scope
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
      web_only: ${{ steps.paths.outputs.web_only }}
      skip_rust: ${{ steps.paths.outputs.skip_rust }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          web_only=false
          skip_rust=false
          if [ "$EVENT_NAME" = pull_request ]; then
            docs=0
            web=0
            rust=0
            changed_paths="$RUNNER_TEMP/rust-changed-files"
            git diff --no-renames --name-only -z \
              "$BASE_SHA...$HEAD_SHA" > "$changed_paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Binding process/specification prose and generated indexes
                # run the complete bar even though they are Markdown.
                AGENTS.md | */AGENTS.md | docs/agents/* | docs/spec/* \
                  | docs/api/* \
                  | docs/style.md)
                  rust=$((rust + 1))
                  ;;
                docs/* | *.md)
                  docs=$((docs + 1))
                  ;;
                # Generated browser-contract output is produced from Rust and
                # checked against it by the workspace tests.
                clients/web/src/generated/*)
                  rust=$((rust + 1))
                  ;;
                clients/web/*)
                  web=$((web + 1))
                  ;;
                *)
                  rust=$((rust + 1))
                  ;;
              esac
            done < "$changed_paths"
            if [ "$rust" -eq 0 ]; then
              skip_rust=true
              [ "$web" -eq 0 ] && docs_only=true
              [ "$docs" -eq 0 ] && web_only=true
            fi
            echo "changed paths: docs=$docs web=$web rust-reaching=$rust" \
              "-> skip_rust=$skip_rust"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "web_only=$web_only" >> "$GITHUB_OUTPUT"
          echo "skip_rust=$skip_rust" >> "$GITHUB_OUTPUT"

  contract-checks:
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Python with Markdown exclusion support
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install Markdown toolchain
        run: |
          python3 -m venv --clear /tmp/mdformat-venv
          /tmp/mdformat-venv/bin/pip install --quiet -r tooling/requirements-mdformat.txt
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
      - name: Check generated domain API declarations
        env:
          BAZEL_REMOTE_CACHE: ${{ vars.BAZEL_REMOTE_CACHE }}
        run: |
          cache_args=()
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" && -n "$BAZEL_REMOTE_CACHE" ]]; then
            cache_args+=(--remote_cache="$BAZEL_REMOTE_CACHE")
          fi
          bazel test --config=api --jobs=4 --local_test_jobs=1 "${cache_args[@]}" //:api_documentation_current
      - name: Check documentation consistency
        if: ${{ !cancelled() }}
        run: /tmp/mdformat-venv/bin/python scripts/check_docs_consistency.py
      - name: Check migration version uniqueness
        if: ${{ !cancelled() }}
        run: python3 scripts/check_migration_versions.py
      - name: Check ownership-seam boundaries
        if: ${{ !cancelled() }}
        run: python3 scripts/check_ownership_seam.py
  domain-api-digest:
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
      - name: Report domain API digest
        continue-on-error: true
        env:
          BAZEL_REMOTE_CACHE: ${{ vars.BAZEL_REMOTE_CACHE }}
          DOMAIN_SPINE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          rustdoc_toolchain=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("docs/api/crates.toml").read_text())["rustdoc_toolchain"])')
          rustup toolchain install "$rustdoc_toolchain" --profile minimal
          export PATH="$PATH:${CARGO_HOME:-$HOME/.cargo}/bin"
          command -v cargo-public-api || cargo install cargo-public-api --locked
          cache_args=()
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" && -n "$BAZEL_REMOTE_CACHE" ]]; then
            cache_args+=(--remote_cache="$BAZEL_REMOTE_CACHE")
          fi
          bazel build --config=api --jobs=4 "${cache_args[@]}" //:api_json
          mapfile -t json_dirs < <(bazel cquery --config=api //:api_json --output=files | tr ' ' '\n')
          python3 scripts/domain_spine_digest.py --json-dir "${json_dirs[@]}" >> "$GITHUB_STEP_SUMMARY"
  checker-and-format-tests:
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
      - name: Test checkers and check generated files and Markdown
        env:
          BAZEL_REMOTE_CACHE: ${{ vars.BAZEL_REMOTE_CACHE }}
        run: |
          cache_args=()
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" && -n "$BAZEL_REMOTE_CACHE" ]]; then
            cache_args+=(--remote_cache="$BAZEL_REMOTE_CACHE")
          fi
          bazel test --keep_going --jobs=4 --local_test_jobs=1 "${cache_args[@]}" //:python_checker_tests //:markdown_format //:generated_artifact_tests //:rust_format_tests
      # The scan rejects row-lock clauses and advisory-lock calls outside the
      # inventory in production Rust. This performs no Rust or SQL parsing.
      - name: Check explicit-lock inventory
        if: ${{ !cancelled() }}
        run: |
          unexpected="$(git ls-files -z 'crates/persistence/src/*.rs' \
            | xargs -0 perl -0777 -ne '
              next if $ARGV =~ m{/lock_inventory[.]rs$};
              s{/[*].*?[*]/}{ }gs;
              s{^\s*//[^\n]*}{ }gm;
              s{--[^\n]*}{ }g;
              s/\s+/ /g;
              print "$ARGV\n" if /\bfor (?:no key update|key share|share|update)\b/i
                || /\bpg_(?:try_)?advisory_(?:xact_)?lock(?:_shared)?\s*\(/i;
            ')"
          test -z "$unexpected" || {
            printf 'explicit lock outside inventory:\n%s\n' "$unexpected"
            exit 1
          }
  validate-checks:
    if: ${{ always() }}
    needs:
      [contract-checks, checker-and-format-tests]
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 1
    steps:
      - name: Confirm every implementation check passed
        env:
          CONTRACT_RESULT: ${{ needs.contract-checks.result }}
          CHECKER_RESULT: ${{ needs.checker-and-format-tests.result }}
        run: |
          test "$CONTRACT_RESULT" = success
          test "$CHECKER_RESULT" = success

  # Preserve the required check across the scoped Rust and Bazel jobs.
  validate:
    name: validate
    if: ${{ always() }}
    needs: [rust-change-scope, validate-checks, bazel]
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 20
    steps:
      - name: Confirm the Rust and Bazel checks passed
        env:
          CHECKS_RESULT: ${{ needs.validate-checks.result }}
          BAZEL_RESULT: ${{ needs.bazel.result }}
          SKIP_RUST: ${{ needs.rust-change-scope.outputs.skip_rust }}
        run: |
          test "$CHECKS_RESULT" = success
          if [ "$SKIP_RUST" = true ]; then
            test "$BAZEL_RESULT" = skipped
          else
            test "$BAZEL_RESULT" = success
          fi
      - name: Check out repository for Cargo contract checks
        if: ${{ !cancelled() && needs.rust-change-scope.outputs.skip_rust != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the catalog workspace dependency boundary
        if: ${{ !cancelled() && needs.rust-change-scope.outputs.skip_rust != 'true' }}
        run: >-
          cargo test --no-fail-fast -p signalbox-model-reference-catalog --test catalog
          -- reference_catalog_has_no_workspace_dependency_edge --exact
      - name: Check the pinned Codex schema fixtures
        if: ${{ !cancelled() && needs.rust-change-scope.outputs.skip_rust != 'true' }}
        run: cargo test --no-fail-fast -p signalbox-model-runtime-codex-cli --test schema_fixtures

  # Report-only by owner decision: this job publishes deterministic counts
  # for human comparison but can never fail the workflow or gate a merge.
  domain-instruction-counts:
    name: Domain instruction counts (report only)
    continue-on-error: true
    needs: rust-change-scope
    if: needs.rust-change-scope.outputs.skip_rust != 'true'
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # The pinned Signalbox runner image includes Valgrind, so this public-repo
      # job needs neither root access nor an unpinned package installation.
      - name: Use the node-local cargo target cache
        # Self-hosted runners expose a persistent per-node cache directory
        # through /home/runner/_work/_ci-cache, provisioned by the runner pod
        # template outside this repository. Each run gets its own target dir,
        # cloned copy-on-write (reflink, same XFS filesystem) from the last
        # successful run with the same lockfile/toolchain key, so concurrent
        # runs never share a cargo lock and nothing one run writes leaks into
        # another. GitHub-hosted runners have no such directory and keep the
        # default. Run dirs untouched for a day are pruned at job start.
        id: nodecache
        shell: bash
        run: |
          cache=/home/runner/_work/_ci-cache
          if [ -d "$cache/target" ]; then
            key="${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}"
            job="${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}"
            base="$cache/target/$key/$job"
            mkdir -p "$base/runs"
            find "$base/runs" -mindepth 1 -maxdepth 1 -type d -mtime +0 -exec rm -rf {} + 2>/dev/null || true
            target="$base/runs/${{ github.run_id }}-${{ github.run_attempt }}"
            if [ -d "$base/latest" ] && cp --reflink=always -a "$base/latest/." "$target" 2>/dev/null; then
              echo "seeded $target from the last successful run (reflink)"
            else
              rm -rf "$target"; mkdir -p "$target"
              echo "no seed available; fresh target dir $target"
            fi
            echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
            echo "NODECACHE_BASE=$base" >> "$GITHUB_ENV"
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "no node-local cache directory; using the default target dir"
          fi
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # With the node-local target dir active, uploading/extracting target
          # archives through the GitHub cache is pure write amplification.
          cache-targets: ${{ steps.nodecache.outputs.active != 'true' }}
          shared-key: rust
          save-if: false
      - name: Install Gungraun runner
        run: cargo install --locked --version '=0.19.4' gungraun-runner
      - name: Report domain instruction counts and simulated cache behavior
        run: |
          benchmark_log="$RUNNER_TEMP/domain-instruction-counts.txt"
          set +e
          SIGNALBOX_DOMAIN_INSTRUCTION_BENCHMARK=1 \
            cargo bench --locked -p signalbox-domain --bench instruction_counts \
            2>&1 | tee "$benchmark_log"
          benchmark_status="${PIPESTATUS[0]}"
          set -e
          {
            echo '## Domain instruction counts (report only)'
            echo
            echo 'This report is informational. It has no threshold and gates nothing.'
            echo
            echo '```text'
            cat "$benchmark_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$benchmark_status"

      - name: Publish this run's target dir as the cache seed
        # Seeds come only from pushes and same-repository pull requests, never
        # from forks; a unique temporary link keeps concurrent publishers from
        # racing each other before the atomic rename.
        if: >-
          success() && steps.nodecache.outputs.active == 'true'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          tmp="$NODECACHE_BASE/latest.tmp.${{ github.run_id }}-${{ github.run_attempt }}"
          ln -sfn "$CARGO_TARGET_DIR" "$tmp" && mv -T "$tmp" "$NODECACHE_BASE/latest"
          echo "cache seed -> $CARGO_TARGET_DIR"

  bazel:
    needs: rust-change-scope
    if: needs.rust-change-scope.outputs.skip_rust != 'true'
    uses: ./.github/workflows/bazel.yml
