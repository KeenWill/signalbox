name: Rust

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs release their slots against the public concurrency cap:
# pull-request runs group per PR, and other non-main runs group per
# event+ref (today only workflow_dispatch reaches that arm — every push
# trigger in this repo is filtered to main). Main runs each take a group
# of their own and are never canceled: sharing one group would let a third
# run cancel a second still pending behind the first, which
# `cancel-in-progress: false` does not prevent.
concurrency:
  group: >-
    rust-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref)
    || github.ref == 'refs/heads/main' && github.run_id
    || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"
  # CI never reuses incremental artifacts across runs; they are pure write
  # amplification on the self-hosted runners' scratch NVMe (measured 2026-08-22).
  CARGO_INCREMENTAL: "0"
  # Line tables keep backtraces and coverage useful at a fraction of the
  # debuginfo bytes written per build.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  # Keep the required `validate` and `postgres-integration` checks present on
  # every pull-request head. Their aggregate jobs below accept skipped Rust
  # work only when this job proves no changed path can reach the Rust build:
  # every path is either non-binding Markdown/`docs/` prose or browser-client
  # source under `clients/web/` (the generated contract under
  # `clients/web/src/generated/` is Rust output and keeps the full bar, as
  # does `clients/web`'s own workflow file). Pushes to main always run the
  # complete workflow. `clients/web/**` changes are gated by `web.yml`, which
  # triggers on exactly that path set.
  rust-change-scope:
    name: Rust change scope
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
      web_only: ${{ steps.paths.outputs.web_only }}
      skip_rust: ${{ steps.paths.outputs.skip_rust }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          web_only=false
          skip_rust=false
          if [ "$EVENT_NAME" = pull_request ]; then
            docs=0
            web=0
            rust=0
            changed_paths="$RUNNER_TEMP/rust-changed-files"
            git diff --no-renames --name-only -z \
              "$BASE_SHA...$HEAD_SHA" > "$changed_paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Binding process/specification prose and generated indexes
                # run the complete bar even though they are Markdown.
                AGENTS.md | */AGENTS.md | docs/agents/* | docs/spec/* \
                  | docs/domain-spine.md | docs/invariants.md \
                  | docs/scenarios.md | docs/style.md)
                  rust=$((rust + 1))
                  ;;
                docs/* | *.md)
                  docs=$((docs + 1))
                  ;;
                # Generated browser-contract output is produced from Rust and
                # checked against it by the workspace tests.
                clients/web/src/generated/*)
                  rust=$((rust + 1))
                  ;;
                clients/web/*)
                  web=$((web + 1))
                  ;;
                *)
                  rust=$((rust + 1))
                  ;;
              esac
            done < "$changed_paths"
            if [ "$rust" -eq 0 ]; then
              skip_rust=true
              [ "$web" -eq 0 ] && docs_only=true
              [ "$docs" -eq 0 ] && web_only=true
            fi
            echo "changed paths: docs=$docs web=$web rust-reaching=$rust" \
              "-> skip_rust=$skip_rust"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "web_only=$web_only" >> "$GITHUB_OUTPUT"
          echo "skip_rust=$skip_rust" >> "$GITHUB_OUTPUT"

  contract-checks:
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 10
    steps:
      # Full history also fetches `refs/remotes/origin/*`, which the docs
      # checker reads verification provenance from: the first-parent history of
      # `origin/main`, never a merge the branch under review contributes.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check generated invariant index
        run: python3 scripts/generate_invariants.py --check
      - name: Check domain spine sync
        run: python3 scripts/check_domain_spine.py
      - name: Check documentation consistency
        run: python3 scripts/check_docs_consistency.py
      - name: Check migration version uniqueness
        run: python3 scripts/check_migration_versions.py
      - name: Check numeric bound declarations
        run: python3 scripts/check_numeric_bounds.py
      # Gates normally: the tree satisfies this today, so the step can only
      # fail on a regression. Clippy enforces the panic denies but cannot see
      # a member that opts out of inheriting them, which is the hole this
      # closes. Reads `cargo metadata --no-deps` for the member set, which
      # resolves no dependency graph and compiles nothing, so it belongs above
      # the cache step with the other non-compiling checks.
      - name: Check panic-gate coverage
        run: python3 scripts/check_panic_gate.py
      # Gates normally: the tree satisfies all three rules this checker decides,
      # so the step can only fail on a regression. A rule joins this step only
      # once the tree it scans is already at zero — never as a side effect of a
      # change that merely reduces a count.
      - name: Check style rules
        run: python3 scripts/check_style_rules.py
  checker-and-format-tests:
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test domain-spine checker
        run: python3 scripts/test_check_domain_spine.py
      - name: Test migration version checker
        run: python3 scripts/test_check_migration_versions.py
      - name: Test numeric bound checker
        run: python3 scripts/test_check_numeric_bounds.py
      - name: Test panic-gate checker
        run: python3 scripts/test_check_panic_gate.py
      - name: Test style-rule checker
        run: python3 scripts/test_check_style_rules.py
      - name: Test documentation consistency checker
        run: python3 scripts/test_check_docs_consistency.py
      - name: Test the PostgreSQL suite manifest reader
        run: python3 scripts/test_postgres_integration_suites.py
      - name: Test the convergence reconciler
        run: python3 tooling/convergence-reconciler/test_reconcile.py
      - name: Test the built-executable resolver
        run: python3 tooling/test_resolve_cargo_bin.py
      - name: Test the lifecycle watchdog
        run: python3 tooling/test_supervise_lifecycle.py
      # Drives the sweep against a fake `docker` it puts first on PATH, so it
      # neither needs nor touches the runner's daemon: what is under test is the
      # selection and the failure classification, and a real daemon could not be
      # asked on demand for the orphan ages, the mid-sweep removal, the refused
      # inspection, or the daemon that never answers that the cases require.
      - name: Test the orphaned-container sweep
        run: python3 tooling/test_sweep_test_containers.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Markdown formatting
        run: |
          python3 -m venv /tmp/mdformat-venv
          /tmp/mdformat-venv/bin/pip install --quiet -r tooling/requirements-mdformat.txt
          /tmp/mdformat-venv/bin/mdformat --check *.md docs/
      # Conservative inventory for the recorded session-lock protocols. The
      # checksum makes changes to the small
      # reviewed inventory explicit; the scan rejects strongest-mode row-lock
      # clauses anywhere else in production Rust. This deliberately performs
      # no Rust or SQL parsing.
      - name: Check explicit-lock inventory
        run: |
          inventory_hash="$(sha256sum \
            crates/persistence/src/lock_inventory.rs | cut -d ' ' -f 1)"
          test "$inventory_hash" = \
            0bbd9ebe800a35967e0345df725e53f183a474c5f0dbf512d777886508db8425
          unexpected="$(git ls-files -z 'crates/persistence/src/*.rs' \
            | xargs -0 perl -0777 -ne '
              next if $ARGV =~ m{/lock_inventory[.]rs$};
              s{/[*].*?[*]/}{ }gs;
              s{--[^\n]*}{ }g;
              s/\s+/ /g;
              print "$ARGV\n" if /\bfor update\b/i;
            ')"
          test -z "$unexpected" || {
            printf 'explicit row lock outside inventory:\n%s\n' "$unexpected"
            exit 1
          }
  rust-checks:
    needs: rust-change-scope
    if: needs.rust-change-scope.outputs.skip_rust != 'true'
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    # The self-hosted pool starts with cold caches; give the workspace check
    # headroom until they warm.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use the node-local cargo target cache
        # Self-hosted runners expose a persistent per-node cache directory
        # through /home/runner/_work/_ci-cache, provisioned by the runner pod
        # template outside this repository. Each run gets its own target dir,
        # cloned copy-on-write (reflink, same XFS filesystem) from the last
        # published run with the same lockfile/toolchain key, so concurrent
        # runs never share a cargo lock and nothing one run writes leaks into
        # another. GitHub-hosted runners have no such directory and keep the
        # default. Run dirs older than a day are pruned across every key and
        # job, except the directory a key's "latest" seed points at.
        id: nodecache
        shell: bash
        run: |
          cache=/home/runner/_work/_ci-cache
          if [ -d "$cache/target" ]; then
            # Prune expired run dirs under every key/job, keeping current seeds.
            find "$cache/target" -mindepth 4 -maxdepth 4 -type d -path '*/runs/*' -mtime +0 -print0 2>/dev/null \
              | while IFS= read -r -d '' dir; do
                  base="$(dirname "$(dirname "$dir")")"
                  seed="$(readlink -f "$base/latest" 2>/dev/null || true)"
                  [ "$dir" = "$seed" ] || rm -rf "$dir"
                done
            find "$cache/target" -mindepth 1 -maxdepth 3 -type d -empty -delete 2>/dev/null || true
            key="${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}"
            job="${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}"
            base="$cache/target/$key/$job"
            mkdir -p "$base/runs"
            target="$base/runs/${{ github.run_id }}-${{ github.run_attempt }}"
            rm -rf "$target"
            if [ -d "$base/latest" ] && cp --reflink=always --no-preserve=timestamps -a "$base/latest/." "$target" 2>/dev/null; then
              echo "seeded $target from the last published run (reflink)"
            else
              rm -rf "$target"; mkdir -p "$target"
              echo "no seed available; fresh target dir $target"
            fi
            touch "$target"
            echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
            echo "NODECACHE_BASE=$base" >> "$GITHUB_ENV"
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "no node-local cache directory; using the default target dir"
          fi
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # With the node-local target dir active, uploading/extracting target
          # archives through the GitHub cache is pure write amplification.
          cache-targets: ${{ steps.nodecache.outputs.active != 'true' }}
          shared-key: rust
          save-if: false
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  # Preserve the existing implementation-check name while its independent
  # repository contracts, checker tests, formatting, and Rust compilation run
  # concurrently. This aggregate keeps the required `validate` check bound to
  # every command it covered before the split.
      - name: Publish this run's target dir as the cache seed
        # Seeds come only from pushes and same-repository pull requests, never
        # from forks; a unique temporary link keeps concurrent publishers from
        # racing each other before the atomic rename.
        if: >-
          success() && steps.nodecache.outputs.active == 'true'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          tmp="$NODECACHE_BASE/latest.tmp.${{ github.run_id }}-${{ github.run_attempt }}"
          ln -sfn "$CARGO_TARGET_DIR" "$tmp" && mv -T "$tmp" "$NODECACHE_BASE/latest"
          echo "cache seed -> $CARGO_TARGET_DIR"
  validate-checks:
    if: ${{ always() }}
    needs:
      [rust-change-scope, contract-checks, checker-and-format-tests, rust-checks]
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 1
    steps:
      - name: Confirm every implementation check passed
        env:
          CONTRACT_RESULT: ${{ needs.contract-checks.result }}
          CHECKER_RESULT: ${{ needs.checker-and-format-tests.result }}
          RUST_RESULT: ${{ needs.rust-checks.result }}
          SKIP_RUST: ${{ needs.rust-change-scope.outputs.skip_rust }}
        run: |
          test "$CONTRACT_RESULT" = success
          test "$CHECKER_RESULT" = success
          if [ "$SKIP_RUST" = true ]; then
            test "$RUST_RESULT" = skipped
          else
            test "$RUST_RESULT" = success
          fi

  # The workspace test binaries build and run here rather than at the end of
  # `validate-checks`, so the two compilations overlap instead of queueing. The
  # duplicated dependency build is the accepted cost; separate jobs cannot
  # share a target directory, so this job carries its own rust-cache entry.
  workspace-tests:
    needs: rust-change-scope
    if: needs.rust-change-scope.outputs.skip_rust != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Enable unprivileged user namespaces for Bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Delegate the file-media task controller
        run: |
          sudo mkdir /sys/fs/cgroup/signalbox-file-media-ci
          sudo sh -c 'echo +pids +memory > /sys/fs/cgroup/cgroup.subtree_control'
          sudo mkdir /sys/fs/cgroup/signalbox-file-media-ci/runner
          sudo sh -c 'echo +pids +memory > /sys/fs/cgroup/signalbox-file-media-ci/cgroup.subtree_control'
          sudo chown -R "$USER" /sys/fs/cgroup/signalbox-file-media-ci
      - name: Cache Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # This job's shared cache contains a stale nested target path
          # (`target/tests/target`) that rust-cache traverses after restore and
          # reports as ENOENT. Keep registry/git dependency caching, but build
          # test artifacts in the fresh hosted-runner target directory.
          cache-targets: false
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A prefix restore can retain a native build-script fingerprint after its
      # static archive was omitted from the cache, making Cargo skip the script
      # and then fail at link time. Keep registry downloads but rebuild target
      # artifacts whenever the dependency key is not an exact match.
      - name: Discard target artifacts from a prefix cache restore
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo clean
      - name: Run tests
        env:
          SIGNALBOX_RUN_BWRAP_INTEGRATION: "1"
          SIGNALBOX_FILE_MEDIA_CGROUP_ROOT: /sys/fs/cgroup/signalbox-file-media-ci
        # Process-heavy integration targets can exhaust the hosted runner's
        # file-descriptor limit under libtest's unrestricted CPU-sized pool.
        # Four concurrent tests matches the explicit cap used by the
        # PostgreSQL jobs and retains parallel execution without false EMFILE
        # failures.
        run: |
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          runner_home="$HOME"
          runner_path="$PATH"
          test_command='status=0
            cargo test --no-fail-fast --workspace --all-targets --all-features \
              -- --test-threads=4 || status=$?
            cargo test --no-fail-fast -p signalbox-file-media-processor-runtime \
              --features test-worker --test isolation -- --ignored || status=$?
            exit "$status"'
          sudo --preserve-env=CI,PATH,CARGO_HOME,RUSTUP_HOME,RUSTFLAGS,CARGO_INCREMENTAL,CARGO_PROFILE_DEV_DEBUG,CARGO_PROFILE_TEST_DEBUG,SIGNALBOX_RUN_BWRAP_INTEGRATION,SIGNALBOX_FILE_MEDIA_CGROUP_ROOT \
            sh -c '
              echo $$ > "$SIGNALBOX_FILE_MEDIA_CGROUP_ROOT/runner/cgroup.procs"
              exec setpriv --reuid="$1" --regid="$2" --init-groups \
                env HOME="$3" PATH="$5" sh -c "$4"
            ' sh "$runner_uid" "$runner_gid" "$runner_home" "$test_command" "$runner_path"
      - name: Test generated browser contract runtime
        run: node --test crates/web-contract/tests/generated_roundtrip.mjs
      # `--all-targets` excludes doctests, so the domain's compile_fail
      # sealing proofs need this separate run.
      - name: Run doctests
        run: cargo test --no-fail-fast --workspace --all-features --doc

  # Preserve the existing required-check name while the checks and the
  # workspace tests run as separate jobs. A status check is identified by its
  # job name alone, so splitting the work without this job would leave
  # `validate` naming only half of what it named before.
  validate:
    name: validate
    if: ${{ always() }}
    needs: [rust-change-scope, validate-checks, workspace-tests]
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 1
    steps:
      - name: Confirm the checks and the workspace tests passed
        env:
          CHECKS_RESULT: ${{ needs.validate-checks.result }}
          TESTS_RESULT: ${{ needs.workspace-tests.result }}
          SKIP_RUST: ${{ needs.rust-change-scope.outputs.skip_rust }}
        run: |
          test "$CHECKS_RESULT" = success
          if [ "$SKIP_RUST" = true ]; then
            test "$TESTS_RESULT" = skipped
          else
            test "$TESTS_RESULT" = success
          fi

  # Report-only by owner decision: this job publishes deterministic counts
  # for human comparison but can never fail the workflow or gate a merge.
  domain-instruction-counts:
    name: Domain instruction counts (report only)
    continue-on-error: true
    needs: rust-change-scope
    if: needs.rust-change-scope.outputs.skip_rust != 'true'
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # The pinned Signalbox runner image includes Valgrind, so this public-repo
      # job needs neither root access nor an unpinned package installation.
      - name: Use the node-local cargo target cache
        # Self-hosted runners expose a persistent per-node cache directory
        # through /home/runner/_work/_ci-cache, provisioned by the runner pod
        # template outside this repository. Each run gets its own target dir,
        # cloned copy-on-write (reflink, same XFS filesystem) from the last
        # successful run with the same lockfile/toolchain key, so concurrent
        # runs never share a cargo lock and nothing one run writes leaks into
        # another. GitHub-hosted runners have no such directory and keep the
        # default. Run dirs untouched for a day are pruned at job start.
        id: nodecache
        shell: bash
        run: |
          cache=/home/runner/_work/_ci-cache
          if [ -d "$cache/target" ]; then
            key="${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}"
            job="${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}"
            base="$cache/target/$key/$job"
            mkdir -p "$base/runs"
            find "$base/runs" -mindepth 1 -maxdepth 1 -type d -mtime +0 -exec rm -rf {} + 2>/dev/null || true
            target="$base/runs/${{ github.run_id }}-${{ github.run_attempt }}"
            if [ -d "$base/latest" ] && cp --reflink=always -a "$base/latest/." "$target" 2>/dev/null; then
              echo "seeded $target from the last successful run (reflink)"
            else
              rm -rf "$target"; mkdir -p "$target"
              echo "no seed available; fresh target dir $target"
            fi
            echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
            echo "NODECACHE_BASE=$base" >> "$GITHUB_ENV"
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "no node-local cache directory; using the default target dir"
          fi
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # With the node-local target dir active, uploading/extracting target
          # archives through the GitHub cache is pure write amplification.
          cache-targets: ${{ steps.nodecache.outputs.active != 'true' }}
          shared-key: rust
          save-if: false
      - name: Install Gungraun runner
        run: cargo install --locked --version '=0.19.4' gungraun-runner
      - name: Report domain instruction counts and simulated cache behavior
        run: |
          benchmark_log="$RUNNER_TEMP/domain-instruction-counts.txt"
          set +e
          SIGNALBOX_DOMAIN_INSTRUCTION_BENCHMARK=1 \
            cargo bench --locked -p signalbox-domain --bench instruction_counts \
            2>&1 | tee "$benchmark_log"
          benchmark_status="${PIPESTATUS[0]}"
          set -e
          {
            echo '## Domain instruction counts (report only)'
            echo
            echo 'This report is informational. It has no threshold and gates nothing.'
            echo
            echo '```text'
            cat "$benchmark_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$benchmark_status"

  # Compiles every PostgreSQL integration suite once. Previously each suite
  # compiled itself behind its own rust-cache key, so three large caches
  # competed for the repository's shared cache allowance and evicted one
  # another; an evicted key meant a full cold compile, and three of them could
  # go cold at once. One key here is one cache entry to keep warm, and the
  # shards below inherit the compiled binaries as artifacts instead of
  # rebuilding them.
  #
  # A nextest archive carries the test binaries, the build-script output
  # directories, and the linked search paths, which is everything the run job
  # needs; it deliberately does not carry the source tree, so the run job
  # checks the sources out and passes `--workspace-remap`.
      - name: Publish this run's target dir as the cache seed
        # Seeds come only from pushes and same-repository pull requests, never
        # from forks; a unique temporary link keeps concurrent publishers from
        # racing each other before the atomic rename.
        if: >-
          success() && steps.nodecache.outputs.active == 'true'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          tmp="$NODECACHE_BASE/latest.tmp.${{ github.run_id }}-${{ github.run_attempt }}"
          ln -sfn "$CARGO_TARGET_DIR" "$tmp" && mv -T "$tmp" "$NODECACHE_BASE/latest"
          echo "cache seed -> $CARGO_TARGET_DIR"
  postgres-integration-build:
    name: postgres-integration (build)
    needs: rust-change-scope
    if: needs.rust-change-scope.outputs.skip_rust != 'true'
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox-docker' }}
    # Generous by design: this job now absorbs all six suites' compilation,
    # which a cold cache serializes into one runner instead of spreading it
    # across three.
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.suites.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # First, so a malformed manifest fails before any compilation. The run
      # job expands this into its shard matrix, which is why adding a shard is
      # a one-line manifest edit and touches nothing here.
      - name: Derive the shard matrix from the suite manifest
        id: suites
        run: |
          printf 'matrix=%s\n' \
            "$(python3 scripts/postgres_integration_suites.py --matrix)" \
            >> "$GITHUB_OUTPUT"
      - name: Use the node-local cargo target cache
        # Self-hosted runners expose a persistent per-node cache directory
        # through /home/runner/_work/_ci-cache, provisioned by the runner pod
        # template outside this repository. Each run gets its own target dir,
        # cloned copy-on-write (reflink, same XFS filesystem) from the last
        # successful run with the same lockfile/toolchain key, so concurrent
        # runs never share a cargo lock and nothing one run writes leaks into
        # another. GitHub-hosted runners have no such directory and keep the
        # default. Run dirs untouched for a day are pruned at job start.
        id: nodecache
        shell: bash
        run: |
          cache=/home/runner/_work/_ci-cache
          if [ -d "$cache/target" ]; then
            key="${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}"
            job="${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}"
            base="$cache/target/$key/$job"
            mkdir -p "$base/runs"
            find "$base/runs" -mindepth 1 -maxdepth 1 -type d -mtime +0 -exec rm -rf {} + 2>/dev/null || true
            target="$base/runs/${{ github.run_id }}-${{ github.run_attempt }}"
            if [ -d "$base/latest" ] && cp --reflink=always -a "$base/latest/." "$target" 2>/dev/null; then
              echo "seeded $target from the last successful run (reflink)"
            else
              rm -rf "$target"; mkdir -p "$target"
              echo "no seed available; fresh target dir $target"
            fi
            echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
            echo "NODECACHE_BASE=$base" >> "$GITHUB_ENV"
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "no node-local cache directory; using the default target dir"
          fi
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # With the node-local target dir active, uploading/extracting target
          # archives through the GitHub cache is pure write amplification.
          cache-targets: ${{ steps.nodecache.outputs.active != 'true' }}
          shared-key: rust
          save-if: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-nextest@0.9.143
      # One archive per suite, each built with exactly the package selection
      # and feature set the manifest declares, so no suite links a dependency
      # compiled under features it did not previously see. The runner suite
      # repeats the persistence package archive with the same feature set so a
      # positive binary filter can isolate that target; Cargo reuses the build
      # artifacts. Other suites retain their independent feature resolution.
      #
      # The loop reads the manifest rather than restating it: package and
      # feature selection exist in exactly one place, which is the same place
      # `scripts/check_docs_consistency.py` reads them from.
      - name: Archive every suite
        run: |
          python3 scripts/postgres_integration_suites.py --archive-plan \
            > "$RUNNER_TEMP/suites.tsv"
          while IFS=$'\t' read -r suite package features; do
            echo "::group::archive $suite"
            if [ -n "$features" ]; then
              cargo nextest archive -p "$package" --features "$features" \
                --archive-file "$RUNNER_TEMP/$suite.tar.zst"
            else
              cargo nextest archive -p "$package" \
                --archive-file "$RUNNER_TEMP/$suite.tar.zst"
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/suites.tsv"
      # Uploaded as one artifact per suite so a shard downloads only the
      # archive it runs from. These steps name the suites because an upload
      # action cannot be looped; `check_docs_consistency.py` holds the set of
      # names here equal to the manifest's.
      - name: Upload the persistence archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-integration-archive-persistence
          path: ${{ runner.temp }}/persistence.tar.zst
          if-no-files-found: error
          retention-days: 1
      - name: Upload the program-runtime archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-integration-archive-program-runtime
          path: ${{ runner.temp }}/program-runtime.tar.zst
          if-no-files-found: error
          retention-days: 1
      - name: Upload the signalboxd archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-integration-archive-signalboxd
          path: ${{ runner.temp }}/signalboxd.tar.zst
          if-no-files-found: error
          retention-days: 1
      - name: Upload the runner archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-integration-archive-runner
          path: ${{ runner.temp }}/runner.tar.zst
          if-no-files-found: error
          retention-days: 1
      - name: Upload the terminal-client archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-integration-archive-terminal-client
          path: ${{ runner.temp }}/terminal-client.tar.zst
          if-no-files-found: error
          retention-days: 1
      - name: Upload the approval-judge-eval archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-integration-archive-approval-judge-eval
          path: ${{ runner.temp }}/approval-judge-eval.tar.zst
          if-no-files-found: error
          retention-days: 1

  # The dedicated Docker fleet gives each shard an isolated DinD daemon. The
  # build and run jobs share the same runner image and absolute work-path shape,
  # which keeps paths embedded in nextest archives valid across their pods.
  # Each test starts its own pinned PostgreSQL container through testcontainers,
  # so concurrent test processes never share database state.
  #
  # The matrix is generated from `.github/postgres-integration-suites.toml`:
  # one runner per shard, so a suite declaring one shard costs one runner and
  # still travels the same archive-and-partition path a sharded suite does.
  # Persistence is sharded according to its measured test-execution cost; every
  # other suite runs whole because it fits well inside the job timeout.
  #
  # The run matrix currently expands to eleven shards after the one shared
  # build.
  # The shards compile nothing and run for minutes; the build's single cache
  # key replaces the old per-suite keys that evicted one another.
      - name: Publish this run's target dir as the cache seed
        # Seeds come only from pushes and same-repository pull requests, never
        # from forks; a unique temporary link keeps concurrent publishers from
        # racing each other before the atomic rename.
        if: >-
          success() && steps.nodecache.outputs.active == 'true'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          tmp="$NODECACHE_BASE/latest.tmp.${{ github.run_id }}-${{ github.run_attempt }}"
          ln -sfn "$CARGO_TARGET_DIR" "$tmp" && mv -T "$tmp" "$NODECACHE_BASE/latest"
          echo "cache seed -> $CARGO_TARGET_DIR"
  postgres-integration-run:
    name: >-
      postgres-integration
      (${{ matrix.suite }} ${{ matrix.partition }}/${{ matrix.partitions }})
    needs: postgres-integration-build
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox-docker' }}
    # Keep security-sensitive sockets and filesystem fixtures off the NFS
    # workspace: their permission and atomicity contracts require local /tmp.
    env:
      TMPDIR: /tmp
    # Measured against the shards rather than guessed. With database state in
    # memory and sixteen tests per shard, the recombined shards run about two
    # to nine minutes clean.
    #
    # A shard whose tests actually fail runs about two minutes longer than a
    # clean one, and a job the cap kills is reported as `cancelled`, which
    # reads as an infrastructure problem and hides the test failure underneath
    # it. Fifteen minutes leaves the longest clean shard two-thirds of the cap
    # and still bounds a genuinely hung job.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.postgres-integration-build.outputs.matrix) }}
    steps:
      # The archive holds no sources. Tests that read fixtures relative to
      # their manifest directory need this checkout, which `--workspace-remap`
      # points them at.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-nextest@0.9.143
      - name: Download the ${{ matrix.suite }} archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: postgres-integration-archive-${{ matrix.suite }}
          path: ${{ runner.temp }}/archive
      # Flag for flag against the `cargo test` invocation this replaces:
      # `--run-ignored only` is `-- --ignored`, `--no-fail-fast` is unchanged,
      # and the archive fixes the package and feature selection at build time.
      # nextest runs each test in its own process rather than on a shared
      # thread pool; sixteen concurrent tests is the cap. Each test can consume
      # a 512 MiB PostgreSQL tmpfs, so the cap permits 8 GiB of tmpfs per job
      # before PostgreSQL process memory; re-check the externally provisioned
      # signalbox-docker pod memory limit before raising it. One per-test retry
      # absorbs a transient container-start failure without rerunning a whole
      # shard, while a repeat failure still fails the gate.
      - name: Run the ${{ matrix.suite }} partition
        env:
          SUITE: ${{ matrix.suite }}
          PARTITION: ${{ matrix.partition }}
          PARTITIONS: ${{ matrix.partitions }}
          FILTER: ${{ matrix.filter }}
          # nextest runs each ignored integration test in its own libtest
          # process. Keep deeply composed scheduler fixtures from exhausting
          # the platform's smaller default test-thread stack.
          RUST_MIN_STACK: "8388608"
        run: >-
          cargo nextest run
          --archive-file "$RUNNER_TEMP/archive/$SUITE.tar.zst"
          --workspace-remap .
          --partition "count:$PARTITION/$PARTITIONS"
          --run-ignored only
          --no-fail-fast
          --retries 1
          --test-threads 16
          -E "$FILTER"

  # Preserve the existing required-check name while the suites build once and
  # run as a fail-fast-disabled partition matrix.
  postgres-integration:
    name: postgres-integration
    if: ${{ always() }}
    needs:
      [rust-change-scope, postgres-integration-build, postgres-integration-run]
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 1
    steps:
      - name: Confirm every PostgreSQL integration partition passed
        env:
          BUILD_RESULT: ${{ needs.postgres-integration-build.result }}
          RUN_RESULT: ${{ needs.postgres-integration-run.result }}
          SKIP_RUST: ${{ needs.rust-change-scope.outputs.skip_rust }}
        run: |
          if [ "$SKIP_RUST" = true ]; then
            test "$BUILD_RESULT" = skipped
            test "$RUN_RESULT" = skipped
          else
            test "$BUILD_RESULT" = success
            test "$RUN_RESULT" = success
          fi
