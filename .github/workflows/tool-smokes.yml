name: Tool live smokes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/egress-transport/**"
      - "crates/persistence/**"
      - "crates/tools-basic/**"
      - "crates/tools-code-host/**"
      - "crates/tools-conversations/**"
      - "crates/tools-github/**"
      - "crates/tools-plan/**"
      - "crates/tools-web/**"
      - "crates/tools-workspace/**"
      - "apps/signalboxd/**"
      - "Cargo.lock"
      - ".github/workflows/tool-smokes.yml"
  push:
    branches: [main]

# Superseded runs release their slots against the public concurrency cap:
# pull-request runs group per PR, and other non-main runs group per
# event+ref (today only workflow_dispatch reaches that arm — every push
# trigger in this repo is filtered to main). Main runs each take a group
# of their own and are never canceled: sharing one group would let a third
# run cancel a second still pending behind the first, which
# `cancel-in-progress: false` does not prevent.
concurrency:
  group: >-
    tool-live-smokes-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref)
    || github.ref == 'refs/heads/main' && github.run_id
    || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

# Matches the Rust workflow, whose workspace-tests job writes the shared
# cache: both the cache key and cargo's own artifact fingerprints
# incorporate RUSTFLAGS, so restore-only jobs must build identically
# to reuse it.
env:
  RUSTFLAGS: "-D warnings"

jobs:
  # Report-only home for live tool smokes: fixture drift stays visible but never
  # merge-gates. The whole-daemon exercise extends the existing CI pattern.
  live-smokes:
    name: Tool live smokes (report only)
    continue-on-error: true
    runs-on: signalbox
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: rust
          save-if: false
      - name: Run GitHub read smokes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          cargo test --no-fail-fast -p signalbox-tools-github
          --test live_smoke -- --ignored
      - name: Run whole-daemon tool exercise
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          cargo test --no-fail-fast -p signalboxd
          --test live_tool_exercise -- --ignored

  # Live web search smoke for crates/tools-web. It spends one real Brave query
  # through the production transport, so a provider response-shape change is
  # proven against the live API rather than assumed from the fixture suite.
  #
  # It is a separate job from the smokes above because it is the only one that
  # consumes a deployment credential rather than the ambient Actions token, and
  # a credentialed job earns its own trust boundary, environment binding, and
  # serialization.
  #
  # Accepted trust boundary. The query must execute the proposed repository
  # adapter code against the live provider; that is the purpose of the smoke.
  # The test process that performs it therefore receives the key in its
  # environment and could read it. The job trusts anyone with write access to
  # this repository, the same trust already required to push executable code to
  # main. It does not trust fork authors: GitHub withholds secrets from ordinary
  # fork pull_request runs regardless of environment policy, so a fork run
  # receives an empty value and takes the skip path below rather than spending
  # or exposing anything.
  #
  # The environment scopes WHICH jobs may read the credential; it makes no
  # author-trust decision, and its branch availability setting supplies no
  # security boundary. The exclusion of forks rests on GitHub's secret
  # withholding described above.
  #
  # The credential is referenced only in the final step, never echoed, never
  # passed in argv, and never written to disk. The test binary is compiled in an
  # earlier step whose environment does not hold it, so no build script or
  # procedural macro executes while the key is readable.
  web-smoke:
    name: Web search live smoke (report only)
    # Skipped: every recent invocation has terminated at ProviderRejected
    # before exercising anything, so each run burns a runner slot to prove
    # nothing the last forty runs did not. Delete the `if` line below to
    # re-enable once the provider credential is serviceable again; the
    # triggers above are untouched, so coverage resumes with no further
    # edits.
    if: ${{ false }}
    continue-on-error: true
    permissions:
      contents: read
    # Repository → Settings → Environments → web-smoke holds BRAVE_API_KEY. Its
    # availability setting is documented above and deliberately supplies no
    # additional author-trust decision.
    environment: web-smoke
    # Flat and literal: the simplest form, matching codex-smoke's group. A
    # queued invocation can be evicted by a third concurrent trigger rather
    # than merely delayed (a concurrency group holds at most one running and
    # one pending member, and `cancel-in-progress: false` does not protect
    # the pending slot from replacement), but this job is report-only and
    # non-gating, so a lost queued run costs nothing: the next push or manual
    # dispatch re-triggers it. Single-flight credential serialization comes
    # along incidentally with this shape; it is not the reason for it and is
    # not load-bearing.
    concurrency:
      group: web-smoke
      cancel-in-progress: false
    runs-on: signalbox
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: rust
          save-if: false
      # Compile before the credential exists in any step environment, and
      # capture the resulting binary path: the credentialed step below
      # executes that binary directly rather than invoking Cargo a second
      # time, so no further build-freshness check (and therefore no build
      # script or procedural macro) ever runs while the key is readable, even
      # if this crate someday tracks BRAVE_API_KEY through `option_env!` or a
      # build script's `rerun-if-env-changed`.
      - name: Build the smoke test binary
        id: build
        run: |
          set -euo pipefail
          executable=$(cargo test --no-fail-fast -p signalbox-tools-web --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' \
            | tail -n1)
          test -n "${executable}" || { echo "::error::no test executable produced"; exit 1; }
          echo "executable=${executable}" >> "${GITHUB_OUTPUT}"
      # Gated inside the test rather than on this step: an absent environment
      # secret expands to an empty value, which the smoke reports and skips on.
      # That keeps one skip path covering CI before the secret exists, fork runs
      # that never receive it, and local runs with no credential file.
      #
      # A substring filter that matches zero tests (a rename, a move, or a
      # dropped `#[ignore]`) would otherwise let libtest exit 0 having spent no
      # request; counting the passed tests, as the Codex smoke does, turns that
      # silent no-op into a failure.
      - name: Run web search smoke
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/web-smoke-result"
          "${{ steps.build.outputs.executable }}" \
            --ignored --nocapture web_search::live_smoke_tests \
            2>&1 | tee "${result}"
          passed_count=$(sed -n \
            's/^test result: ok\. \([0-9][0-9]*\) passed;.*/\1/p' \
            "${result}")
          if [[ "${passed_count}" != "1" ]]; then
            echo "::error::Expected exactly one web search smoke test to execute; libtest reported '${passed_count:-no passed count}'."
            exit 1
          fi
