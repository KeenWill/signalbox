name: Swift

on:
  pull_request:
    paths:
      - "apps/signalboxd/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "clients/native/**"
      - ".github/workflows/swift.yml"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "apps/signalboxd/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "clients/native/**"
      - ".github/workflows/swift.yml"
      - "rust-toolchain.toml"

# Superseded runs release their slots against the public concurrency cap:
# pull-request runs group per PR, and other non-main runs group per
# event+ref (today only workflow_dispatch reaches that arm — every push
# trigger in this repo is filtered to main). Main runs each take a group
# of their own and are never canceled: sharing one group would let a third
# run cancel a second still pending behind the first, which
# `cancel-in-progress: false` does not prevent.
concurrency:
  group: >-
    swift-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref)
    || github.ref == 'refs/heads/main' && github.run_id
    || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  swift-change-scope:
    name: Swift native change scope
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          native=false
          while IFS= read -r path; do
            case "$path" in
              clients/native/* | .github/workflows/swift.yml)
                native=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "native=$native" >> "$GITHUB_OUTPUT"

  # Not `validate`: rust.yml already publishes a job by that name, and a status
  # check is identified by its job name alone, so two `validate` jobs would be
  # one ambiguous check that branch protection cannot require independently.
  swift-validate:
    needs: swift-change-scope
    if: needs.swift-change-scope.outputs.native == 'true'
    # macos-latest is the macOS 26 arm64 image. The project was created with
    # Xcode 26.4.1 and targets iOS 26.4, so it needs an Xcode 26.4+ toolchain
    # with a matching simulator runtime; the image ships Xcode 26.6 with the
    # iOS 26.5 runtime, and the pin below keeps CI on the same Xcode build
    # (26.6 / 17F113) the tree was last validated with locally instead of
    # following the image's rolling default.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      # Cheap and first: the coverage summarizer's regression tests run in
      # seconds, ahead of the build and simulator pass whose report they
      # render. This job is gated on `clients/native/**` having changed, which
      # is exactly when the summarizer can regress.
      - name: Test the coverage summarizer
        run: python3 clients/native/scripts/test_summarize_coverage.py
      - name: Build (iOS Simulator, Debug)
        run: clients/native/scripts/build-xcode.sh
      # Runs the canonical test script with two suites excluded. The UI-test
      # bundle drives an interactive simulator session, so it stays a
      # manual/local flow via clients/native/scripts for now; the in-process
      # snapshot suite is skipped for the reason on its entry below. The four
      # unit-test bundles still run against a booted simulator the script
      # resolves itself.
      #
      # Coverage rides along on this run rather than taking a macOS job of its
      # own: instrumenting the suite that already runs costs a fraction of what
      # a second simulator pass would, and a measurement is not worth a second
      # pass.
      - name: Run native unit-test bundles
        run: clients/native/scripts/test-xcode.sh
        env:
          # The snapshot suite is excluded here and runs in the report-only step
          # below instead; this step is the blocking one, and a golden is not
          # yet trusted enough to hold a merge.
          SIGNALBOX_NATIVE_SKIP_TESTING: >-
            SignalboxNativeUITests
            SignalboxAppTests/LiveScreenSnapshotTests
          # Quoted deliberately: the script tests for the exact string, and an
          # unquoted YES is a YAML boolean that a parser may hand the step as
          # "true" instead, silently turning the measurement off.
          SIGNALBOX_NATIVE_ENABLE_CODE_COVERAGE: "YES"
      # Codecov reads neither the xccov JSON nor the xccov text report the
      # report step below writes, so the profile data behind both is exported
      # once more in a format it does read. One instrumented run, a third
      # rendering of it: no second build and no second simulator pass.
      #
      # Here rather than beside that report step, and deliberately. The
      # snapshot pass below reuses this derived data and overwrites
      # `Build/ProfileData` with a profile of its own. Exported after it, this
      # file would describe the snapshot suite while the report beside it
      # described the unit suites, and the two would disagree with nothing on
      # either to say why.
      #
      # The app target alone, deliberately. `Sources/SignalboxApp`,
      # `SignalboxClient`, and `SignalboxModels` all compile into it, and the
      # four test bundles are separate binaries this does not measure. That
      # keeps test code out of the numerator and the denominator alike,
      # matching what cargo-llvm-cov excludes by default on the Rust side, and
      # it is why the percentage Codecov shows sits below the xccov report's:
      # that one counts the test bundles and SnapshotTesting too.
      #
      # The derived-data path is the default the scripts under
      # clients/native/scripts compute; this job sets no override, so naming
      # it here reads the same location test-xcode.sh just wrote.
      - name: Export the native coverage as LCOV
        id: native_lcov
        if: ${{ always() }}
        continue-on-error: true
        env:
          COVERAGE_OUTPUT_DIR: ${{ runner.temp }}/native-coverage
        run: |
          derived_data=clients/native/.derivedData
          profdata="$(find "$derived_data/Build/ProfileData" \
            -name Coverage.profdata -print -quit 2>/dev/null || true)"
          app_dir="$(find "$derived_data/Build/Products" -type d \
            -name SignalboxNative.app -print -quit 2>/dev/null || true)"
          # Named rather than left to llvm-cov: an empty path here means the
          # derived-data layout moved, which is worth saying plainly.
          test -n "$profdata" || {
            echo "no Coverage.profdata under $derived_data" >&2
            exit 1
          }
          test -n "$app_dir" || {
            echo "no SignalboxNative.app under $derived_data" >&2
            exit 1
          }
          # Which file inside the bundle holds the code is not a constant. A
          # Debug build leaves the app's own code in a `.debug.dylib` beside a
          # launcher stub that carries no coverage mapping at all, and passing
          # that stub is a hard error rather than an empty result. Selecting
          # on the mapping section instead of on a name is right under either
          # layout, and llvm-cov takes the first binary positionally.
          objects=()
          for candidate in "$app_dir/SignalboxNative.debug.dylib" \
            "$app_dir/SignalboxNative"; do
            if [ -f "$candidate" ] &&
              otool -l "$candidate" 2>/dev/null | grep -q __llvm_covmap; then
              if [ "${#objects[@]}" -eq 0 ]; then
                objects+=("$candidate")
              else
                objects+=(-object "$candidate")
              fi
            fi
          done
          test "${#objects[@]}" -gt 0 || {
            echo "no instrumented binary in $app_dir" >&2
            exit 1
          }
          mkdir -p "$COVERAGE_OUTPUT_DIR"
          lcov="$COVERAGE_OUTPUT_DIR/lcov.info"
          xcrun llvm-cov export -format=lcov \
            -instr-profile "$profdata" "${objects[@]}" > "$lcov"
          # llvm-cov records the absolute paths the compiler saw. Codecov
          # matches report paths against the repository tree and does resolve
          # that shape on its own — the Rust upload lands 285 such paths
          # correctly — but rewriting them here is one substitution against a
          # prefix this job already knows, where a `fixes:` rule in codecov.yml
          # would restate that prefix somewhere nothing checks it.
          sed -i '' "s|^SF:$GITHUB_WORKSPACE/|SF:|" "$lcov"
          # An empty report is worse than none: uploaded, it would read as a
          # native client with no covered lines rather than as a measurement
          # that did not happen, and the flag carries that forward. The upload
          # step below is gated on this output for exactly that reason.
          test -s "$lcov" || {
            echo "llvm-cov exported an empty report" >&2
            exit 1
          }
          printf 'exported %s source files, %s left absolute\n' \
            "$(grep -c '^SF:' "$lcov")" \
            "$(grep -c '^SF:/' "$lcov" || true)"
          echo "exported=true" >> "$GITHUB_OUTPUT"
      # Report only, exactly as native coverage was rolled out: it never fails
      # the job. Promoting the suite to a merge gate is deleting the
      # `continue-on-error` line, the skip above, and the `if` guard below
      # that currently disables the pass entirely.
      #
      # A second test pass, not a second job or a second build: the derived data
      # already holds the build this step reuses, which is also why it sets
      # code coverage the same way the step above does. Instrumentation changes
      # the built products, so a step that disagreed about it would rebuild
      # everything to run the goldens. Its result bundle is separate so it cannot
      # overwrite the one the coverage report reads.
      - name: Run native snapshot suite (report only)
        id: snapshots
        # Skipped while Swift client work is shelved: this second test pass
        # exists only to check goldens nobody is updating right now. The
        # goldens stay in-repo; delete the `if` line below to re-enable when
        # Swift work resumes.
        if: ${{ false }}
        continue-on-error: true
        # Not test-xcode.sh with a suite named here: test-snapshots.sh takes
        # both the suite and the simulator from scripts/lib/snapshots.sh, which
        # is the same owner the recording script reads, so a golden is never
        # checked against a model it was not recorded against.
        run: clients/native/scripts/test-snapshots.sh
        env:
          SIGNALBOX_NATIVE_ENABLE_CODE_COVERAGE: "YES"
          SIGNALBOX_NATIVE_TEST_RESULT_BUNDLE_PATH: ${{ runner.temp }}/native-snapshots/SignalboxNative-Snapshots.xcresult
      # The library attaches the reference, the failed rendering, and their
      # difference to the failing test, so the result bundle is where a diff
      # lives. Exported unfiltered rather than with `--only-failures`: the three
      # images hang off an activity rather than off the failure itself, and that
      # filter drops them, leaving an artifact of nothing but issue text. A run
      # that took no failing snapshot has no attachments to export anyway.
      # manifest.json maps each exported file to its name.
      - name: Export the native snapshot diffs
        if: ${{ always() && steps.snapshots.outcome == 'failure' }}
        continue-on-error: true
        run: |
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/native-snapshots/SignalboxNative-Snapshots.xcresult" \
            --output-path "$RUNNER_TEMP/native-snapshot-diffs"
      - name: Upload the native snapshot diffs
        if: ${{ always() && steps.snapshots.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-snapshot-diffs
          path: ${{ runner.temp }}/native-snapshot-diffs
          if-no-files-found: warn
          retention-days: 14
      # Report only, and structurally incapable of gating: it never fails the
      # job, and it runs even when the tests failed, because a partial
      # measurement still names untested code. No step compares the reported
      # percentage against anything.
      - name: Report native coverage (report only)
        if: ${{ always() }}
        continue-on-error: true
        env:
          SIGNALBOX_NATIVE_COVERAGE_OUTPUT_DIR: ${{ runner.temp }}/native-coverage
        run: clients/native/scripts/report-coverage.sh >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the native coverage report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-coverage
          path: ${{ runner.temp }}/native-coverage
          if-no-files-found: warn
          retention-days: 14
      # The LCOV exported above, sent on to Codecov under a flag of its own.
      # `swift` and coverage.yml's `rust` stay separate components there: the
      # two are measured by different toolchains over disjoint trees, and one
      # merged percentage across both would be a number describing nothing.
      #
      # Report-only by two independent mechanisms, as on the Rust side: this
      # step continues on error, and codecov.yml marks every status
      # `informational: true`, so neither a failed upload nor anything Codecov
      # concludes from a good one can fail this job or gate a merge.
      #
      # Gated on the export having produced something, not merely on having
      # run: a step that continues on error reports success either way, and an
      # empty report uploaded under this flag would read as a native client
      # with no covered lines.
      #
      # Pinned to a commit like every other third-party action here. The tag it
      # resolves to is codecov-action v5.5.5.
      - name: Upload coverage reports to Codecov
        if: ${{ always() && steps.native_lcov.outputs.exported == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/native-coverage/lcov.info
          flags: swift
          # The one file above is the whole upload. `noop` matters more here
          # than on the Rust side: the action's Xcode plugin runs by default,
          # rediscovers profile data under Xcode's own derived-data directory,
          # and renders it with `llvm-cov show` into competing reports. This
          # job already knows which profile it means, and said so above.
          disable_search: true
          plugins: noop
          # A report-only job does not fail on a failed upload to a third
          # party. `continue-on-error` above would contain it anyway; this
          # keeps the step's own outcome honest rather than relying on that.
          fail_ci_if_error: false
      - name: Check privacy boundary
        run: clients/native/scripts/check-privacy.sh

  # Builds Rust separately from the simulator suite so Swift-only feedback does
  # not wait behind the daemon build. The name is unique across workflows for
  # the same branch-protection reason documented on swift-validate above.
  swift-real-daemon:
    name: Swift real-daemon integration
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Install PostgreSQL 18
        run: |
          brew install postgresql@18
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run native client against signalboxd
        run: clients/native/scripts/test-real-server-xcode.sh
