name: Swift

on:
  pull_request:
    paths:
      - "apps/signalboxd/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "clients/native/**"
      - ".github/workflows/swift.yml"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "apps/signalboxd/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "clients/native/**"
      - ".github/workflows/swift.yml"
      - "rust-toolchain.toml"

# Superseded pull-request runs release their slots against the public
# concurrency cap. Every other event takes a group of its own: sharing one
# group would let a third run cancel a second still pending behind the first,
# which `cancel-in-progress: false` does not prevent.
concurrency:
  group: >-
    swift-${{ github.event_name == 'pull_request'
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  swift-change-scope:
    name: Swift native change scope
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          native=false
          while IFS= read -r path; do
            case "$path" in
              clients/native/* | .github/workflows/swift.yml)
                native=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "native=$native" >> "$GITHUB_OUTPUT"

  # Not `validate`: rust.yml already publishes a job by that name, and a status
  # check is identified by its job name alone, so two `validate` jobs would be
  # one ambiguous check that branch protection cannot require independently.
  swift-validate:
    needs: swift-change-scope
    if: needs.swift-change-scope.outputs.native == 'true'
    # macos-latest is the macOS 26 arm64 image. The project was created with
    # Xcode 26.4.1 and targets iOS 26.4, so it needs an Xcode 26.4+ toolchain
    # with a matching simulator runtime; the image ships Xcode 26.6 with the
    # iOS 26.5 runtime, and the pin below keeps CI on the same Xcode build
    # (26.6 / 17F113) the tree was last validated with locally instead of
    # following the image's rolling default.
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      # `actions: read` is what the baseline fetch below needs to list this
      # workflow's own past runs on main and download one artifact from them.
      # It is a read scope over this repository's Actions data and grants no
      # write anywhere, which is why the fetch can live in the job that also
      # builds and runs the simulator suite rather than needing a job of its
      # own; the write token still lives only in
      # publish-native-coverage-comment.
      #
      # `contents: read` is restated because a job-level permissions block sets
      # every scope it omits to none, and the checkout below needs it.
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      # Cheap and first: the coverage summarizer's regression tests run in
      # seconds, ahead of the build and simulator pass whose report they
      # render. This job is gated on `clients/native/**` having changed, which
      # is exactly when the summarizer can regress.
      - name: Test the coverage summarizer
        run: python3 clients/native/scripts/test_summarize_coverage.py
      - name: Build (iOS Simulator, Debug)
        run: clients/native/scripts/build-xcode.sh
      # Runs the canonical test script with the UI-test bundle excluded. The
      # UI and screenshot-capture suites need an interactive simulator
      # session (and the Tart VM shards for the full device matrix), so they
      # stay a manual/local flow via clients/native/scripts for now; the
      # four unit-test bundles still run against a booted simulator the script
      # resolves itself.
      #
      # Coverage rides along on this run rather than taking a macOS job of its
      # own: instrumenting the suite that already runs costs a fraction of what
      # a second simulator pass would, and a measurement is not worth a second
      # pass.
      - name: Run native unit-test bundles
        # Identified so the reporting step below can tell whether the
        # measurement it is about to render is complete. That step runs under
        # `always()` on purpose, so without this it cannot distinguish "these
        # lines are untested" from "these tests never ran".
        id: native-tests
        run: clients/native/scripts/test-xcode.sh
        env:
          # The snapshot suite is excluded here and runs in the report-only step
          # below instead; this step is the blocking one, and a golden is not
          # yet trusted enough to hold a merge.
          SIGNALBOX_NATIVE_SKIP_TESTING: >-
            SignalboxNativeUITests
            SignalboxAppTests/LiveScreenSnapshotTests
          # Quoted deliberately: the script tests for the exact string, and an
          # unquoted YES is a YAML boolean that a parser may hand the step as
          # "true" instead, silently turning the measurement off.
          SIGNALBOX_NATIVE_ENABLE_CODE_COVERAGE: "YES"
      # Report only, exactly as native coverage was rolled out: it never fails
      # the job. Promoting the suite to a merge gate is deleting the
      # `continue-on-error` line and the skip above.
      #
      # A second test pass, not a second job or a second build: the derived data
      # already holds the build this step reuses, which is also why it sets
      # code coverage the same way the step above does. Instrumentation changes
      # the built products, so a step that disagreed about it would rebuild
      # everything to run the goldens. Its result bundle is separate so it cannot
      # overwrite the one the coverage report reads.
      - name: Run native snapshot suite (report only)
        id: snapshots
        continue-on-error: true
        # Not test-xcode.sh with a suite named here: test-snapshots.sh takes
        # both the suite and the simulator from scripts/lib/snapshots.sh, which
        # is the same owner the recording script reads, so a golden is never
        # checked against a model it was not recorded against.
        run: clients/native/scripts/test-snapshots.sh
        env:
          SIGNALBOX_NATIVE_ENABLE_CODE_COVERAGE: "YES"
          SIGNALBOX_NATIVE_TEST_RESULT_BUNDLE_PATH: ${{ runner.temp }}/native-snapshots/SignalboxNative-Snapshots.xcresult
      # The library attaches the reference, the failed rendering, and their
      # difference to the failing test, so the result bundle is where a diff
      # lives. Exported unfiltered rather than with `--only-failures`: the three
      # images hang off an activity rather than off the failure itself, and that
      # filter drops them, leaving an artifact of nothing but issue text. A run
      # that took no failing snapshot has no attachments to export anyway.
      # manifest.json maps each exported file to its name.
      - name: Export the native snapshot diffs
        if: ${{ always() && steps.snapshots.outcome == 'failure' }}
        continue-on-error: true
        run: |
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/native-snapshots/SignalboxNative-Snapshots.xcresult" \
            --output-path "$RUNNER_TEMP/native-snapshot-diffs"
      - name: Upload the native snapshot diffs
        if: ${{ always() && steps.snapshots.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-snapshot-diffs
          path: ${{ runner.temp }}/native-snapshot-diffs
          if-no-files-found: warn
          retention-days: 14
      # Fetches the number this pull request's number is reported against, from
      # a `native-coverage` artifact an earlier main run left behind. Deliberately
      # a copy of coverage.yml's step of the same name rather than a shared
      # script: the two workflows already keep parallel copies of the
      # comment-posting logic below, a script under `tooling/` would not be in
      # either workflow's path filter, and this file's own scope gate would
      # never validate a change to it.
      #
      # The one difference from coverage.yml is the candidate limit. A main push
      # measures native coverage only when it touched `clients/native/**`, so
      # most successful main runs of this workflow skipped swift-validate
      # entirely and carry no artifact; the scan looks further back before
      # giving up, and the report states the baseline's date so a reader can see
      # how far back it had to go.
      #
      # Report-only in the strictest sense available. `set +e` undoes the `-e`
      # the default shell adds, and every path out of the script below writes an
      # `available=` output and exits zero, so an absent, expired, or unreadable
      # baseline degrades the comment to the absolute numbers it already showed
      # and can neither fail this step nor change what the job reports.
      # `continue-on-error` is belt to that braces, covering a runner-level
      # failure the script cannot catch.
      #
      # Pull requests only. A main push is the tree that becomes the next
      # baseline, and comparing it against its predecessor would spend API calls
      # on a job summary nobody reads for a delta.
      #
      # `gh`, `jq`, and `unzip` are all preinstalled on the macOS runner image,
      # so nothing here installs a tool onto a runner whose minutes are the
      # expensive ones.
      #
      # The token is set on this step alone, so the simulator suite above ran in
      # an environment holding no credential. That is a scoping statement, not
      # an isolation boundary, and it is worth being exact about which: the
      # suite executes pull-request-controlled code on this runner, so code that
      # ran earlier can reach a later step's `gh` whatever this step's `env`
      # says. The accepted exposure is a read-only `github.token` on a public
      # repository, carrying `actions: read` and `contents: read` and no write
      # scope anywhere — everything it can reach is already readable by any
      # authenticated account. Isolating the fetch in a job that checks out
      # nothing would buy nothing against that, and would cost a second macOS
      # runner and an artifact round-trip on a report that gates nothing. Grant
      # this step no scope whose loss would matter.
      - name: Fetch the main-branch native coverage baseline
        id: baseline
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # The base commit this pull request is open against — the same tree
          # the merge measured above was built on. See the selection below for
          # why this, and not the branch's merge-base, is the attributable one.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Must name this file. The runs endpoint is per-workflow, and a
          # baseline from another workflow's artifact would be a different
          # measurement wearing this one's label.
          WORKFLOW_FILE: swift.yml
          ARTIFACT_NAME: native-coverage
          SUMMARY_FILE: coverage.json
          # Named once. A candidate baseline is only usable if this step
          # concluded `success` in the run that produced it, so this string
          # has to stay identical to the step's `name:` above; a rename that
          # missed one would silently reject every candidate.
          TEST_STEP_NAME: Run native unit-test bundles
          CANDIDATE_LIMIT: 30
        run: |
          # A failing command here must fall through to a stated reason rather
          # than end the step: the reason is the product when the baseline is
          # not.
          set +e

          # A directory of its own, never the report directory the upload step
          # below publishes: a baseline extracted in there would be republished
          # inside the next run's baseline.
          baseline_dir="$RUNNER_TEMP/native-coverage-baseline"
          mkdir -p "$baseline_dir"

          unavailable() {
            {
              echo 'available=false'
              echo "reason=$1"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          available() {
            {
              echo 'available=true'
              echo "label=$1"
              echo "sha=$2"
              echo "date=$3"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Pushes to main only: a pull-request run measured a synthetic merge
          # commit that never landed.
          #
          # Completed, not successful. What disqualifies a baseline is an
          # incomplete *measurement*, and the run's conclusion does not report
          # that: this job continues past the coverage report into the privacy,
          # Tart, and screenshot checks below, so a run whose tests all passed
          # and whose artifact is complete still ends red when one of those
          # fails. Filtering on `success` discarded those measurements and
          # reported an older baseline as the most recent one measured, which
          # is a false statement rather than a conservative one. The narrower
          # question — did the bundles actually run — is asked per candidate
          # below, against the test step's own conclusion.
          if ! runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?branch=main&event=push&status=completed&per_page=100")"; then
            unavailable "the list of \`main\` runs of this workflow could not be read"
          fi

          # The run that measured this pull request's own base first when there
          # is one, then the most recent runs, each tagged with which of the
          # two it is. The label travels with the number from here to the
          # rendered sentence.
          #
          # The base, not the branch's merge-base. A `pull_request` checkout is
          # `refs/pull/N/merge` — this branch merged into the base it is open
          # against — so the tree measured above already contains everything on
          # `main` up to that base. Subtracting a merge-base measurement would
          # subtract the fork point instead, leaving every commit that landed on
          # `main` in between inside a delta the report calls this branch's own
          # doing. Against the base those cancel, and the claim is true. When
          # the branch is current with `main` the two commits coincide, which is
          # why the older selection looked right whenever anyone checked it.
          candidates="$(printf '%s' "$runs" | jq -r \
            --arg sha "$BASE_SHA" --argjson cap "$CANDIDATE_LIMIT" '
              ([.workflow_runs[] | select(.head_sha == $sha)] | first) as $exact
              | [ $exact | select(. != null) | {label: "base", run: .} ]
                + ([.workflow_runs[]
                    | select($exact == null or .id != $exact.id)
                    | {label: "latest-main", run: .}][0:$cap])
              | .[]
              | [.label, (.run.id | tostring), .run.head_sha, .run.created_at]
              | @tsv')"

          # The first candidate's reason is the one reported: it is the run a
          # reader would have expected to be the baseline, so why it was not is
          # the answer they want.
          reason=''
          while IFS=$'\t' read -r label run_id run_sha run_date; do
            # An empty candidate list still feeds this loop one blank line.
            [ -n "$run_id" ] || continue

            artifact="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              | jq -r --arg name "$ARTIFACT_NAME" '
                  [.artifacts[] | select(.name == $name)] | first
                  | if . == null then ""
                    else "\(.id)\t\(.expired)\t\(.created_at)" end')"
            if [ -z "$artifact" ]; then
              [ -n "$reason" ] || reason="run $run_id measured no native coverage"
              continue
            fi
            # The artifact's own creation time, not the run's. A run that is
            # re-run days later keeps its original `created_at` while the
            # artifact comes from the later attempt, and the date is the
            # report's staleness signal — the one number a reader uses to
            # judge how much the baseline is worth.
            IFS=$'\t' read -r artifact_id expired artifact_date <<<"$artifact"
            if [ "$expired" = 'true' ]; then
              [ -n "$reason" ] || reason="the artifact from run $run_id has expired"
              continue
            fi

            # Did the bundles actually run? The reporting step runs under
            # `always()`, so a run whose tests failed still uploads an artifact
            # — a structurally valid one measuring less of the workspace. No
            # shape check can tell that apart from genuinely uncovered code,
            # so the test step's own conclusion is what decides it. Asked
            # after the artifact lookup and before the download, so a
            # candidate is rejected on the cheap call rather than the
            # expensive one.
            if ! step_ok="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              | jq -r --arg step "$TEST_STEP_NAME" '
                  [.jobs[]?.steps[]? | select(.name == $step)] as $steps
                  | if ($steps | length) == 0 then "missing"
                    elif all($steps[]; .conclusion == "success") then "yes"
                    else "no"
                    end')"; then
              [ -n "$reason" ] || reason="the jobs of run $run_id could not be read"
              continue
            fi
            if [ "$step_ok" != 'yes' ]; then
              [ -n "$reason" ] || reason="run $run_id did not finish its native tests, so its measurement is partial"
              continue
            fi

            if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$baseline_dir/artifact.zip"; then
              [ -n "$reason" ] || reason="the artifact from run $run_id could not be downloaded"
              continue
            fi
            # Only the machine-readable report is extracted; the rendered
            # Markdown beside it in the same artifact is the previous run's
            # comment, which nothing here reads. The previous candidate's file
            # is removed first: `unzip` leaves the old one in place when this
            # artifact has no member to overwrite it, and the check below would
            # then read one run's report under another run's provenance.
            rm -f "$baseline_dir/$SUMMARY_FILE"
            unzip -o -q "$baseline_dir/artifact.zip" "$SUMMARY_FILE" -d "$baseline_dir" || true
            rm -f "$baseline_dir/artifact.zip"
            if [ ! -s "$baseline_dir/$SUMMARY_FILE" ]; then
              [ -n "$reason" ] || reason="the artifact from run $run_id holds no \`$SUMMARY_FILE\`"
              continue
            fi
            # A present-but-unusable report must not end the scan. A report
            # command that died partway leaves truncated output behind and the
            # always-running upload step publishes it, so the newest candidate
            # is exactly the one likely to carry it — and ending here would
            # report "unreadable" while an older run holds a perfectly good
            # artifact. This is a pre-filter on the contract the summarizer's
            # loader enforces, not a second implementation of the reason
            # strings: the summarizer stays the authority on what a reader is
            # told, including for a baseline that validates here and still
            # fails to load at render time.
            # Every field the loader consumes is checked, not just the
            # executable-line total: `product_totals` reads both
            # `coveredLines` and `executableLines` off each product target and
            # raises `KeyError` on a missing one, so a target carrying only
            # `executableLines` passes an executable-only predicate and still
            # fails to load. Both are required to be values `int()` accepts — a
            # number, or a string of digits — matching the loader in both
            # directions: a numeric string is accepted because `int()` accepts
            # it, and "5.5" is not, because `int()` rejects it. A predicate
            # stricter than its loader would discard a usable baseline for an
            # older one, which is the same defect in the other direction.
            #
            # The total is summed the way `product_totals` sums it: `int()`
            # truncates each target's value toward zero before the addition, so
            # a plain sum can be positive where the loader's total is zero.
            if ! jq -e '
                  def okint: (type == "number")
                    or (type == "string" and test("^[+-]?[0-9]+$"));
                  def trunc: if . < 0 then -((-.) | floor) else floor end;
                  ((.targets | type) == "array")
                  and ([.targets[]
                    | select(((.name // "") | endswith(".xctest")) | not)
                  ] as $products
                  | ($products | length) > 0
                  and all($products[];
                        (.coveredLines | okint) and (.executableLines | okint))
                  and (([$products[].executableLines | tonumber | trunc]
                        | add) // 0) > 0)
                ' "$baseline_dir/$SUMMARY_FILE" > /dev/null 2>&1; then
              [ -n "$reason" ] || reason="the \`$SUMMARY_FILE\` from run $run_id is not a readable coverage report"
              rm -f "$baseline_dir/$SUMMARY_FILE"
              continue
            fi

            available "$label" "$run_sha" "$artifact_date"
          done <<<"$candidates"

          if [ -z "$reason" ]; then
            unavailable "no completed \`main\` run of this workflow was found"
          fi
          unavailable "$reason (up to the $CANDIDATE_LIMIT most recent completed \`main\` runs were examined)"
      # Report only, and structurally incapable of gating: it never fails the
      # job, and it runs even when the tests failed, because a partial
      # measurement still names untested code. No step compares the reported
      # percentage against anything.
      #
      # Also builds comment.md alongside the job-summary report, from the
      # same report.md report-coverage.sh already wrote into the output
      # directory. This mirrors coverage.yml's "Report the numbers" step: the
      # marker up front is what the publish-native-coverage-comment job below
      # searches for to find and rewrite its own comment on every push, and
      # it is deliberately `signalbox-native-coverage` rather than
      # coverage.yml's `signalbox-rust-coverage`, so the two workflows' sticky
      # comments never collide on the same pull request.
      - name: Report native coverage (report only)
        if: ${{ always() }}
        continue-on-error: true
        env:
          SIGNALBOX_NATIVE_COVERAGE_OUTPUT_DIR: ${{ runner.temp }}/native-coverage
          # `github.sha` is the commit this job actually checked out. On a
          # pull_request event that is the synthetic merge of the head into
          # the base, matching what coverage.yml reports beside its own head
          # SHA for the same reason: the merge commit is what was measured,
          # and the head is what a reader recognises.
          MEASURED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # All empty on a push to main, where the step above does not run:
          # that report is rendered exactly as it was before there were deltas,
          # which is also what makes it a clean baseline for the next one.
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.available }}
          BASELINE_REASON: ${{ steps.baseline.outputs.reason }}
          BASELINE_LABEL: ${{ steps.baseline.outputs.label }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          BASELINE_DATE: ${{ steps.baseline.outputs.date }}
          BASELINE_SUMMARY: ${{ runner.temp }}/native-coverage-baseline/coverage.json
          # Anything but `success` means the bundles did not all run, so the
          # measurement below is partial and its delta is the missing tests
          # rather than a code change.
          NATIVE_TESTS_OUTCOME: ${{ steps.native-tests.outcome }}
        run: |
          # Built in one place so a delta can never be rendered without the
          # label saying which baseline produced it; the summarizer refuses the
          # pair split apart. The positional parameters carry them because an
          # empty array is not portable to expand, and this must expand to
          # nothing at all on a push to main. report-coverage.sh forwards them
          # verbatim to the summarizer and reads none of them itself.
          if [ "$BASELINE_AVAILABLE" = 'true' ]; then
            set -- --baseline "$BASELINE_SUMMARY" \
              --baseline-label "$BASELINE_LABEL" \
              --baseline-sha "$BASELINE_SHA" \
              --baseline-date "$BASELINE_DATE"
          elif [ -n "$BASELINE_REASON" ]; then
            set -- --baseline-unavailable "$BASELINE_REASON"
          else
            set --
          fi

          # Only meaningful alongside a baseline — with no delta there is
          # nothing to misattribute — but passed unconditionally so the flag
          # never depends on which branch above ran.
          if [ -n "$NATIVE_TESTS_OUTCOME" ] && [ "$NATIVE_TESTS_OUTCOME" != 'success' ]; then
            set -- "$@" --measurement-incomplete
          fi

          clients/native/scripts/report-coverage.sh "$@" >> "$GITHUB_STEP_SUMMARY"

          report_dir="$SIGNALBOX_NATIVE_COVERAGE_OUTPUT_DIR"
          {
            printf '%s\n\n' '<!-- signalbox-native-coverage -->'
            cat "$report_dir/report.md"
            printf '\nMeasured at `%s`' "$MEASURED_SHA"
            if [ -n "$HEAD_SHA" ]; then
              printf ', the merge commit this pull request builds, whose head is `%s`' \
                "$HEAD_SHA"
            fi
            printf ', by [run %s](%s/%s/actions/runs/%s), which uploads the xccov JSON, text, and Markdown reports as an artifact.\n' \
              "$GITHUB_RUN_ID" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$report_dir/comment.md"
      - name: Upload the native coverage report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-coverage
          path: ${{ runner.temp }}/native-coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Check privacy boundary
        run: clients/native/scripts/check-privacy.sh
      - name: Check Tart scripts (dry run)
        run: clients/native/scripts/tart/check-tart-scripts.sh
      # Pure sha256 hashing against Screenshots/MANIFEST.sha256 — no
      # simulator involved, so it is cheap enough to run here even though
      # recapturing goldens is a manual flow.
      - name: Check screenshot goldens
        run: clients/native/scripts/check-screenshot-goldens.sh

  # Holds the only write token in this workflow and never builds or runs
  # anything, mirroring the token separation coverage.yml's publish-comment
  # job already uses: the simulator run above cannot reach a token that can
  # write to a pull request.
  #
  # A pull request from a fork is skipped rather than attempted. GitHub issues
  # such a run a read-only token no matter what `permissions` requests, so the
  # comment would fail; the job summary and the uploaded report are unaffected
  # and remain the whole report for a fork contributor.
  #
  # Gated on the same `native` output swift-validate itself is gated on,
  # rather than only on swift-validate's result: unlike coverage.yml's
  # rust-coverage, which always runs when its workflow triggers,
  # swift-validate is skipped outright on a run that never touched
  # `clients/native/**`, and a pull request that never touched native code
  # should get no native-coverage comment at all rather than a "produced no
  # report" one. When native code is in scope, this still runs whenever
  # swift-validate reached an end, not only when it produced a report: a run
  # that measured nothing must replace the previous run's numbers rather than
  # leave them standing as the current readout. A cancelled run is the one
  # exception, since a superseded run has a successor already on its way to
  # overwrite the comment.
  publish-native-coverage-comment:
    name: Comment the native coverage report
    needs: [swift-change-scope, swift-validate]
    if: >-
      always()
      && needs.swift-change-scope.outputs.native == 'true'
      && needs.swift-validate.result != 'cancelled'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # `actions: read` lets the download step read this run's artifact; a
      # job-level permissions block sets every scope it omits to none.
      actions: read
      pull-requests: write
    steps:
      # Continues on error so a run that uploaded no report still reaches the
      # step below, which replaces the stale comment instead of leaving it.
      - name: Download the native coverage report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-coverage
          path: ${{ runner.temp }}/native-coverage
      # One comment per pull request, rewritten in place on every push: a
      # coverage report is a current-state readout, and a thread of superseded
      # readouts would bury the review conversation. The
      # `signalbox-native-coverage` marker is what makes this comment its own
      # thread, distinct from coverage.yml's `signalbox-rust-coverage` one, so
      # a pull request that trips both workflows carries two independent
      # sticky comments instead of one clobbering the other.
      - name: Post or update the coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$RUNNER_TEMP/native-coverage/comment.md"
          payload="$RUNNER_TEMP/payload.json"

          # No report means the run measured nothing. Saying so under the same
          # marker retires the previous run's numbers, which would otherwise
          # keep reading as this head's, and names the head that has none.
          if [ ! -f "$body" ]; then
            mkdir -p "$RUNNER_TEMP/native-coverage"
            {
              printf '%s\n\n' '<!-- signalbox-native-coverage -->'
              printf '## Native client coverage (report only)\n\n'
              printf 'The coverage run for `%s` produced no report; see ' "$HEAD_SHA"
              printf '[run %s](%s/%s/actions/runs/%s).\n\n' \
                "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
                "$GITHUB_RUN_ID"
              printf 'Nothing is gated on this. The measurement is missing, '
              printf 'not failing, and no merge waits on it.\n'
            } > "$body"
          fi
          jq -n --rawfile body "$body" '{body: $body}' > "$payload"

          # Paginated: a long-running pull request can hold more comments than
          # one page, and the marker comment is the oldest of them.
          existing="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | startswith("<!-- signalbox-native-coverage -->")) | .id')"
          first="${existing%%$'\n'*}"

          if [ -n "$first" ]; then
            gh api -X PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$first" \
              --input "$payload" --silent
          else
            gh api -X POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --input "$payload" --silent
          fi

  # Builds Rust separately from the simulator suite so Swift-only feedback does
  # not wait behind the daemon build. The name is unique across workflows for
  # the same branch-protection reason documented on swift-validate above.
  swift-real-daemon:
    name: Swift real-daemon integration
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Install PostgreSQL 18
        run: |
          brew install postgresql@18
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: swift-real-daemon
      - name: Run native client against signalboxd
        run: clients/native/scripts/test-real-server-xcode.sh
