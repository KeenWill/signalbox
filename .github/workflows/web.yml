name: Web client

on:
  pull_request:
    paths:
      - "clients/web/**"
      - "tooling/bazel/**"
      - "BUILD.bazel"
      - ".gitignore"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/web.yml"
      - ".github/actions/setup-bazel/**"
  push:
    branches: [main]
    paths:
      - "clients/web/**"
      - "tooling/bazel/**"
      - "BUILD.bazel"
      - ".gitignore"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/web.yml"
      - ".github/actions/setup-bazel/**"

concurrency:
  group: >-
    web-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref)
    || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox-builds' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-bazel
        with:
          remote-cache: ${{ vars.BAZEL_REMOTE_CACHE }}
      - name: Lint, typecheck, unit, build, and browser tests
        run: |
          bazel test --keep_going --jobs=4 --local_resources=cpu=4 --local_resources=memory=4096 --local_test_jobs=1 //clients/web/...
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-playwright-evidence
          path: bazel-testlogs/clients/web/browser_tests/test.outputs
          retention-days: 14
