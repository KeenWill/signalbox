# Report-only model-in-the-loop evaluations for daemon tool families. Each
# matrix job drives the real PostgreSQL daemon tool loop through the direct
# OpenAI adapter, running both a forced per-tool tier and one unforced family
# task. Every family uses gpt-5-nano, the selected floor tier. Model behavior
# is never a merge gate.
#
# Accepted trust boundary. The live exchange must execute proposed repository
# code against the real OpenAI API. That repository-controlled test process can
# read the API key from its step environment. The workflow therefore trusts
# anyone with write access to this repository, the same trust required to push
# executable code to main, and excludes fork authors in three independent
# places: GitHub withholds secrets from ordinary fork pull_request runs; the
# secretless eligibility job rejects a fork before any credentialed job starts;
# and every credentialed matrix job repeats the head-repository comparison.
#
# The API key is referenced by name in exactly one step. The integration-test
# binary is compiled before that step and executed directly afterward, so no
# build script or procedural macro runs while the key is readable. Tool-side
# writes remain inside test-created temporary workspaces and throwaway Git
# repositories. The web family uses injected deterministic read transports;
# the model exchange is the only network effect, and no external write is ever
# approved.
name: Daemon tool evals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/signalboxd/Cargo.toml"
      - "crates/application/Cargo.toml"
      - "crates/domain/**"
      - "crates/model-provider-runtime/Cargo.toml"
      - "crates/persistence/Cargo.toml"
      - "crates/tool-contract/**"
      - "crates/tools-git/**"
      - "crates/tools-web/**"
      - "crates/tools-workspace/**"
      - "crates/tools-exec/**"
      - "apps/signalboxd/src/lib.rs"
      - "apps/signalboxd/src/process_runtime.rs"
      - "apps/signalboxd/tests/live_tool_evals.rs"
      - "crates/application/src/create_session.rs"
      - "crates/application/src/model_execution.rs"
      - "crates/application/src/scheduler.rs"
      - "crates/application/src/start_eligible_turn.rs"
      - "crates/application/src/submit_input.rs"
      - "crates/application/src/tool_dispatch_gate.rs"
      - "crates/application/src/tool_loop.rs"
      - "crates/domain/src/tool.rs"
      - "crates/domain/src/tool_execution.rs"
      - "crates/model-provider-runtime/src/lib.rs"
      - "crates/model-runtime/**"
      - "crates/model-runtime-openai/**"
      - "crates/persistence/src/model_execution.rs"
      - "crates/persistence/src/mapping.rs"
      - "crates/persistence/migrations/**"
      - "crates/persistence/src/create_session.rs"
      - "crates/persistence/src/process_read.rs"
      - "crates/persistence/src/scheduler.rs"
      - "crates/persistence/src/start_eligible_turn.rs"
      - "crates/persistence/src/submit_input.rs"
      - "crates/persistence/src/tool_loop.rs"
      - ".github/workflows/tool-evals.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/signalboxd/Cargo.toml"
      - "crates/application/Cargo.toml"
      - "crates/domain/**"
      - "crates/model-provider-runtime/Cargo.toml"
      - "crates/persistence/Cargo.toml"
      - "crates/tool-contract/**"
      - "crates/tools-git/**"
      - "crates/tools-web/**"
      - "crates/tools-workspace/**"
      - "crates/tools-exec/**"
      - "apps/signalboxd/src/lib.rs"
      - "apps/signalboxd/src/process_runtime.rs"
      - "apps/signalboxd/tests/live_tool_evals.rs"
      - "crates/application/src/create_session.rs"
      - "crates/application/src/model_execution.rs"
      - "crates/application/src/scheduler.rs"
      - "crates/application/src/start_eligible_turn.rs"
      - "crates/application/src/submit_input.rs"
      - "crates/application/src/tool_dispatch_gate.rs"
      - "crates/application/src/tool_loop.rs"
      - "crates/domain/src/tool.rs"
      - "crates/domain/src/tool_execution.rs"
      - "crates/model-provider-runtime/src/lib.rs"
      - "crates/model-runtime/**"
      - "crates/model-runtime-openai/**"
      - "crates/persistence/src/model_execution.rs"
      - "crates/persistence/src/mapping.rs"
      - "crates/persistence/migrations/**"
      - "crates/persistence/src/create_session.rs"
      - "crates/persistence/src/process_read.rs"
      - "crates/persistence/src/scheduler.rs"
      - "crates/persistence/src/start_eligible_turn.rs"
      - "crates/persistence/src/submit_input.rs"
      - "crates/persistence/src/tool_loop.rs"
      - ".github/workflows/tool-evals.yml"
  # One daily provider/model drift sample. GitHub schedules only the copy on
  # the default branch, so this starts after owner merge.
  schedule:
    - cron: "23 10 * * *"

concurrency:
  group: >-
    daemon-tool-evals-${{ github.event_name == 'pull_request'
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  eligibility:
    name: Tool eval eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.eligibility.outputs.allowed }}
    steps:
      - name: Exclude untrusted fork code
        id: eligibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" \
            && "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]]; then
            echo "allowed=false" >> "${GITHUB_OUTPUT}"
            echo "Fork pull requests cannot enter the credentialed tool eval."
            exit 0
          fi
          echo "allowed=true" >> "${GITHUB_OUTPUT}"

  eval:
    name: ${{ matrix.family }} tool eval (report only)
    needs: eligibility
    if: ${{ needs.eligibility.outputs.allowed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    environment: openai-smoke
    strategy:
      fail-fast: false
      matrix:
        family: [git, workspace, web, exec]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bubblewrap and a sandbox-visible Rust toolchain for the exec family
        if: ${{ matrix.family == 'exec' }}
        run: sudo apt-get install --yes bubblewrap cargo rustc
      - name: Enable unprivileged user namespaces for the exec family
        if: ${{ matrix.family == 'exec' }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: daemon-tool-eval-${{ matrix.family }}
      - name: Build the tool-eval binary without credentials
        id: build
        run: |
          set -euo pipefail
          executable=$(cargo test --no-fail-fast -p signalboxd \
            --test live_tool_evals --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' \
            | tail -n1)
          test -n "${executable}" || { echo "::error::no test executable produced"; exit 1; }
          echo "executable=${executable}" >> "${GITHUB_OUTPUT}"
          if [[ "${{ matrix.family }}" == "exec" ]]; then
            cargo build -p signalbox-tools-exec --bin signalbox-exec-supervisor
            supervisor="$(pwd)/target/debug/signalbox-exec-supervisor"
            test -x "${supervisor}" || { echo "::error::no exec supervisor produced"; exit 1; }
            echo "supervisor=${supervisor}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run and summarize the live family eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SIGNALBOX_TOOL_EVAL_FAMILY: ${{ matrix.family }}
          SIGNALBOX_TOOL_EVAL_SUMMARY: ${{ runner.temp }}/tool-eval-summary.md
          SIGNALBOX_EXEC_SUPERVISOR: ${{ steps.build.outputs.supervisor }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/tool-eval-test-output"
          set +e
          "${{ steps.build.outputs.executable }}" \
            --ignored --exact live_model_in_the_loop_evaluates_one_daemon_tool_family \
            --nocapture 2>&1 | tee "${result}"
          status=${PIPESTATUS[0]}
          set -e
          if [[ -f "${SIGNALBOX_TOOL_EVAL_SUMMARY}" ]]; then
            cat "${SIGNALBOX_TOOL_EVAL_SUMMARY}" >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## ${{ matrix.family }} daemon tool eval"
              echo
              echo "Harness failure: no model-behavior report was produced."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          passed_count=$(sed -n \
            's/^test result: ok\. \([0-9][0-9]*\) passed;.*/\1/p' \
            "${result}")
          if [[ "${status}" -eq 0 && "${passed_count}" != "1" ]]; then
            echo "::error::Expected exactly one ignored tool eval to execute; libtest reported '${passed_count:-no passed count}'."
            exit 1
          fi
          exit "${status}"
