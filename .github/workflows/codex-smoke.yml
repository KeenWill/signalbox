# Compatibility smoke for the Codex CLI wrapped by
# crates/model-runtime-codex-cli. It installs the exact version pinned in
# tooling/codex-cli/release.json. It spends one real, cheapest-model exchange
# through the adapter and another through the app-server protocol probe, so a
# Renovate pin bump is proven against the live CLI. The discipline is specified
# in the Codex CLI provider adapter section of docs/spec/runtime-substrate.md.
#
# Accepted trust boundary. The live exchange must execute the proposed
# repository adapter code against the pinned CLI; that is the purpose of this
# compatibility smoke. After authentication, that repository-controlled test
# process can read the CLI credential store under CODEX_HOME. The workflow
# therefore trusts anyone with write access to this repository, the same trust
# already required to push executable code to main. It does not trust fork
# authors. First, GitHub withholds secrets from ordinary fork pull_request runs
# regardless of environment policy. Second, the secretless gate compares
# github.event.pull_request.head.repo.full_name with github.repository and
# rejects a changed fork before the credentialed job can start. Third, the
# credentialed job condition repeats that comparison. The required aggregate
# also refuses a smoke-required fork, so weakening one site is insufficient.
#
# The smoke remains bound to the codex-smoke environment, which is configured
# for all branches so main, manual, and synthetic pull-request merge refs can
# enter. That availability setting admits fork and same-repository refs alike
# and supplies no security boundary; the defenses above exclude forks.
#
# The credential is referenced only in the authentication step, piped to the
# CLI login command on stdin, and never echoed or passed in argv or a child
# environment. Repository code is compiled and the credential-free real-CLI
# probes run before the credential store exists. The later live test's access
# to that store is intentional under the accepted same-repository-writer
# boundary above.
name: Codex CLI smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "tooling/codex-cli/**"
      - "crates/model-runtime-codex-cli/**"
      - "crates/model-runtime/src/cli_process.rs"
      - ".github/workflows/codex-smoke.yml"
  # Twice-daily provider-drift canary at 9AM/9PM Eastern during daylight
  # time (13:00/01:00 UTC; drifts one hour under standard time — accepted).
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 1 * * *"

# Superseded runs release their slots against the public concurrency cap:
# pull-request runs group per PR, and other non-main runs group per
# event+ref (today only workflow_dispatch reaches that arm — every push
# trigger in this repo is filtered to main). Main runs each take a group
# of their own and are never canceled: sharing one group would let a third
# run cancel a second still pending behind the first, which
# `cancel-in-progress: false` does not prevent.
concurrency:
  group: >-
    codex-cli-smoke-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref)
    || github.ref == 'refs/heads/main' && github.run_id
    || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

# Matches the Rust workflow, whose workspace-tests job writes the shared
# cache: both the cache key and cargo's own artifact fingerprints
# incorporate RUSTFLAGS, so restore-only jobs must build identically
# to reuse it.
env:
  RUSTFLAGS: "-D warnings"

jobs:
  gate:
    name: Codex smoke eligibility
    runs-on: signalbox-orchestration
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      smoke_required: ${{ steps.gate.outputs.smoke_required }}
    steps:
      - name: Check out the pull request head for path inspection
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch exact comparison revisions
        if: ${{ github.event_name == 'pull_request' }}
        id: comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: 'true'
          GH_TOKEN: ${{ github.token }}
        shell: python3 {0}
        run: |
          import base64
          import json
          import os
          import re
          import subprocess
          import urllib.request

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          if not all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (base, head)):
              raise SystemExit("Comparison requires exact base and head commit SHAs")
          token = os.environ["GH_TOKEN"]
          if os.environ["MERGE_BASE"] == "true":
              url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/compare/{base}...{head}"
              request = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  base = json.load(response)["merge_base_commit"]["sha"]
              if not re.fullmatch(r"[0-9a-f]{40}", base):
                  raise SystemExit("GitHub returned an invalid merge-base SHA")
          # Authenticate only this fetch; checkout credentials remain unpersisted.
          authorization = base64.b64encode(f"x-access-token:{token}".encode()).decode()
          environment = dict(os.environ, GIT_CONFIG_COUNT="1",
                             GIT_CONFIG_KEY_0="http.extraheader",
                             GIT_CONFIG_VALUE_0=f"AUTHORIZATION: basic {authorization}")
          subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", base, head],
                         env=environment, check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"base={base}\nhead={head}\n")
      - name: Decide whether compatibility smoke is required
        id: gate
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
          HEAD_SHA: ${{ steps.comparison.outputs.head }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "smoke_required=true" >> "${GITHUB_OUTPUT}"
            echo "Compatibility smoke is required for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          changed_paths="${RUNNER_TEMP}/codex-smoke-changed-files"
          git diff --no-renames --name-only -z \
            "${BASE_SHA}" "${HEAD_SHA}" > "${changed_paths}"
          compatibility_changed=false
          while IFS= read -r -d '' path; do
            case "${path}" in
              tooling/codex-cli/*|crates/model-runtime-codex-cli/*|crates/model-runtime/src/cli_process.rs|.github/workflows/codex-smoke.yml)
                compatibility_changed=true
                ;;
            esac
          done < "${changed_paths}"
          if [[ "${compatibility_changed}" != "true" ]]; then
            echo "smoke_required=false" >> "${GITHUB_OUTPUT}"
            echo "Not applicable: no Codex compatibility input changed."
            exit 0
          fi

          if [[ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]]; then
            echo "smoke_required=false" >> "${GITHUB_OUTPUT}"
            echo "::error::A fork changed Codex compatibility inputs. Put the reviewed change on a trusted in-repository branch, then run: gh workflow run codex-smoke.yml --ref <trusted-branch>"
            exit 1
          fi

          echo "smoke_required=true" >> "${GITHUB_OUTPUT}"
          echo "Compatibility smoke is required because this same-repository pull request changed Codex compatibility inputs."

  smoke:
    name: Codex live compatibility
    needs: gate
    if: ${{ needs.gate.outputs.smoke_required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    # Repository → Settings → Environments → codex-smoke holds
    # CODEX_SMOKE_API_KEY. Its all-branches availability setting is documented
    # above and deliberately supplies no additional author-trust decision.
    environment: codex-smoke
    # No job-level concurrency group here. A fixed group shared across every
    # ref lets an unrelated smoke-required run evict this job's queued slot —
    # GitHub keeps at most one running and one pending member per group and
    # replaces the pending one when a third arrives, regardless of
    # cancel-in-progress — failing a required check that never tested its own
    # head. The workflow-level group above already releases a run's slot only
    # when the *same* ref is superseded — a pull-request run by a newer update
    # to its pull request, a non-main dispatch by a newer dispatch on that
    # ref; main pushes never cancel. A concurrent real exchange
    # costs a small fraction of a cent; required-check integrity is worth more
    # than serializing that spend.
    runs-on: signalbox-builds
    timeout-minutes: 20
    env:
      # Keeps the CLI's credential store inside the job's workspace instead of
      # the runner home directory, so the cleanup step below can remove it and
      # nothing survives into a later step.
      CODEX_HOME: ${{ github.workspace }}/.codex-smoke-home
      SIGNALBOX_CODEX_SMOKE_EXECUTABLE: >-
        ${{ github.workspace }}/tooling/codex-cli/bin/codex
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install the pinned Codex CLI
        run: bash tooling/codex-cli/install.sh
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: rust
          save-if: false
      # Compile the smoke test binary BEFORE the credential store exists, so no
      # repository build script or procedural macro executes while the API key
      # is readable under CODEX_HOME. The later test run is fresh and does not
      # recompile.
      - name: Build the smoke test binary
        run: >-
          cargo test --no-fail-fast -p signalbox-model-runtime-codex-cli
          --test live_smoke --no-run
      - name: Check the pinned app-server schemas
        run: bash tooling/codex-cli/schema/check.sh
      - name: Run credential-free pre-spend probes
        run: |
          set -euo pipefail
          test_name=the_pinned_codex_cli_pre_spend_contract_holds
          result="${RUNNER_TEMP}/codex-smoke-pre-spend-result"
          cargo test --color never --no-fail-fast \
            -p signalbox-model-runtime-codex-cli --test live_smoke -- \
            --ignored --exact "${test_name}" 2>&1 | tee "${result}"
          passed_count=$(sed -n \
            's/^test result: ok\. \([0-9][0-9]*\) passed;.*/\1/p' \
            "${result}")
          if [[ "${passed_count}" != "1" ]]; then
            echo "::error::Expected exactly one pre-spend test to execute; libtest reported '${passed_count:-no passed count}'."
            exit 1
          fi
      # The CLI reads the key from stdin and writes its own credential store
      # under CODEX_HOME. The value is never an argument (process listings),
      # never echoed, and never exported to the smoke step: the adapter's
      # contract is that the CLI owns its login, and this reproduces that.
      - name: Authenticate the pinned Codex CLI
        env:
          CODEX_SMOKE_API_KEY: ${{ secrets.CODEX_SMOKE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${CODEX_SMOKE_API_KEY}" \
            || { echo "the codex-smoke environment provides no API key"; exit 1; }
          mkdir -p "${CODEX_HOME}"
          chmod 700 "${CODEX_HOME}"
          # GNU timeout creates a separate process group unless --foreground
          # is requested. Its managed shell deliberately remains live after
          # TERM so the five-second KILL phase still reaches a native descendant
          # even when the direct CLI launcher exits during the grace period.
          # The shell and CLI receive the key only on stdin, never in argv or
          # either child environment.
          printenv CODEX_SMOKE_API_KEY \
            | env -u CODEX_SMOKE_API_KEY timeout --signal=TERM --kill-after=5s 30s \
                sh -c 'trap "while :; do sleep 1; done" TERM; "$@"' sh \
                tooling/codex-cli/bin/codex login --with-api-key
      # The test repeats the pre-spend assertions immediately before the model
      # operation, then spends one exchange through the adapter. The following
      # protocol probe performs another live exchange plus rejected-login probes.
      - name: Run one live exchange through the adapter
        env:
          # Optional, and a plain variable rather than a secret because a model
          # name is not sensitive. Which models an API key can address is
          # account-scoped, so the environment may override the code default.
          SIGNALBOX_CODEX_SMOKE_MODEL: ${{ vars.CODEX_SMOKE_MODEL }}
        run: |
          set -euo pipefail
          test_name=the_pinned_codex_cli_completes_one_exchange
          result="${RUNNER_TEMP}/codex-smoke-live-result"
          cargo test --color never --no-fail-fast \
            -p signalbox-model-runtime-codex-cli --test live_smoke -- \
            --ignored --exact "${test_name}" 2>&1 | tee "${result}"
          passed_count=$(sed -n \
            's/^test result: ok\. \([0-9][0-9]*\) passed;.*/\1/p' \
            "${result}")
          if [[ "${passed_count}" != "1" ]]; then
            echo "::error::Expected exactly one live smoke test to execute; libtest reported '${passed_count:-no passed count}'."
            exit 1
          fi
      - name: Probe the pinned app-server protocol
        env:
          SIGNALBOX_CODEX_SMOKE_MODEL: ${{ vars.CODEX_SMOKE_MODEL }}
        run: >-
          cargo test --no-fail-fast -p signalbox-model-runtime-codex-cli
          --test live_smoke -- --ignored --exact
          the_pinned_codex_app_server_answers_protocol_questions --nocapture
      - name: Remove the credential store
        if: ${{ always() }}
        run: rm -rf "${CODEX_HOME}"

  required:
    name: Codex smoke compatibility
    needs: [gate, smoke]
    if: ${{ always() }}
    runs-on: signalbox-orchestration
    timeout-minutes: 5
    env:
      EVENT_NAME: ${{ github.event_name }}
      GATE_RESULT: ${{ needs.gate.result }}
      SMOKE_REQUIRED: ${{ needs.gate.outputs.smoke_required }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Report the binding result
        run: |
          set -euo pipefail
          if [[ "${GATE_RESULT}" != "success" ]]; then
            echo "The Codex smoke eligibility gate failed."
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "pull_request" \
            && "${SMOKE_REQUIRED}" == "true" \
            && "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]]; then
            echo "A fork pull request cannot use the credentialed Codex smoke."
            exit 1
          fi
          if [[ "${SMOKE_REQUIRED}" == "true" && "${SMOKE_RESULT}" != "success" ]]; then
            echo "The required Codex live compatibility smoke did not pass."
            exit 1
          fi
          if [[ "${SMOKE_REQUIRED}" == "true" ]]; then
            echo "The required Codex live compatibility smoke passed."
          else
            echo "Not applicable: no Codex compatibility input changed."
          fi
