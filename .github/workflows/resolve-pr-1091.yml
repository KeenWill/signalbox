name: Resolve PR 1091 merge

on:
  push:
    branches:
      - agent/web-session-catalog-follow

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/web-session-catalog-follow
          fetch-depth: 0

      - name: Merge main and resolve the known overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          git diff --name-only --diff-filter=U | sort > /tmp/conflicts
          echo "Merge exit status: ${merge_status}"
          echo "Conflicts:"
          cat /tmp/conflicts

          while IFS= read -r path; do
            case "$path" in
              crates/application/src/lib.rs|\
              crates/persistence/src/lib.rs|\
              crates/persistence/tests/postgres_integration/main.rs|\
              docs/domain-spine.md|\
              docs/spec/configuration-and-credentials.md|\
              docs/spec/sessions-and-transcript.md)
                git checkout --theirs -- "$path"
                ;;
              "")
                ;;
              *)
                echo "Unexpected merge conflict: $path" >&2
                exit 1
                ;;
            esac
          done < /tmp/conflicts

          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, marker: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text()
              if marker not in text:
                  raise SystemExit(f"missing merge marker in {path}: {marker!r}")
              target.write_text(text.replace(marker, replacement, 1))

          path = Path("crates/application/src/lib.rs")
          text = path.read_text()
          if "mod attention;" not in text:
              text = text.replace("mod approval_judge;\n", "mod approval_judge;\nmod attention;\n", 1)
          attention_export = '''pub use attention::{
              AttentionAction, AttentionActivity, AttentionActivityKind, AttentionBlockedReason,
              AttentionChanges, AttentionContinuation, AttentionCursor, AttentionGoalBlock,
              AttentionJudgeFacts, AttentionQuery, AttentionQueryError, AttentionReader, AttentionSnapshot,
              AttentionSort, AttentionState, AttentionSummary, max_attention_change_items,
              max_attention_filter_tags, max_attention_filter_utf8_bytes,
              max_attention_goal_summary_characters, max_attention_snapshot_items,
              max_attention_title_characters,
          };
          '''
          if "pub use attention::{" not in text:
              text = text.replace("pub use commissioned_dispatch::{", attention_export + "pub use commissioned_dispatch::{", 1)
          path.write_text(text)

          path = Path("crates/persistence/src/lib.rs")
          text = path.read_text()
          if "pub mod attention;" not in text:
              text = text.replace("pub mod approval_judge;\n", "pub mod approval_judge;\npub mod attention;\n", 1)
          path.write_text(text)

          path = Path("crates/persistence/tests/postgres_integration/main.rs")
          text = path.read_text()
          if "mod attention;" not in text:
              text = text.replace("mod approval_decisions;\n", "mod approval_decisions;\nmod attention;\n", 1)
          path.write_text(text)

          path = Path("docs/spec/configuration-and-credentials.md")
          text = path.read_text()
          if "agent/web-attention-projections" not in text:
              old = '''composed bounded session descriptor and historical-window routes are verified
          against this PR (`agent/web-session-timeline`).
          '''
              new = '''composed bounded session descriptor and historical-window routes are verified
          against this PR (`agent/web-session-timeline`). The fleet-attention snapshot and
          monitor stream are verified against this PR (`agent/web-attention-projections`).
          '''
              if old not in text:
                  raise SystemExit("configuration verification marker is missing")
              text = text.replace(old, new, 1)
          catalog_transport = '''The bounded session catalog route and row semantics are owned by
          [Sessions and the transcript](sessions-and-transcript.md#bounded-browser-session-catalog).
          The projection uses one set query over the selected identities and never
          constructs the fleet by following individual sessions.

          `GET /api/attention/follow` begins with the coherent hot-session catalog page
          and its durable change-journal cursor, then emits summary replacements only for
          changed session identities. One incremental read examines at most 128 journal
          records. A larger cursor gap emits `resync_required` with the current cursor and
          ends that stream; it never skips records or continues from a partial gap. The
          HTTP producer retains at most one bounded 128-summary replacement batch,
          represented as no more than eight 16-summary update items, and waits between
          empty polls. An initial projection failure returns a typed HTTP error before
          streaming begins. The append-only change journal timestamps commits explicitly;
          historical creation is seeded only from the durable command claim time and never
          inferred from UUID bits.

          '''
          if "GET /api/attention/follow" not in text:
              marker = "Rust serde DTOs and their schemars schemas under `crates/web-contract` are the\n"
              if marker not in text:
                  raise SystemExit("configuration contract marker is missing")
              text = text.replace(marker, catalog_transport + marker, 1)
          path.write_text(text)

          path = Path("docs/spec/sessions-and-transcript.md")
          text = path.read_text()
          if "agent/web-session-catalog-follow" not in text:
              old = '''The bounded browser session descriptor and historical timeline foundation are
          verified against this PR (`agent/web-session-timeline`).
          '''
              new = '''The bounded browser session descriptor and historical timeline foundation are
          verified against this PR (`agent/web-session-timeline`). The bounded browser
          session catalog is verified against this PR
          (`agent/web-session-catalog-follow`).
          '''
              if old not in text:
                  raise SystemExit("session verification marker is missing")
              text = text.replace(old, new, 1)
          catalog_section = '''## Bounded browser session catalog

          `GET /api/sessions` is the one fleet-wide session chooser and attention read
          model. It returns at most 16 rows from one read-only repeatable-read snapshot,
          the exact filtered total, and the durable attention-journal cursor. The total
          counts filtered session and metadata rows; it never scans transcript or timeline
          records. Each row carries session identity, a title summary of at most 128
          Unicode scalar values with an explicit truncation bit, archive posture, current
          turn, active and queued turn counts, the closed current attention state, exact
          operator action when one is owed, bounded blocked-goal and approval-judge facts,
          and the last explicitly timestamped durable activity. No timestamp is inferred
          from UUID identity bits.

          The default order is descending last activity with ascending session identity as
          the total tie-breaker. The alternate order is ascending session identity. Both
          use exclusive typed keyset continuations; a continuation for one order is
          invalid under the other. Search is an exact case-sensitive substring of title or
          canonical session UUID. A query may additionally require at most eight exact
          tags, whose combined UTF-8 bytes together with search text are at most 1,024,
          and may include archived sessions. Sort and filter state are client-local inputs
          to these bounded reads, not durable session state.

          This extends the fleet attention projection rather than maintaining a second
          session-state classifier. Runner loss, recovery ambiguity, reconciliation,
          approval wait, blocked goal, active, queued, and idle remain distinct. Page and
          change reads derive them from the same durable facts and fail closed on unknown
          states or inconsistent shapes.

          '''
          if "## Bounded browser session catalog" not in text:
              marker = "## Bounded browser session timeline\n"
              if marker not in text:
                  raise SystemExit("session timeline section marker is missing")
              text = text.replace(marker, catalog_section + marker, 1)
          path.write_text(text)

          path = Path("docs/domain-spine.md")
          text = path.read_text()
          attention_section = '''## application: attention

          ```rust
          pub const fn max_attention_snapshot_items() -> u16;
          pub const fn max_attention_goal_summary_characters() -> u16;
          pub const fn max_attention_change_items() -> u16;
          pub const fn max_attention_title_characters() -> u16;
          pub const fn max_attention_filter_tags() -> u8;
          pub const fn max_attention_filter_utf8_bytes() -> u16;

          pub struct AttentionCursor(/* private */);
          impl AttentionCursor {
              pub const fn new(value: u64) -> Self;
              pub const fn value(self) -> u64;
          }

          pub enum AttentionState {
              Active,
              Queued,
              Blocked,
              AwaitingApproval,
              Ambiguous,
              AwaitingReconciliation,
              RunnerLost,
              Idle,
          }

          pub enum AttentionSort {
              LastActivityDescending,
              SessionIdentityAscending,
          }

          pub enum AttentionContinuation {
              LastActivity { recorded_at: SystemTime, session: SessionId },
              SessionIdentity(SessionId),
          }

          pub struct AttentionQuery { /* private */ }
          impl AttentionQuery {
              pub fn hot_page() -> Self;
              pub fn try_new(
                  search: Option<String>,
                  required_tags: Vec<String>,
                  include_archived: bool,
                  sort: AttentionSort,
                  continuation: Option<AttentionContinuation>,
              ) -> Result<Self, AttentionQueryError>;
              pub fn search(&self) -> Option<&str>;
              pub fn required_tags(&self) -> impl ExactSizeIterator<Item = &str>;
              pub const fn include_archived(&self) -> bool;
              pub const fn sort(&self) -> AttentionSort;
              pub const fn continuation(&self) -> Option<&AttentionContinuation>;
          }

          pub enum AttentionQueryError {
              TooManyTags,
              InvalidTag,
              DuplicateTag,
              InvalidSearch,
              FilterTooLarge,
              ContinuationSortMismatch,
          }

          pub enum AttentionAction {
              ProvideGoalNeed,
              DecideApproval,
              ReconcileTurn,
              RestoreRunner,
          }

          pub enum AttentionBlockedReason {
              UserInputRequired,
              ExternalChangeRequired,
              AuthorizationRequired,
              ExecutionFailure,
          }

          pub struct AttentionGoalBlock {
              pub generation: u64,
              pub reason: AttentionBlockedReason,
              pub need_summary: String,
          }

          pub struct AttentionJudgeFacts {
              pub actionable: u64,
              pub completed: u64,
              pub escalated: u64,
              pub failed: u64,
          }

          pub struct AttentionActivity {
              pub recorded_at: SystemTime,
              pub kind: AttentionActivityKind,
          }

          pub enum AttentionActivityKind {
              Session,
              Turn,
              Goal,
              ApprovalJudge,
              Runner,
          }

          pub struct AttentionSummary {
              pub session: SessionId,
              pub title_summary: Option<String>,
              pub title_truncated: bool,
              pub archived: bool,
              pub current_turn: Option<TurnId>,
              pub active_turn_count: u64,
              pub queued_turn_count: u64,
              pub state: AttentionState,
              pub action: Option<AttentionAction>,
              pub goal_block: Option<AttentionGoalBlock>,
              pub judge: AttentionJudgeFacts,
              pub last_activity: AttentionActivity,
          }

          pub struct AttentionSnapshot {
              pub cursor: AttentionCursor,
              pub total: u64,
              pub sort: AttentionSort,
              pub summaries: Vec<AttentionSummary>,
              pub continuation: Option<AttentionContinuation>,
          }

          pub enum AttentionChanges {
              Updated {
                  cursor: AttentionCursor,
                  summaries: Vec<AttentionSummary>,
              },
              ResyncRequired { cursor: AttentionCursor },
          }

          pub trait AttentionReader {
              type Error;
              fn snapshot(
                  &self,
                  query: AttentionQuery,
              ) -> impl Future<Output = Result<AttentionSnapshot, Self::Error>> + Send;
              fn changes_after(
                  &self,
                  cursor: AttentionCursor,
              ) -> impl Future<Output = Result<AttentionChanges, Self::Error>> + Send;
          }
          ```

          '''
          if "## application: attention" not in text:
              marker = "## application: approval_judge\n"
              if marker not in text:
                  raise SystemExit("domain spine application marker is missing")
              text = text.replace(marker, attention_section + marker, 1)
          attention_row = "| application: attention                             | 16 (+6 free fn) (incl. 1 trait)  |\n"
          if "| application: attention" not in text:
              marker = "| application: approval_judge"
              position = text.find(marker)
              if position < 0:
                  raise SystemExit("domain spine inventory marker is missing")
              text = text[:position] + attention_row + text[position:]
          total_pattern = re.compile(r"^\| \*\*signalbox-application total\*\*\s+\| \*\*\d+ \(\+\d+ free fn\)\*\*\s+\|$", re.MULTILINE)
          text, replacements = total_pattern.subn(
              "| **signalbox-application total**                    | **350 (+16 free fn)**            |",
              text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("domain spine aggregate total marker is missing")
          path.write_text(text)
          PY

          git add \
            crates/application/src/lib.rs \
            crates/persistence/src/lib.rs \
            crates/persistence/tests/postgres_integration/main.rs \
            docs/domain-spine.md \
            docs/spec/configuration-and-credentials.md \
            docs/spec/sessions-and-transcript.md

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved paths remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          python3 scripts/check_domain_spine.py
          git diff --check
          git status --short

          git commit -m "Merge main into agent/web-session-catalog-follow"
          git push origin HEAD:agent/web-session-catalog-follow
