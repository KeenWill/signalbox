name: Bazel

on:
  workflow_call:
    inputs:
      postgres:
        description: Run PostgreSQL integration shards for affected paths.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      cache-mode:
        description: Cache option for the measurement run.
        type: choice
        options: [baseline, compression, minimal]
        default: baseline

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bazel-tests:
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox-builds' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          remote-cache: ${{ vars.BAZEL_REMOTE_CACHE }}
      - name: Record cache study evidence
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cache-study"
          cat >> .bazelrc.local <<EOF
          build --build_event_json_file=$RUNNER_TEMP/cache-study/bep.json
          build --execution_log_json_file=$RUNNER_TEMP/cache-study/execution.json
          build --profile=$RUNNER_TEMP/cache-study/profile.json.gz
          build --experimental_remote_grpc_log=$RUNNER_TEMP/cache-study/grpc.bin
          EOF
          case '${{ inputs.cache-mode }}' in
            compression) echo 'build --remote_cache_compression' >> .bazelrc.local ;;
            minimal) echo 'build --remote_download_minimal' >> .bazelrc.local ;;
          esac
          date -u +%FT%TZ > "$RUNNER_TEMP/cache-study/start.txt"
          hostname > "$RUNNER_TEMP/cache-study/hostname.txt"
          df -hT > "$RUNNER_TEMP/cache-study/filesystems.txt"
      - name: Fetch dependencies for the compile-fail fixture compiler
        run: cargo fetch --locked
      - name: Build and test the Bazel migration slice
        run: |
          bazel test --jobs=4 --local_resources=cpu=4 --local_resources=memory=4096 --local_test_jobs=1 //:rust_build //:bazel_tests //:rust_clippy_tests //:rust_documentation

      - name: Upload cache study evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-study-${{ github.job }}-${{ matrix.suite || 'ordinary' }}-${{ matrix.shard_index || '0' }}
          path: ${{ runner.temp }}/cache-study

  bazel-host-integration:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          remote-cache: ${{ vars.BAZEL_REMOTE_CACHE }}
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Enable unprivileged user namespaces for Bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Delegate the file-media task controller
        run: |
          sudo mkdir /sys/fs/cgroup/signalbox-file-media-ci
          sudo sh -c 'echo +pids +memory > /sys/fs/cgroup/cgroup.subtree_control'
          sudo mkdir /sys/fs/cgroup/signalbox-file-media-ci/runner
          sudo sh -c 'echo +pids +memory > /sys/fs/cgroup/signalbox-file-media-ci/cgroup.subtree_control'
          sudo chown -R "$USER" /sys/fs/cgroup/signalbox-file-media-ci
      - name: Run host integration tests
        env:
          SIGNALBOX_RUN_BWRAP_INTEGRATION: "1"
          SIGNALBOX_FILE_MEDIA_CGROUP_ROOT: /sys/fs/cgroup/signalbox-file-media-ci
        run: |
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          runner_home="$HOME"
          runner_path="$PATH"
          sudo --preserve-env=CI,SIGNALBOX_RUN_BWRAP_INTEGRATION,SIGNALBOX_FILE_MEDIA_CGROUP_ROOT \
            sh -eu -c '
              echo $$ > "$SIGNALBOX_FILE_MEDIA_CGROUP_ROOT/runner/cgroup.procs"
              exec setpriv --reuid="$1" --regid="$2" --init-groups \
                env HOME="$3" PATH="$4" bazel --batch test --keep_going \
                  --jobs=4 --local_resources=cpu=4 --local_resources=memory=4096 \
                  --local_test_jobs=1 --test_env=SIGNALBOX_FILE_MEDIA_CGROUP_ROOT \
                  --test_env=SIGNALBOX_RUN_BWRAP_INTEGRATION //:host_integration_tests
            ' sh "$runner_uid" "$runner_gid" "$runner_home" "$runner_path"

  postgres-matrix:
    if: github.event_name == 'workflow_dispatch' || inputs.postgres
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox-orchestration' }}
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo 'matrix={"include":[{"suite":"persistence","shard_index":1},{"suite":"workflow-runtime","shard_index":0}]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(python3 scripts/postgres_integration_suites.py --matrix)" >> "$GITHUB_OUTPUT"
          fi

  bazel-postgres:
    if: github.event_name == 'workflow_dispatch' || inputs.postgres
    needs: postgres-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.postgres-matrix.outputs.matrix) }}
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox-integration-tests' }}
    # Each worker runs one manifest partition across the suite's binaries.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          remote-cache: ${{ vars.BAZEL_REMOTE_CACHE }}
      - name: Record cache study evidence
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cache-study"
          cat >> .bazelrc.local <<EOF
          build --build_event_json_file=$RUNNER_TEMP/cache-study/bep.json
          build --execution_log_json_file=$RUNNER_TEMP/cache-study/execution.json
          build --profile=$RUNNER_TEMP/cache-study/profile.json.gz
          build --experimental_remote_grpc_log=$RUNNER_TEMP/cache-study/grpc.bin
          EOF
          case '${{ inputs.cache-mode }}' in
            compression) echo 'build --remote_cache_compression' >> .bazelrc.local ;;
            minimal) echo 'build --remote_download_minimal' >> .bazelrc.local ;;
          esac
          date -u +%FT%TZ > "$RUNNER_TEMP/cache-study/start.txt"
          hostname > "$RUNNER_TEMP/cache-study/hostname.txt"
          df -hT > "$RUNNER_TEMP/cache-study/filesystems.txt"
      - name: Run the manifest PostgreSQL suite
        env:
          BAZEL_POSTGRES_SUITE: ${{ matrix.suite }}
          BAZEL_POSTGRES_SHARD_INDEX: ${{ matrix.shard_index }}
        run: python3 scripts/postgres_integration_suites.py --run-suite "$BAZEL_POSTGRES_SUITE" --shard-index "$BAZEL_POSTGRES_SHARD_INDEX"
      - name: Upload cache study evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-study-${{ github.job }}-${{ matrix.suite || 'ordinary' }}-${{ matrix.shard_index || '0' }}
          path: ${{ runner.temp }}/cache-study
