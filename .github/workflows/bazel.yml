name: Bazel

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bazel-tests:
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
      - name: Fetch dependencies for the compile-fail fixture compiler
        run: cargo fetch --locked
      - name: Build and test the Bazel migration slice
        env:
          BAZEL_REMOTE_CACHE: ${{ vars.BAZEL_REMOTE_CACHE }}
        run: |
          cache_args=()
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" && -n "$BAZEL_REMOTE_CACHE" ]]; then
            cache_args+=(--remote_cache="$BAZEL_REMOTE_CACHE")
          fi
          bazel test --jobs=4 --local_resources=cpu=4 --local_resources=memory=4096 --local_test_jobs=1 "${cache_args[@]}" //:rust_build //:bazel_tests //:rust_clippy_tests //:rust_documentation

  bazel-host-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Enable unprivileged user namespaces for Bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Delegate the file-media task controller
        run: |
          sudo mkdir /sys/fs/cgroup/signalbox-file-media-ci
          sudo sh -c 'echo +pids +memory > /sys/fs/cgroup/cgroup.subtree_control'
          sudo mkdir /sys/fs/cgroup/signalbox-file-media-ci/runner
          sudo sh -c 'echo +pids +memory > /sys/fs/cgroup/signalbox-file-media-ci/cgroup.subtree_control'
          sudo chown -R "$USER" /sys/fs/cgroup/signalbox-file-media-ci
      - name: Run host integration tests
        env:
          SIGNALBOX_RUN_BWRAP_INTEGRATION: "1"
          SIGNALBOX_FILE_MEDIA_CGROUP_ROOT: /sys/fs/cgroup/signalbox-file-media-ci
        run: |
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          runner_home="$HOME"
          runner_path="$PATH"
          sudo --preserve-env=CI,SIGNALBOX_RUN_BWRAP_INTEGRATION,SIGNALBOX_FILE_MEDIA_CGROUP_ROOT \
            sh -eu -c '
              echo $$ > "$SIGNALBOX_FILE_MEDIA_CGROUP_ROOT/runner/cgroup.procs"
              exec setpriv --reuid="$1" --regid="$2" --init-groups \
                env HOME="$3" PATH="$4" bazel --batch test --keep_going \
                  --jobs=4 --local_resources=cpu=4 --local_resources=memory=4096 \
                  --local_test_jobs=1 --test_env=SIGNALBOX_FILE_MEDIA_CGROUP_ROOT \
                  --test_env=SIGNALBOX_RUN_BWRAP_INTEGRATION //:host_integration_tests
            ' sh "$runner_uid" "$runner_gid" "$runner_home" "$runner_path"

  postgres-matrix:
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox' }}
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: echo "matrix=$(python3 scripts/postgres_integration_suites.py --matrix)" >> "$GITHUB_OUTPUT"

  bazel-postgres:
    needs: postgres-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.postgres-matrix.outputs.matrix) }}
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox-docker' }}
    # Each worker runs one manifest partition across the suite's binaries.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
      - name: Run the manifest PostgreSQL suite
        env:
          BAZEL_REMOTE_CACHE: ${{ vars.BAZEL_REMOTE_CACHE }}
          BAZEL_POSTGRES_SUITE: ${{ matrix.suite }}
          BAZEL_POSTGRES_SHARD_INDEX: ${{ matrix.shard_index }}
        run: python3 scripts/postgres_integration_suites.py --run-suite "$BAZEL_POSTGRES_SUITE" --shard-index "$BAZEL_POSTGRES_SHARD_INDEX"
