name: CI capacity experiment
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: fixtures
        options: [fixtures, shard]
permissions:
  contents: read
jobs:
  fixture-benchmark:
    if: inputs.mode != 'shard'
    runs-on: signalbox-integration-tests
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          remote-cache: ${{ vars.BAZEL_REMOTE_CACHE }}
      - name: Build the pinned test executable
        run: |
          bazel build --jobs=4 //crates/persistence:postgres_integration
          test_binary=$(bazel cquery //crates/persistence:postgres_integration --output=files)
          python3 tooling/ci-capacity/prepare.py "$test_binary"
          lscpu > tooling/ci-capacity/worker-cpu.txt
          git rev-parse HEAD > tooling/ci-capacity/revision.txt
      - name: Create an isolated eight-CPU benchmark daemon
        run: |
          benchmark_container="cicapacity-${GITHUB_RUN_ID}"
          echo "BENCHMARK_CONTAINER=$benchmark_container" >> "$GITHUB_ENV"
          docker create --name "$benchmark_container" --label org.signalbox.ci-capacity=experiment \
            --privileged --cgroupns=host --cgroup-parent="/cicapacity${GITHUB_RUN_ID}" \
            --entrypoint /bin/sh \
            docker:29.4.0-dind@sha256:a6dd5322747a95cd8e3207bd8d415a8fd20ec34e9c00f06dc019cbd912013489 /bench/boot.sh
          docker cp tooling/ci-capacity "$benchmark_container:/bench"
          docker start "$benchmark_container"
          for attempt in $(seq 1 60); do
            if docker exec "$benchmark_container" docker info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$benchmark_container" docker info >/dev/null
          docker exec "$benchmark_container" apk add --no-cache python3 procps
          postgres_image=$(python3 -c 'import pathlib,re; print("postgres:"+re.search(r"\"([^\"]+)\"",pathlib.Path("tooling/postgres_test_image.rs").read_text())[1])')
          docker exec "$benchmark_container" docker pull "$postgres_image"
      - name: Compare fixture reuse and concurrency
        run: docker exec -e BENCH_REPETITIONS=3 "$BENCHMARK_CONTAINER" python3 /bench/run.py
      - name: Collect measurements
        if: always()
        run: |
          mkdir -p capacity-results
          docker logs "$BENCHMARK_CONTAINER" > capacity-results/daemon.log 2>&1 || true
          docker cp "$BENCHMARK_CONTAINER:/bench/results" capacity-results/ || true
          docker cp "$BENCHMARK_CONTAINER:/bench/selected-tests.json" capacity-results/ || true
          cp tooling/ci-capacity/worker-cpu.txt tooling/ci-capacity/revision.txt capacity-results/ || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-capacity-fixture-experiment
          path: capacity-results/
          retention-days: 7
      - name: Remove the owned benchmark daemon and test containers
        if: always()
        run: |
          if docker inspect "$BENCHMARK_CONTAINER" >/dev/null 2>&1; then
            docker exec "$BENCHMARK_CONTAINER" sh -c 'ids=$(docker ps -aq); if [ -n "$ids" ]; then docker rm -f -v $ids; fi' || true
            docker rm -f -v "$BENCHMARK_CONTAINER"
          fi

  whole-shard-canary:
    if: inputs.mode == 'shard'
    runs-on: signalbox-integration-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          remote-cache: ${{ vars.BAZEL_REMOTE_CACHE }}
      - name: Place the owned daemon and its children under this pod
        run: |
          image=docker:29.4.0-dind@sha256:a6dd5322747a95cd8e3207bd8d415a8fd20ec34e9c00f06dc019cbd912013489
          daemon_cgroup=$(docker run --rm --pid=host --cgroupns=host --entrypoint sh "$image" -c "sed -n 's/^0:://p' /proc/1/cgroup")
          pod_cgroup=${daemon_cgroup%/*}
          case "$pod_cgroup" in /kubepods/*/pod*) ;; *) exit 1;; esac
          canary="cicapacity-shard-${GITHUB_RUN_ID}"
          echo "CANARY_CONTAINER=$canary" >> "$GITHUB_ENV"
          docker create --name "$canary" --label org.signalbox.ci-capacity=whole-shard \
            --privileged --network=host --cgroupns=host --cgroup-parent="$pod_cgroup" \
            --mount type=bind,source=/var/run,target=/shared-run \
            --entrypoint sh "$image" /bench/pod-daemon.sh
          docker cp tooling/ci-capacity "$canary:/bench"
          docker start "$canary"
          for attempt in $(seq 1 60); do
            if DOCKER_HOST=unix:///var/run/cicapacity.sock docker info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          DOCKER_HOST=unix:///var/run/cicapacity.sock docker info >/dev/null
          postgres_image=$(python3 -c 'import pathlib,re; print("postgres:"+re.search(r"\"([^\"]+)\"",pathlib.Path("tooling/postgres_test_image.rs").read_text())[1])')
          DOCKER_HOST=unix:///var/run/cicapacity.sock docker pull "$postgres_image"
      - name: Measure a complete uncached persistence shard
        run: |
          mkdir -p capacity-results
          lscpu > capacity-results/worker-cpu.txt
          git rev-parse HEAD > capacity-results/revision.txt
          docker exec "$CANARY_CONTAINER" sh /bench/read-parent.sh > capacity-results/parent.jsonl &
          reader_pid=$!
          sleep 1
          set +e
          python3 tooling/ci-capacity/profile-shard.py capacity-results
          result=$?
          set -e
          docker exec "$CANARY_CONTAINER" touch /tmp/capacity-profile-stop
          wait "$reader_pid"
          exit "$result"
      - name: Preserve cache and resource evidence
        if: always()
        run: |
          mkdir -p capacity-results
          python3 scripts/summarize_bazel_test_cache.py capacity-results/events.jsonl > capacity-results/cache-report.md
          docker logs "$CANARY_CONTAINER" > capacity-results/daemon.log 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-capacity-whole-shard
          path: capacity-results/
          retention-days: 7
      - name: Remove only the canary daemon and its test containers
        if: always()
        run: |
          if docker inspect "$CANARY_CONTAINER" >/dev/null 2>&1; then
            docker exec "$CANARY_CONTAINER" sh -c 'ids=$(docker --host=unix:///shared-run/cicapacity.sock ps -aq); if [ -n "$ids" ]; then docker --host=unix:///shared-run/cicapacity.sock rm -f -v $ids; fi' || true
            docker rm -f -v "$CANARY_CONTAINER"
          fi
