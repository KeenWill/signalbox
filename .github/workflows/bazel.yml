name: Bazel

on:
  workflow_call:
    inputs:
      postgres:
        description: Run PostgreSQL integration shards for affected paths.
        type: boolean
        default: true
      changed-paths:
        description: JSON changed paths for conservative source dependency selection.
        type: string
        default: '[]'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bazel-tests:
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox-integration-tests' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          remote-cache: ${{ vars.BAZEL_REMOTE_CACHE }}
      - name: Fetch dependencies for the compile-fail fixture compiler
        run: cargo fetch --locked
      - name: Build and test the Bazel migration slice
        run: |
          bazel test --jobs=4 --local_resources=cpu=4 --local_resources=memory=4096 --local_test_jobs=1 //:rust_build //:bazel_tests //:rust_clippy_tests //:rust_documentation

  bazel-host-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          remote-cache: ${{ vars.BAZEL_REMOTE_CACHE }}
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Enable unprivileged user namespaces for Bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Delegate the file-media task controller
        run: |
          sudo mkdir /sys/fs/cgroup/signalbox-file-media-ci
          sudo sh -c 'echo +pids +memory > /sys/fs/cgroup/cgroup.subtree_control'
          sudo mkdir /sys/fs/cgroup/signalbox-file-media-ci/runner
          sudo sh -c 'echo +pids +memory > /sys/fs/cgroup/signalbox-file-media-ci/cgroup.subtree_control'
          sudo chown -R "$USER" /sys/fs/cgroup/signalbox-file-media-ci
      - name: Run host integration tests
        env:
          SIGNALBOX_RUN_BWRAP_INTEGRATION: "1"
          SIGNALBOX_FILE_MEDIA_CGROUP_ROOT: /sys/fs/cgroup/signalbox-file-media-ci
        run: |
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          runner_home="$HOME"
          runner_path="$PATH"
          sudo --preserve-env=CI,SIGNALBOX_RUN_BWRAP_INTEGRATION,SIGNALBOX_FILE_MEDIA_CGROUP_ROOT \
            sh -eu -c '
              echo $$ > "$SIGNALBOX_FILE_MEDIA_CGROUP_ROOT/runner/cgroup.procs"
              exec setpriv --reuid="$1" --regid="$2" --init-groups \
                env HOME="$3" PATH="$4" bazel --batch test --keep_going \
                  --jobs=4 --local_resources=cpu=4 --local_resources=memory=4096 \
                  --local_test_jobs=1 --test_env=SIGNALBOX_FILE_MEDIA_CGROUP_ROOT \
                  --test_env=SIGNALBOX_RUN_BWRAP_INTEGRATION //:host_integration_tests
            ' sh "$runner_uid" "$runner_gid" "$runner_home" "$runner_path"

  postgres-matrix:
    if: github.event_name == 'workflow_dispatch' || inputs.postgres
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox-builds' }}
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          remote-cache: ${{ vars.BAZEL_REMOTE_CACHE }}
      - id: matrix
        env:
          CHANGED_PATHS: ${{ inputs.changed-paths || '[]' }}
        run: |
          matrix=$(python3 scripts/ci_bazel_scope.py --changed-paths "$CHANGED_PATHS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  bazel-postgres:
    if: github.event_name == 'workflow_dispatch' || inputs.postgres
    needs: postgres-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.postgres-matrix.outputs.matrix) }}
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) && 'ubuntu-latest' || 'signalbox-integration-tests' }}
    # Cold daemon binaries can still be compiling at the usual suite deadline.
    timeout-minutes: ${{ matrix.suite == 'signalboxd' && 30 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          remote-cache: ${{ vars.BAZEL_REMOTE_CACHE }}
      - name: Run the manifest PostgreSQL suite
        env:
          BAZEL_POSTGRES_SUITE: ${{ matrix.suite }}
          BAZEL_POSTGRES_SHARD_INDEX: ${{ matrix.shard_index }}
        run: python3 scripts/measure_docker_resources.py run --output "$RUNNER_TEMP/docker-resources.json" -- python3 scripts/postgres_integration_suites.py --run-suite "$BAZEL_POSTGRES_SUITE" --shard-index "$BAZEL_POSTGRES_SHARD_INDEX" --build-event-json "$RUNNER_TEMP/postgres-events.jsonl"
      - name: Report Docker test-container resources
        if: always()
        continue-on-error: true
        run: python3 scripts/measure_docker_resources.py report "$RUNNER_TEMP/docker-resources.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain Docker resource samples
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-resources-${{ github.run_attempt }}-${{ matrix.suite }}-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/docker-resources.json
          retention-days: 7
      - name: Report test-result reuse and retries
        if: always()
        continue-on-error: true
        run: python3 scripts/summarize_bazel_test_cache.py "$RUNNER_TEMP/postgres-events.jsonl" >> "$GITHUB_STEP_SUMMARY"
