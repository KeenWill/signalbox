# Compatibility smoke for the direct OpenAI Chat Completions API adapter in
# crates/model-runtime-openai. It spends one real, fraction-of-a-cent exchange
# through the adapter's own HTTP client, so a change to that crate is proven
# against the live API rather than assumed. The discipline it implements is
# specified in the OpenAI adapter section of docs/spec/runtime-substrate.md.
#
# Accepted trust boundary. The live exchange must execute the proposed
# repository adapter code against the real OpenAI API; that is the purpose
# of this compatibility smoke. That repository-controlled test process reads
# the API key from the job environment. The workflow therefore trusts anyone
# with write access to this repository, the same trust already required to
# push executable code to main. It does not trust fork authors. First, GitHub
# withholds secrets from ordinary fork pull_request runs regardless of
# environment policy. Second, the secretless gate compares
# github.event.pull_request.head.repo.full_name with github.repository and
# rejects a changed fork before the credentialed job can start. Third, the
# credentialed job condition repeats that comparison. The required aggregate
# also refuses a smoke-required fork, so weakening one site is insufficient.
#
# The smoke remains bound to the openai-smoke environment, which is
# configured for all branches so main, manual, and synthetic pull-request
# merge refs can enter. That availability setting admits fork and
# same-repository refs alike and supplies no security boundary; the defenses
# above exclude forks.
#
# The credential is referenced only in the live-exchange step, injected into
# that step's environment alone, and never echoed or passed in argv. The
# repository code is compiled before the credential is read.
#
# Owner setup: Repository -> Settings -> Environments -> create an
# `openai-smoke` environment holding a secret named OPENAI_API_KEY. The
# live job cannot pass until that environment and secret exist.
name: OpenAI smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "crates/model-runtime-openai/**"
      - ".github/workflows/openai-smoke.yml"
  # Twice-daily provider-drift canary at 9AM/9PM Eastern during daylight
  # time (13:00/01:00 UTC; drifts to 8AM/8PM Eastern under standard time —
  # accepted). Scheduled runs are not pull_request events, so the gate's
  # non-pull_request branch marks them smoke_required unconditionally, and
  # they run from the default branch, which GitHub requires for scheduled
  # workflows regardless of what this file's history looks like elsewhere.
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 1 * * *"

# Superseded pull-request runs release their slots against the public
# concurrency cap. Every other event takes a group of its own: sharing one
# group would let a third run cancel a second still pending behind the first,
# which `cancel-in-progress: false` does not prevent.
concurrency:
  group: >-
    openai-smoke-${{ github.event_name == 'pull_request'
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

# Matches the Rust workflow, whose workspace-tests job writes the shared
# cache: both the cache key and cargo's own artifact fingerprints
# incorporate RUSTFLAGS, so restore-only jobs must build identically
# to reuse it.
env:
  RUSTFLAGS: "-D warnings"

jobs:
  gate:
    name: OpenAI smoke eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      smoke_required: ${{ steps.gate.outputs.smoke_required }}
    steps:
      - name: Check out the pull request head for path inspection
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Decide whether compatibility smoke is required
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "smoke_required=true" >> "${GITHUB_OUTPUT}"
            echo "Compatibility smoke is required for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          changed_paths="${RUNNER_TEMP}/openai-smoke-changed-files"
          git diff --no-renames --name-only -z \
            "${BASE_SHA}...${HEAD_SHA}" > "${changed_paths}"
          crate_changed=false
          while IFS= read -r -d '' path; do
            if [[ "${path}" == crates/model-runtime-openai/* \
              || "${path}" == ".github/workflows/openai-smoke.yml" ]]; then
              crate_changed=true
              break
            fi
          done < "${changed_paths}"
          if [[ "${crate_changed}" != "true" ]]; then
            echo "smoke_required=false" >> "${GITHUB_OUTPUT}"
            echo "Not applicable: neither crates/model-runtime-openai/** nor this workflow's own definition changed."
            exit 0
          fi

          if [[ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]]; then
            echo "smoke_required=false" >> "${GITHUB_OUTPUT}"
            echo "::error::A fork changed the OpenAI adapter. Put the reviewed change on a trusted in-repository branch, then run: gh workflow run openai-smoke.yml --ref <trusted-branch>"
            exit 1
          fi

          echo "smoke_required=true" >> "${GITHUB_OUTPUT}"
          echo "Compatibility smoke is required for this same-repository adapter change."

  smoke:
    name: OpenAI live compatibility
    needs: gate
    if: ${{ needs.gate.outputs.smoke_required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    # Repository → Settings → Environments → openai-smoke holds
    # OPENAI_API_KEY. Its all-branches availability setting is documented
    # above and deliberately supplies no additional author-trust decision.
    environment: openai-smoke
    # No job-level concurrency group here. A fixed group shared across every
    # ref lets an unrelated smoke-required run evict this job's queued slot —
    # GitHub keeps at most one running and one pending member per group and
    # replaces the pending one when a third arrives, regardless of
    # cancel-in-progress — failing a required check that never tested its own
    # head. The workflow-level group above already releases a run's slot only
    # when a newer push supersedes the *same* ref. A concurrent real exchange
    # costs a small fraction of a cent; required-check integrity is worth more
    # than serializing that spend.
    runs-on: signalbox
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: rust
          save-if: false
      # Compile before the credential exists in any step environment, and
      # capture the resulting binary path: the credentialed step below
      # executes that binary directly rather than invoking Cargo a second
      # time, so no further build-freshness check (and therefore no build
      # script or procedural macro) ever runs while the key is readable, even
      # if this crate someday tracks OPENAI_API_KEY through `option_env!` or a
      # build script's `rerun-if-env-changed`.
      - name: Build the smoke test binary
        id: build
        run: |
          set -euo pipefail
          executable=$(cargo test --no-fail-fast -p signalbox-model-runtime-openai \
            --test live_smoke --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' \
            | tail -n1)
          test -n "${executable}" || { echo "::error::no test executable produced"; exit 1; }
          echo "executable=${executable}" >> "${GITHUB_OUTPUT}"
      # The key reaches only this step's environment — never argv, never
      # echoed, never exported to an earlier or later step.
      - name: Run one live exchange through the adapter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY}" \
            || { echo "the openai-smoke environment provides no API key"; exit 1; }
          result="${RUNNER_TEMP}/openai-smoke-live-result"
          "${{ steps.build.outputs.executable }}" \
            --ignored --exact the_openai_api_completes_one_exchange \
            2>&1 | tee "${result}"
          passed_count=$(sed -n \
            's/^test result: ok\. \([0-9][0-9]*\) passed;.*/\1/p' \
            "${result}")
          if [[ "${passed_count}" != "1" ]]; then
            echo "::error::Expected exactly one live smoke test to execute; libtest reported '${passed_count:-no passed count}'."
            exit 1
          fi

  required:
    name: OpenAI smoke compatibility
    needs: [gate, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVENT_NAME: ${{ github.event_name }}
      GATE_RESULT: ${{ needs.gate.result }}
      SMOKE_REQUIRED: ${{ needs.gate.outputs.smoke_required }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Report the binding result
        run: |
          set -euo pipefail
          if [[ "${GATE_RESULT}" != "success" ]]; then
            echo "The OpenAI smoke eligibility gate failed."
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "pull_request" \
            && "${SMOKE_REQUIRED}" == "true" \
            && "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]]; then
            echo "A fork pull request cannot use the credentialed OpenAI smoke."
            exit 1
          fi
          if [[ "${SMOKE_REQUIRED}" == "true" && "${SMOKE_RESULT}" != "success" ]]; then
            echo "The required OpenAI live compatibility smoke did not pass."
            exit 1
          fi
          if [[ "${SMOKE_REQUIRED}" == "true" ]]; then
            echo "The required OpenAI live compatibility smoke passed."
          else
            echo "Not applicable: the OpenAI adapter crate did not change."
          fi
