# PostgreSQL CI suite authority. Bazel reads features, filters and shard counts;
# scripts/postgres_integration_suites.py derives one workflow matrix row per
# suite and checks agreement with the workspace and documented local commands.
# Coverage measures its own report-only selection.
#
# name: suite identifier; target //:postgres_<name with underscores>.
# package: Cargo package containing the test binaries.
# features: additional Cargo features whose local implications Bazel enables.
# shards: libtest partitions per Bazel test target.
# skip: test-name substrings passed to libtest --skip.
# include_binaries / exclude_binaries: exact Cargo test-target names.

[[suite]]
name = "persistence"
package = "signalbox-persistence"
features = ["postgres-integration"]
# The long pole by an order of magnitude: 695 of the 1,134 ignored tests at
# the original measured baseline. Counts are a snapshot, taken with `cargo
# test --tests -- --ignored --list`; they justify the shard count and nothing
# depends on them staying exact.
#
# Two measurements shaped this count, from the two sides of a merge. With
# every test database writing to the shared scratch disks, this branch's
# expanded suite blew the workflow's 15-minute job ceiling at six shards, and
# an eight-shard partition still spent thirteen minutes executing before the
# fixed cap cancelled it — hence a twelve-way split. Separately, moving
# database state into memory cut a baseline-suite shard to about 3m45s of
# which roughly 1m15s was fixed cost — archive download, runner setup, image
# pull — which recombined the baseline suite to three shards. Post-merge both
# apply: the suite is larger than the three-shard measurement covered but runs
# on the in-memory substrate, so six shards keep comfortable headroom under
# the ceiling without spending twelve pool slots and their repeated fixed
# costs.
shards = 6
skip = []
exclude_binaries = ["runner_protocol_postgres"]

[[suite]]
name = "runner"
package = "signalbox-persistence"
features = ["postgres-integration"]
# The 263 runner-protocol tests ran as two partitions of under four minutes
# each at sixteen test threads with database state in memory; one partition of
# about six minutes pays the fixed shard costs once.
shards = 1
skip = []
include_binaries = ["runner_protocol_postgres"]

[[suite]]
name = "program-runtime"
package = "signalbox-program-runtime"
features = ["postgres-integration"]
shards = 1
skip = []

[[suite]]
name = "signalboxd"
package = "signalboxd"
features = ["test-support"]
# Two partitions ran under three and a half minutes each at sixteen test
# threads with database state in memory; one partition of about five minutes
# pays the fixed shard costs once and stays well short of the long pole.
shards = 1
# Subprocess entry points invoked only by their owning process tests.
skip = ["bridge_build_direct_invocation_fixture", "bridge_wait_"]

[[suite]]
name = "terminal-client"
package = "signalbox-client"
features = []
shards = 1
# A live-credential smoke, owner- and CI-excluded, that the previous `cargo
# test` invocation excluded with `--skip`.
skip = ["terminal_client_completes_the_real_anthropic_path"]
